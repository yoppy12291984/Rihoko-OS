<style>
  :root {
    --bg: #F1F8F4;
    --bg-parent: #F4F5F3;
    --card: #FFFFFF;
    --border: #DCE8E1;
    --ink: #234D4A;
    --ink-soft: #5B6B68;
    --coral: #FF7A5C;
    --coral-soft: #FFE3DB;
    --yellow: #FFC94A;
    --yellow-soft: #FFF3D6;
    --teal: #2F8F86;
    --teal-soft: #DCF1EE;
    --danger: #E0574B;
    --shadow: 0 2px 10px rgba(35,77,74,0.08);
    color-scheme: light;
  }
  /* ダークモードは保護者画面限定・手動トグル(こども画面は常に明るい配色) */
  .app--parent.dark-mode {
    --bg: #16211F;
    --bg-parent: #191B1A;
    --card: #1E2B29;
    --border: #2C3E3B;
    --ink: #EAF3F0;
    --ink-soft: #A8BDB8;
    --coral-soft: #3A2723;
    --yellow-soft: #3A331C;
    --teal-soft: #1D3634;
    color-scheme: dark;
  }
  body.parent-dark-bg { background: #14201e; }
  ruby { ruby-align: center; }
  rt { font-size: 0.55em; color: var(--ink-soft); font-weight: 700; user-select: none; }

  .worksheet-print {
    margin: 10px 20px; padding: 18px; background: #fff; color: #222; border-radius: 12px;
    border: 1px solid var(--border); font-family: "M PLUS Rounded 1c", sans-serif;
  }
  .worksheet-head { margin-bottom: 14px; }
  .worksheet-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .worksheet-meta { font-size: 12px; color: #555; }
  .worksheet-q { display: flex; gap: 8px; margin-bottom: 16px; align-items: flex-start; }
  .worksheet-qnum { font-weight: 800; flex: none; }
  .worksheet-qbody { flex: 1; font-size: 14px; line-height: 1.8; }
  .worksheet-answerline { margin-top: 6px; color: #444; }

  @media print {
    body { background: #fff !important; }
    .topbar, .tabbar, .no-print { display: none !important; }
    #app { max-width: 100%; padding-bottom: 0; }
    .worksheet-print { border: none; margin: 0; padding: 0; page-break-after: always; }
  }
  @page { size: A4; margin: 14mm; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "M PLUS Rounded 1c", sans-serif;
    background: var(--bg);
    background-image: linear-gradient(160deg, #DCF3E4 0%, #DCEFF7 35%, #E6E1F5 65%, #FBE3EC 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    transition: background 0.2s ease;
  }
  body.app--parent-active { background-image: none; background: var(--bg-parent); }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; position: relative; }
  .app--parent { max-width: 620px; }

  /* ---------- top bar ---------- */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding: 18px 20px 6px; }
  .topbar h1 { font-size: 15px; font-weight:700; color: var(--ink-soft); margin:0; letter-spacing:.02em; }
  .icon-btn {
    border:none; background: linear-gradient(145deg, #FFFFFF, var(--teal-soft));
    box-shadow: var(--shadow); border-radius: 50%;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg { width:21px; height:21px; }
  .icon-btn:active { transform: scale(0.92); }

  /* ---------- child home ---------- */
  .greeting { padding: 6px 20px 18px; }
  .greeting .hello { font-size: 22px; font-weight: 800; margin: 0 0 2px; }
  .greeting .date { font-size: 13px; color: var(--ink-soft); margin:0; }

  .section-label { font-size: 13px; font-weight:700; color: var(--ink-soft); margin: 22px 20px 10px; }

  .todo-list { display:flex; flex-direction:column; gap:10px; padding: 0 20px; }
  .todo-card {
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    display:flex; align-items:center; gap:14px; padding: 16px; border: 1px solid var(--border);
  }
  .todo-card.done { opacity: 0.55; }
  .check {
    width:34px; height:34px; border-radius:50%; border:2.5px solid var(--teal); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:none; font-size:16px; color:var(--teal);
  }
  .todo-card.done .check { background: var(--teal); color:#fff; }
  .todo-body { flex:1; min-width:0; }
  .todo-title { font-size: 16px; font-weight:700; margin:0 0 2px; }
  .todo-meta { font-size:12px; color: var(--ink-soft); margin:0; }
  .todo-card.done .todo-title { text-decoration: line-through; }
  .tag {
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;
    background: var(--teal-soft); color: var(--teal); margin-right:6px;
  }

  .empty-state {
    margin: 0 20px; padding: 26px 18px; text-align:center; border-radius:20px;
    background: var(--card); border: 1.5px dashed var(--border); color: var(--ink-soft); font-size:13.5px; line-height:1.7;
  }

  .next-card {
    margin: 0 20px; padding: 16px 18px; border-radius:20px; background: var(--yellow-soft);
    display:flex; align-items:center; gap:12px; border:1px solid var(--border);
  }
  .next-card .dot { width:10px; height:10px; border-radius:50%; background: var(--yellow); flex:none; }
  .next-card .txt { font-size:14px; }
  .next-card .txt b { font-weight:800; }

  .sora-btn {
    margin: 22px 20px 0; padding: 16px; border-radius: 20px; border:none; width: calc(100% - 40px);
    background: var(--coral-soft); color: var(--coral); font-family: inherit; font-weight:800; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .sora-btn:active { transform: scale(0.98); }
  .sora-btn.talking { background: var(--coral); color:#fff; }
  .sora-btn[disabled] { opacity:0.5; cursor:default; }
  .sora-status { text-align:center; font-size:12.5px; color: var(--ink-soft); margin: 8px 20px 0; min-height:16px; }
  .sora-transcript {
    margin: 10px 20px 0; padding: 14px 16px; border-radius:16px; background: var(--card);
    border:1px solid var(--border); font-size:13.5px; line-height:1.7; min-height: 20px; display:none;
  }
  .sora-transcript.show { display:block; }

  .summary-card {
    margin: 10px 20px 0; padding: 14px 16px; border-radius:16px; background: var(--yellow-soft);
    border:1px solid var(--border); font-size:13.5px; line-height:1.7;
  }
  .summary-card b { display:block; margin-bottom:2px; }
  .calendar-achievement { position:absolute; top:2px; right:3px; color:#e7a91a; font-size:14px; line-height:1; filter:drop-shadow(0 1px 0 #fff); }

  .quiz-card { margin: 0 20px; background: var(--card); border-radius:20px; box-shadow: var(--shadow); padding:18px; border:1px solid var(--border); }
  .quiz-q { font-size:15px; font-weight:700; margin: 0 0 14px; line-height:1.6; }
  .quiz-choice {
    display:block; width:100%; text-align:left; font-family:inherit; font-size:14px; padding:12px 14px;
    border-radius:14px; border:1.5px solid var(--border); background: var(--bg); color: var(--ink);
    margin-bottom:8px; cursor:pointer;
  }
  .quiz-choice.correct { background: var(--teal-soft); border-color: var(--teal); font-weight:700; }
  .quiz-choice.wrong { background: var(--coral-soft); border-color: var(--coral); }
  .quiz-explain { font-size:13px; color: var(--ink-soft); margin-top:10px; line-height:1.6; }
  .quiz-next { margin-top:14px; }
  .quiz-progress { font-size:12px; color: var(--ink-soft); margin: 0 20px 8px; }
  .quiz-start-btn {
    margin: 4px 20px 0; padding:14px; border-radius:16px; border:none; width: calc(100% - 40px);
    background: var(--teal-soft); color: var(--teal); font-family:inherit; font-weight:800; font-size:14px; cursor:pointer;
  }

  /* ---------- できた ---------- */
  .badge-row { display:flex; align-items:baseline; gap:6px; padding: 0 20px; color: var(--ink-soft); font-size:12.5px; }
  .badge-row b { color: var(--ink); font-size: 15px; }

  /* ---------- bottom nav ---------- */
  .tabbar {
    position: fixed; bottom:0; left:0; right:0; background: var(--card); border-top:1px solid var(--border);
    display:flex; justify-content:center; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
  }
  .tabbar-inner { max-width: 480px; width:100%; display:flex; }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none;
    font-family:inherit; color: var(--ink-soft); font-size:11px; font-weight:700; padding:6px 0; cursor:pointer;
  }
  .tab-item.active { color: var(--teal); }
  .tab-item .ic { font-size:20px; }

  /* ---------- parent view ---------- */
  .app--parent { background: var(--bg-parent); }
  .parent-header {
    display:flex; align-items:center; gap:10px; padding: 18px 20px 4px;
  }
  .parent-header h1 { font-size:18px; margin:0; font-weight:800; }
  .parent-tabs { display:flex; gap:8px; padding: 14px 20px 0; overflow-x:auto; }
  .ptab {
    border:none; background: var(--card); color: var(--ink-soft); font-family:inherit; font-weight:700;
    font-size:13px; padding:9px 16px; border-radius:99px; white-space:nowrap; cursor:pointer; border:1px solid var(--border);
  }
  .ptab.active { background: var(--teal); color:#fff; border-color: var(--teal); }

  .panel { margin: 16px 20px; background: var(--card); border-radius:16px; border:1px solid var(--border); padding: 16px 16px 18px; }
  .panel h2 { font-size:14px; margin:0 0 12px; font-weight:800; }
  .panel h3 { font-size: 12.5px; color: var(--ink-soft); margin: 18px 0 8px; font-weight:700; }

  .form-row { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .form-row label { font-size:12px; color: var(--ink-soft); font-weight:700; }
  .form-row input, .form-row select {
    font-family:inherit; font-size:14px; padding:9px 11px; border-radius:10px; border:1px solid var(--border);
    background: var(--bg-parent); color: var(--ink);
  }
  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:0 10px; }
  .btn-primary {
    font-family:inherit; font-weight:800; font-size:14px; padding:11px; border-radius:11px; border:none;
    background: var(--teal); color:#fff; cursor:pointer; width:100%; margin-top:4px;
  }
  .btn-primary:active { opacity:0.85; }

  .row-list { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .row-item {
    display:flex; align-items:center; gap:10px; padding: 10px 12px; border-radius:12px; background: var(--bg-parent);
    border:1px solid var(--border); font-size:13px;
  }
  .row-item .ri-main { flex:1; min-width:0; }
  .row-item .ri-title { font-weight:700; }
  .row-item .ri-sub { font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
  .del-btn {
    border:none; background:none; color: var(--danger); font-size:16px; cursor:pointer; padding:4px 6px; font-family:inherit;
  }
  .warn-note {
    font-size:12px; color: var(--coral); background: var(--coral-soft); padding:8px 12px; border-radius:10px; margin: 0 20px 4px;
  }
  .future-note {
    font-size:12px; color: var(--ink-soft); background: var(--bg-parent); border:1px dashed var(--border);
    padding: 10px 12px; border-radius:10px; margin-top: 10px;
  }
  .backlink { border:none; background:none; color: var(--ink-soft); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:6px 0; }

.keepsake-note{margin:14px 20px;font-size:13px;line-height:1.7;color:var(--ink-soft)}.keepsake-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}.keepsake-actions .btn-primary{margin:0;width:auto;font-size:13px}.worksheet-library{margin-bottom:24px}.worksheet-library button{text-align:left;font:inherit;color:inherit;cursor:pointer}.reward-card{margin:18px 20px;padding:24px;border:1px solid #ead89c;border-radius:22px;background:linear-gradient(135deg,#fff9dc,#fff3e7);text-align:center;color:#634d22}.reward-card h2{font-size:21px;margin:10px 0}.reward-card p{line-height:1.7}.reward-eyebrow{font-size:12px;font-weight:bold;letter-spacing:.1em}.reward-sticker{font-size:64px}.reward-total b{font-size:24px}.reward-help{font-size:11px}.sticker-album{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.sticker-album>div{background:#ffffffb0;border-radius:12px;padding:12px}.sticker-album span{font-size:36px;display:block}.sticker-album small{font-size:10px}.reward-pop .reward-sticker{animation:reward-pop .65s ease-out}@keyframes reward-pop{0%{transform:scale(.4) rotate(-15deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.reward-pop .reward-sticker{animation:none}}
.rally-board{margin-top:22px;padding:16px 8px;border:2px solid #e0c780;border-radius:18px;background:#fffdf5}.rally-board h3{font-size:16px;margin:0 0 18px}.rally-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 6px;position:relative}.rally-track:before{content:"";position:absolute;left:8%;right:8%;top:30px;bottom:30px;border:3px dashed #dfce9c;border-left:0;border-radius:0 20px 20px 0}.rally-stop{position:relative;z-index:1;display:flex;align-items:center;flex-direction:column;gap:3px;min-width:0}.rally-stop span{display:flex;align-items:center;justify-content:center;width:clamp(30px,8vw,54px);height:clamp(30px,8vw,54px);border:2px dashed #d6caa6;border-radius:50%;background:#fffdf5;font-size:20px;color:#aa9a72}.rally-stop small{font-size:9px;background:#fffdf5}.rally-stop.stamped span{border:2px solid #86b2a0;background:#e6f2e8;font-size:27px;transform:rotate(-8deg)}.rally-stop.next span{border:2px solid #d88c39;background:#fff0cd;color:#795319}.rally-stop:nth-child(6){grid-row:2;grid-column:5}.rally-stop:nth-child(7){grid-row:2;grid-column:4}.rally-stop:nth-child(8){grid-row:2;grid-column:3}.rally-stop:nth-child(9){grid-row:2;grid-column:2}.rally-stop:nth-child(10){grid-row:2;grid-column:1}.rally-history summary{cursor:pointer;padding:12px;font-weight:bold}.rally-board p{font-size:13px;margin:16px 0 0}
</style>

<style>.level-hero{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto 4px;padding:10px 14px;max-width:280px;border:2px solid #dbc16d;border-radius:16px;background:#fffdf2;box-shadow:0 4px 0 #e6d69f}
.level-portrait{width:54px;height:54px;flex:0 0 auto;border:3px solid #69502c;border-radius:8px;background:#182332;object-fit:cover;object-position:50% 16%;image-rendering:auto}
.level-copy{text-align:left}.level-copy strong{display:block;font-size:20px;color:#76551e}.level-copy span{font-size:11px;color:#786b50}
.level-meter{height:8px;margin-top:5px;border:1px solid #c5ae65;border-radius:2px;background:#eee5c5;overflow:hidden}.level-meter>i{display:block;height:100%;background:linear-gradient(90deg,#57bca8,#f4bf52);border-right:1px solid #fff}
.level-celebration{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 35%,#274b7ae8,#11182df5 70%);color:white;text-align:center;overflow:hidden}
.level-celebration[hidden]{display:none}.level-celebration__card{position:relative;z-index:2;width:min(86vw,390px);padding:26px 18px 22px;border:4px solid #ffe28a;border-radius:24px;background:linear-gradient(160deg,#305b89,#533f86);box-shadow:0 12px 0 #0d1427,0 20px 50px #0009;animation:level-card-in .8s cubic-bezier(.2,.9,.25,1.25)}
.level-celebration__title{margin:0;font-size:clamp(27px,9vw,44px);letter-spacing:.08em;color:#fff2a8;text-shadow:0 3px 0 #985d25,3px 0 0 #985d25,-3px 0 0 #985d25}
.level-celebration__trophy{font-size:78px;line-height:1;margin:6px 0;filter:drop-shadow(0 7px 0 #8a5724);animation:trophy-arrive .9s .2s both cubic-bezier(.15,.85,.25,1.25)}
.level-celebration__hero{display:flex;align-items:center;justify-content:center;gap:15px;margin:12px auto}.level-celebration__hero .level-portrait{width:74px;height:74px;border-color:#fff2a8;background:#b9e1d1;box-shadow:0 5px 0 #18243f}.level-celebration__level{font-size:17px}.level-celebration__level b{display:block;font-size:36px;color:#fff2a8}
.level-celebration__message{margin:12px 0 18px;font-weight:700;line-height:1.7}.level-celebration__close{min-height:48px;padding:10px 28px;border:3px solid #fff3b3;border-radius:999px;background:#ffcf55;color:#513a14;font:800 16px/1 inherit;box-shadow:0 5px 0 #a76921;cursor:pointer}
.firework{position:absolute;left:var(--x);top:var(--y);width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:0 -54px var(--c),38px -38px var(--c),54px 0 var(--c),38px 38px var(--c),0 54px var(--c),-38px 38px var(--c),-54px 0 var(--c),-38px -38px var(--c);animation:firework-burst 1.5s var(--d) infinite ease-out}
@keyframes level-card-in{from{transform:translateY(80vh) scale(.72);opacity:0}to{transform:none;opacity:1}}@keyframes trophy-arrive{from{transform:translateY(-70vh) rotate(-18deg) scale(.45)}to{transform:none}}@keyframes firework-burst{0%{transform:scale(.05);opacity:0}20%{opacity:1}75%,100%{transform:scale(1.35);opacity:0}}
@media(prefers-reduced-motion:reduce){.level-celebration__card,.level-celebration__trophy,.firework{animation:none}}
.adventure-map{min-width:0;margin:22px 0 8px;padding:16px 10px;border:2px solid #9cc8ae;border-radius:18px;background:linear-gradient(#effbea,#fff8d9);color:#385349;overflow:hidden}.adventure-head{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:0 5px 12px;text-align:left}.adventure-head p{margin:0;font-size:11px;font-weight:800;letter-spacing:.1em;color:#4d8873}.adventure-head h3{margin:3px 0 0;font-size:19px}.adventure-distance{font-size:11px;white-space:nowrap}.adventure-distance b{font-size:20px;color:#ba6a36}.adventure-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;min-width:0;padding:8px;border:2px solid #d9bd78;border-radius:14px;background:#dff0cf;overflow:hidden}.adventure-space{position:relative;display:grid;place-items:center;min-width:0;max-width:100%;aspect-ratio:1;overflow:hidden;border:1px solid #d2c48f;border-radius:7px;background:#fffdf2;font-size:clamp(13px,4vw,22px)}.adventure-space small{position:absolute;top:2px;left:3px;z-index:2;font-size:7px;color:#9b8d65}.adventure-space.is-event{background:#fff0b6}.adventure-space.is-current{z-index:1;border:3px solid #e47d58;background:#ffe5d6;box-shadow:inset 0 0 0 2px #ffffffaa}.adventure-space .level-portrait{width:82%;height:82%;max-width:100%;max-height:100%;border-width:1px;border-radius:3px}.adventure-roll{display:block;width:min(100%,270px);min-height:50px;margin:14px auto 6px;border:2px solid #fff0a4;border-radius:999px;background:#e88845;color:#fff;font:800 16px/1 inherit;box-shadow:0 5px 0 #a84e30;cursor:pointer}.adventure-roll:disabled{opacity:.8}.adventure-result{margin:12px 0 4px!important}.adventure-result b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#fff;color:#b65c32;font-size:22px;box-shadow:0 3px 0 #d8c17a}.adventure-note{margin:8px 0 0!important;font-size:10px;color:#73877d}
@media(max-width:390px){.adventure-board{gap:3px;padding:5px}.adventure-space{border-radius:5px}}

<script>
/* アプリごとの端末資格。通信障害と登録解除を区別し、通常起動では通信を待たない。 */
(function(root){
  'use strict';
  function create(options){
    var device=null;
    function remember(value){
      if(!value||!value.device||!/^[A-Za-z0-9_-]{43}$/.test(value.session||''))throw new Error('invalid_device');
      options.storage.setItem(options.key,JSON.stringify(value));device=value;return value;
    }
    function forget(){device=null;options.storage.removeItem(options.key);options.lock();}
    async function request(body){
      if(!device)throw new Error('registration_required');
      var result=await options.transport(Object.assign({},body,{familySession:device.session}));
      if(result.error==='device_revoked'){forget();throw new Error('device_revoked');}
      if(result.error)throw new Error(result.error);
      return result;
    }
    async function check(){
      try{var info=await request({action:'authCheck'});device.manager=info.manager===true;remember(device);options.status('ready');}
      catch(e){if(e.message!=='device_revoked')options.status('offline');}
    }
    function boot(){
      var saved;try{saved=JSON.parse(options.storage.getItem(options.key)||'null');}catch(_){}
      if(saved&&saved.device&&/^[A-Za-z0-9_-]{43}$/.test(saved.session||'')){device=saved;options.open();return check();}
      options.lock();return Promise.resolve();
    }
    return {boot:boot,remember:remember,request:request,check:check,forget:forget,current:function(){return device;}};
  }
  if(typeof module!=='undefined'&&module.exports)module.exports={create:create};else root.DeviceAccess={create:create};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* 保存を確定した日記・プリント・スタンプの共有。未送信も一つのJSONへ原子的に保存する。 */
(function(root){
  'use strict';
  var names=['diaries','worksheets','rewards'];
  var legacy={diaries:'rihoko-kumi-diaries-v1',worksheets:'riho-worksheets-v1',rewards:'riho-rewards-v1'};
  function create(storage,request,notify){
    var key='riho-keepsake-sync-v1',running=null,send=request;
    var uid=function(){return 'op-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);};
    function load(){
      var raw=storage.getItem(key);
      if(raw)return JSON.parse(raw);
      var s={records:{diaries:[],worksheets:[],rewards:[]},queue:[]};
      names.forEach(function(c){
        var list=JSON.parse(storage.getItem(legacy[c])||'[]');
        if(!Array.isArray(list))throw new Error('保存データを読み込めません');
        list.forEach(function(item){
          item=JSON.parse(JSON.stringify(item));if(c==='rewards')item.id=item.date;
          if(!item.id)throw new Error('保存データのIDがありません');
          s.queue.push({collection:c,item:item,base:null,opId:uid()});
        });
      });
      // 旧キーは移行前の控えとして残す。書込み失敗時は移行済みにしない。
      storage.setItem(key,JSON.stringify(s));return s;
    }
    function status(v){if(notify)notify(v);if(root&&root.dispatchEvent&&typeof root.CustomEvent==='function')root.dispatchEvent(new root.CustomEvent('keepsake-status',{detail:{status:v}}));}
    function read(c){
      var s=load(),map=new Map(s.records[c].map(function(r){return [r.item.id,r.item];}));
      s.queue.filter(function(o){return o.collection===c;}).forEach(function(o){map.set(o.item.id,o.item);});
      return Array.from(map.values()).sort(function(a,b){return String(a.date||a.createdAt||a.id).localeCompare(String(b.date||b.createdAt||b.id));});
    }
    function save(c,item){
      var s=load();item=JSON.parse(JSON.stringify(item));if(c==='rewards')item.id=item.date;
      if(names.indexOf(c)<0||!item.id)throw new Error('保存形式が不正です');
      var record=s.records[c].find(function(r){return r.item.id===item.id;});
      s.queue.push({collection:c,item:item,base:record?record.revision:null,opId:uid()});
      storage.setItem(key,JSON.stringify(s));status('pending');refresh();return item;
    }
    function refresh(){
      if(running)return running;if(!send){status('local');return Promise.resolve();}
      running=(async function(){
        try{
          status('syncing');
          do {
            var s=load(),batch=s.queue.filter(function(o,i,a){return a.findIndex(function(x){return x.collection===o.collection&&x.item.id===o.item.id;})===i;}).slice(0,10);
            var reply=await send({action:'keepsakeSync',changes:batch});
            if(!reply||reply.version!==1||!names.every(function(c){return Array.isArray(reply.records&&reply.records[c]);})||!Array.isArray(reply.acked))throw new Error('共有先を更新してください');
            var latest=load(),ids=new Set(reply.acked);
            if(batch.some(function(o){return !ids.has(o.opId);}))throw new Error('共有の保存を確認できません');
            latest.queue=latest.queue.filter(function(o){return !ids.has(o.opId);});
            // 送信中・連続編集の次の操作を、自分の直前の保存へつなぐ。
            batch.forEach(function(o){var record=reply.records[o.collection].find(function(r){return r.revision===o.opId;});
              if(record)latest.queue.forEach(function(next){if(next.collection===o.collection&&next.item.id===o.item.id&&next.base===o.base){next.base=record.revision;next.item.id=record.item.id;}});
            });
            latest.records=reply.records;storage.setItem(key,JSON.stringify(latest));
            status(latest.queue.length?'pending':'synced');
          }while(load().queue.length);
        }catch(e){status('error');}
        finally{running=null;}
      })();return running;
    }
    return {read:read,save:save,refresh:refresh,connect:function(fn){send=fn;return refresh();}};
  }
  if(typeof module!=='undefined'&&module.exports)module.exports={create:create};
  else {
    var store=create(root.localStorage,null,function(value){
      var node=document.getElementById('keepsakeSyncStatus');
      if(node)node.textContent={local:'日記・プリント・スタンプ：この端末に保存',pending:'日記・プリント・スタンプ：未送信の記録があります',syncing:'日記・プリント・スタンプを共有中…',synced:'日記・プリント・スタンプ：共有済み',error:'日記・プリント・スタンプ：共有できません。記録は端末に残っています。「共有を更新」で再試行できます。'}[value];
      if(value==='synced')root.dispatchEvent(new Event('keepsakes-updated'));
    });
    root.KeepsakeSync=store;
  }
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* WebRTC音声接続。開始・終了の競合で古いマイクや会話を残さない。 */
(function () {
  'use strict';
  let active = null;
  function stop() {
    const s = active; active = null;
    if (!s) return;
    clearTimeout(s.timer); clearTimeout(s.connectTimer); clearTimeout(s.replyTimer); s.abort.abort();
    if (s.dc) { s.dc.onopen = s.dc.onmessage = s.dc.onclose = null; s.dc.close(); }
    if (s.pc) { s.pc.ontrack = s.pc.oniceconnectionstatechange = null; s.pc.close(); }
    if (s.stream) s.stream.getTracks().forEach(t => t.stop());
    const audio = document.getElementById('soraAudio');
    if (audio) { audio.pause(); audio.srcObject = null; }
  }
  async function start(options) {
    stop();
    const s = {abort:new AbortController(), items:new Map(), order:[], pending:new Set(), turn:'connecting', options};
    active = s;
    const live = () => active === s;
    const status = text => { if (live()) options.onStatus(text); };
    const fail = error => { if (live()) { stop(); options.onError(error); } };
    s.setTurn = turn => { if(live()) { s.turn=turn; if(options.onTurn)options.onTurn(turn); } };
    s.fail = fail;
    s.ready = () => { clearTimeout(s.replyTimer); s.setTurn('ready'); status('「話しはじめる」を押してね。'); };
    const emit = () => {
      if (live()) options.onMessages(s.order.map(id => s.items.get(id)).filter(x => x && x.text));
    };
    function item(id, role, previous) {
      if (!s.items.has(id)) {
        s.items.set(id, {id,role,text:''});
        const index = s.order.indexOf(previous);
        if (index >= 0) s.order.splice(index + 1, 0, id); else s.order.push(id);
      }
      return s.items.get(id);
    }
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('このブラウザーではマイクを使えません。Safariで開いてね。');
      status('マイクを準備しています…');
      let stream;
      const constraints = {echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1};
      if (options.deviceId) constraints.deviceId = {exact:options.deviceId};
      try { stream = await navigator.mediaDevices.getUserMedia({audio:constraints}); }
      catch (err) {
        if (err.name === 'OverconstrainedError' && !options.deviceId) stream = await navigator.mediaDevices.getUserMedia({audio:true});
        else throw err;
      }
      if (!live()) { stream.getTracks().forEach(t => t.stop()); return; }
      s.stream = stream;
      const track = stream.getAudioTracks()[0];
      track.enabled = false;
      options.onDevice(track.label || '端末が選んだマイク');
      status('音声AIにつないでいます…');
      s.connectTimer = setTimeout(() => fail(new Error('接続に時間がかかっています。通信を確認してもう一度ためしてね。')),45000);
      const token = await FamilyAuth.request({action:'token',persona:options.persona,audioMode:options.audioMode});
      if (!live()) return;
      if (!token.value) throw new Error('音声AIの準備ができませんでした。');
      const pc = s.pc = new RTCPeerConnection();
      const audio = document.getElementById('soraAudio');
      audio.autoplay = true; audio.playsInline = true; audio.volume = options.audioMode === 'headphones' ? 1 : 0.75;
      pc.ontrack = event => {
        if (!live()) return;
        audio.srcObject = event.streams[0];
        audio.play().catch(() => fail(new Error('音声を再生できませんでした。もう一度「話す」を押してね。')));
      };
      pc.oniceconnectionstatechange = () => {
        if (!live()) return;
        clearTimeout(s.timer);
        const lost = () => fail(new Error('接続が切れました。話した内容は残っています。もう一度つないでね。'));
        if (pc.iceConnectionState === 'disconnected') s.timer = setTimeout(lost,8000);
        else if (['failed','closed'].includes(pc.iceConnectionState)) lost();
      };
      stream.getTracks().forEach(t => pc.addTrack(t,stream));
      const dc = s.dc = pc.createDataChannel('oai-events');
      dc.onopen = () => {
        if (!live()) return;
        status('ボタンで話す準備をしています…');
        dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',audio:{input:{turn_detection:null}}}}));
      };
      dc.onclose = () => fail(new Error('音声の接続が終わりました。もう一度つないでね。'));
      dc.onmessage = event => {
        if (!live()) return;
        let e; try { e = JSON.parse(event.data); } catch (_) { return; }
        if(e.type==='session.updated' && s.turn==='connecting' && e.session && e.session.audio && e.session.audio.input && e.session.audio.input.turn_detection===null){
          clearTimeout(s.connectTimer); options.onReady(); s.ready();
        }
        if(e.type==='input_audio_buffer.committed'){
          s.pending.delete('commit'); s.pending.add(e.item_id);
          if(s.wantReply){s.wantReply=false; dc.send(JSON.stringify({type:'response.create'}));}
        }
        if (e.type === 'conversation.item.created' || e.type === 'conversation.item.added') {
          if (e.item && ['user','assistant'].includes(e.item.role)) item(e.item.id,e.item.role,e.previous_item_id);
        }
        if (e.type === 'conversation.item.input_audio_transcription.delta') {
          item(e.item_id,'user').text += e.delta || ''; emit();
        }
        if (e.type === 'conversation.item.input_audio_transcription.completed') {
          item(e.item_id,'user').text = e.transcript || ''; s.pending.delete(e.item_id); emit();
        }
        if (e.type === 'conversation.item.input_audio_transcription.failed') {
          s.pending.delete(e.item_id); options.onNotice('聞き取りができなかった部分があります。もう一度話すか、文字で直してね。');
        }
        if (e.type === 'response.output_audio_transcript.delta') { item(e.item_id,'assistant').text += e.delta || ''; emit(); }
        if (e.type === 'response.output_audio_transcript.done') { item(e.item_id,'assistant').text = e.transcript || ''; emit(); }
        if (e.type === 'output_audio_buffer.started') {s.setTurn('replying'); status('AIの番だよ。聞いてね。');}
        if (e.type === 'output_audio_buffer.stopped' && s.turn==='replying') s.ready();
        if(e.type==='response.done'){
          const r=e.response||{};
          const hasAudio=(r.output||[]).some(x=>(x.content||[]).some(c=>c.type==='audio'||c.type==='output_audio'));
          if(r.status==='failed'||r.status==='incomplete'){options.onNotice('返事を最後まで受け取れませんでした。もう一度話してね。');s.ready();}
          else if(!hasAudio && s.turn==='replying')s.ready();
        }
        if (e.type === 'error') fail(new Error('音声AIでエラーが起きました。もう一度つないでね。'));
      };
      const offer = await pc.createOffer(); if (!live()) return;
      await pc.setLocalDescription(offer); if (!live()) return;
      const response = await fetch('https://api.openai.com/v1/realtime/calls', {
        method:'POST',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/sdp'},body:offer.sdp,signal:s.abort.signal
      });
      if (!response.ok) throw new Error('音声AIにつながりませんでした（'+response.status+'）。');
      const answer = await response.text(); if (!live()) return;
      await pc.setRemoteDescription({type:'answer',sdp:answer});
    } catch (err) {
      if (err.name === 'NotAllowedError') err = new Error('マイクを使う許可が必要です。iPhoneのSafari設定を確認してね。');
      if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') err = new Error('選んだマイクが見つかりません。「端末におまかせ」でつなぎ直してね。');
      fail(err);
    }
  }
  function beginTurn(){
    const s=active;if(!s||s.turn!=='ready'||s.dc.readyState!=='open')return;
    s.dc.send(JSON.stringify({type:'input_audio_buffer.clear'}));
    s.startedAt=Date.now();s.stream.getAudioTracks().forEach(t=>{t.enabled=true;});
    s.setTurn('recording');s.options.onStatus('聞いているよ。話し終わったら「話し終わった・送る」を押してね。');
  }
  function commitTurn(reply){
    const s=active;if(!s||s.turn!=='recording')return false;
    if(Date.now()-s.startedAt<300){s.options.onNotice('少し話してから「話し終わった・送る」を押してね。');return false;}
    s.stream.getAudioTracks().forEach(t=>{t.enabled=false;});
    s.wantReply=reply;s.pending.add('commit');s.setTurn(reply?'replying':'finishing');
    s.options.onStatus(reply?'送ったよ。AIの返事を待っています…':'最後の言葉を受け取っています…');
    s.dc.send(JSON.stringify({type:'input_audio_buffer.commit'}));
    if(reply)s.replyTimer=setTimeout(()=>s.fail(new Error('返事に時間がかかっています。もう一度つないでね。')),60000);
    return true;
  }
  async function finish() {
    const s = active;
    if (!s) return;
    if (s.stream) s.stream.getAudioTracks().forEach(t => { t.enabled = false; });
    if(s.turn==='recording')commitTurn(false);
    s.wantReply=false;
    const until = Date.now()+5000;
    while (active === s && s.pending.size && Date.now()<until) await new Promise(resolve => setTimeout(resolve,100));
    if (active === s) {
      if(s.pending.size)s.options.onNotice('最後の言葉を受け取りきれませんでした。日記にする前に文字で足してね。');
      stop();
    }
  }
  window.VoiceSession = {start,stop,finish,beginTurn,sendTurn:()=>commitTurn(true)};
})();

</script>
<script>
/* 会話画面と、本人が確認して保存する端末内の日記。 */
(function () {
  'use strict';
  const KEY = 'rihoko-kumi-diaries-v1';
  const states = {};
  let root = null, persona = null;
  const esc = value => String(value || '').replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  function initial() { return {phase:'idle',turn:'connecting',status:'つないでから「話しはじめる」を押してね。',mode:'speaker',deviceId:'',devices:[],device:'',messages:[],source:'',draft:null,busy:false,notice:'',summary:'',session:0,date:today()}; }
  function diaries() {
    const value = window.KeepsakeSync ? KeepsakeSync.read('diaries') : JSON.parse(localStorage.getItem(KEY) || '[]');
    if (!Array.isArray(value)) throw new Error('保存した日記を読み込めませんでした。');
    return value;
  }
  function draw() {
    if (!root || !persona) return;
    const s = states[persona], kumi = persona === 'kumi', name = kumi ? 'Kumi' : 'Sola';
    const active = s.phase !== 'idle';
    root.innerHTML = '<section class="voice-studio '+(kumi?'voice-kumi':'')+'"><header><span class="voice-badge">'+(kumi?'きょうの日記':'えいごの友だち')+'</span><h2>'+name+'とおはなし</h2><p>'+(kumi?'今日あったことを、日本語で聞かせてね。':'好きなことを、ひとことずつ話そう。日本語でも大丈夫。')+'</p></header>'+
      '<div class="voice-card"><label>音の出し方<select id="voiceMode" '+(active?'disabled':'')+'><option value="speaker" '+(s.mode==='speaker'?'selected':'')+'>iPhone・iPadのスピーカー</option><option value="headphones" '+(s.mode==='headphones'?'selected':'')+'>AirPods・イヤホン</option></select></label>'+
      '<p class="voice-help">'+(s.mode==='headphones'?'先にAirPodsをiPhoneへ接続してね。音が本体から出るときは、コントロールセンターで出力先をAirPodsにしてから話そう。':'静かな場所で、マイクの近くから話してね。考える時間も待つよ。')+'</p>'+
      (s.devices.length?'<label>使うマイク<select id="voiceMic" '+(active?'disabled':'')+'><option value="">端末におまかせ</option>'+s.devices.map(d=>'<option value="'+esc(d.deviceId)+'" '+(s.deviceId===d.deviceId?'selected':'')+'>'+esc(d.label)+'</option>').join('')+'</select></label>':'')+
      (s.device?'<p class="voice-help">マイク：'+esc(s.device)+'</p>':'')+
      '<p class="voice-help">① 話しはじめる → ② 話し終わった・送る → ③ '+name+'の返事。ボタンを押すまで、AIは話しはじめません。</p>'+
      (s.phase==='talking'?'<button class="voice-primary '+(s.turn==='recording'?'voice-recording':'')+'" id="voiceTurn" '+(!['ready','recording'].includes(s.turn)?'disabled':'')+'>'+(s.turn==='recording'?'話し終わった・送る':s.turn==='ready'?'🎤 話しはじめる':name+'の返事を聞いてね…')+'</button>':'')+
      '<button class="'+(active?'voice-secondary':'voice-primary')+'" id="voiceToggle" '+(s.busy||s.phase==='finishing'?'disabled':'')+'>'+(s.phase==='finishing'?'最後の言葉を受け取っています…':active?'会話をおわる':name+'につなぐ')+'</button>'+
      '<p id="voiceStatus" class="voice-status" role="status">'+esc(s.status)+'</p><p id="voiceNotice" class="voice-notice" role="alert">'+esc(s.notice)+'</p></div>'+
      '<div class="voice-card"><h3>話したこと</h3><p class="voice-help">聞き取りが違っていたら、もう一度ゆっくり話してね。</p><div id="voiceMessages" class="voice-messages" aria-label="会話の文字"></div></div>'+
      (kumi?diaryEditor(s,active):s.summary?'<div class="voice-card">'+esc(s.summary)+'</div>':'')+
      (kumi?diaryList():'')+'</section>';
    root.querySelector('#voiceMode').onchange = e => { s.mode=e.target.value; draw(); };
    const mic=root.querySelector('#voiceMic'); if(mic) mic.onchange=e=>{s.deviceId=e.target.value;};
    root.querySelector('#voiceToggle').onclick = () => active ? end(persona,true) : begin(persona);
    const turnButton=root.querySelector('#voiceTurn');if(turnButton)turnButton.onclick=()=>{s.notice='';if(s.turn==='recording')VoiceSession.sendTurn();else VoiceSession.beginTurn();};
    paintMessages();
    if (kumi) bindDiary(s);
  }
  function paintMessages() {
    if (!root || !persona) return;
    const s=states[persona], box=root.querySelector('#voiceMessages');
    if (!box) return;
    const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    box.innerHTML=s.messages.length?s.messages.map(m=>'<div class="voice-line '+(m.role==='user'?'voice-child':'')+'"><b>'+esc(m.role==='user'?'Rihoko':persona==='kumi'?'Kumi':'Sola')+'</b><p>'+esc(m.text)+'</p></div>').join(''):'<p class="voice-help">ここにRihokoと'+(persona==='kumi'?'Kumi':'Sola')+'の言葉が出るよ。</p>';
    if(atBottom) box.scrollTop=box.scrollHeight;
  }
  function status(p,text) {
    states[p].status=text;
    if(root&&persona===p) {const el=root.querySelector('#voiceStatus');if(el) el.textContent=text;}
  }
  async function begin(p) {
    const s=states[p];
    if(s.phase!=='idle'||s.busy) return;
    s.phase='connecting';s.turn='connecting';s.notice='';s.session++;
    const session=s.session, prior=s.messages.slice();
    draw();
    await VoiceSession.start({persona:p,audioMode:s.mode,deviceId:s.deviceId,
      onStatus:text=>status(p,text),
      onReady:()=>{s.phase='talking'; if(persona===p)draw();},
      onTurn:turn=>{if(s.session!==session)return;s.turn=turn;if(persona===p)draw();},
      onDevice:label=>{
        s.device=label;
        navigator.mediaDevices.enumerateDevices().then(all=>{
          s.devices=all.filter(d=>d.kind==='audioinput'&&d.deviceId&&d.label).map(d=>({deviceId:d.deviceId,label:d.label}));
          if(persona===p) draw();
        }).catch(()=>{});
      },
      onMessages:messages=>{
        if(s.session!==session)return;
        s.messages=prior.concat(messages.map(m=>({...m,id:session+':'+m.id})));
        if(persona===p)paintMessages();
      },
      onNotice:text=>{s.notice=text;if(persona===p)draw();},
      onError:err=>{s.phase='idle';s.notice=err.message;collectSource(p);status(p,'話したことは画面に残っています。');if(persona===p)draw();}
    });
  }
  function collectSource(p) {
    const s=states[p];
    // 編集済みの文章を消さず、まだ取り込んでいない本人の発言だけを追加。
    if(!s.collected)s.collected=new Set();
    const fresh=s.messages.filter(m=>m.role==='user'&&!s.collected.has(m.id));
    fresh.forEach(m=>s.collected.add(m.id));
    if(fresh.length)s.source=[s.source,...fresh.map(m=>m.text)].filter(Boolean).join('\n');
  }
  async function end(p,grace) {
    const s=states[p];if(!s||s.phase==='idle'||s.phase==='finishing')return;
    const connected=s.phase==='talking'; s.phase='finishing';if(persona===p)draw();
    if(grace&&connected)await VoiceSession.finish();else VoiceSession.stop();
    s.phase='idle';collectSource(p);status(p,p==='kumi'?'話したことをたしかめて、日記にしよう。':'お話ししたね。また話そう。');
    if(persona===p)draw();
    if(p==='sola'&&s.messages.some(m=>m.role==='user')&&!s.busy){
      s.busy=true;if(persona===p)draw();
      try {
        const transcript=s.messages.map(m=>(m.role==='user'?'Rihoko':'Sola')+': '+m.text).join('\n');
        const result=await FamilyAuth.request({action:'log',transcript});
        s.summary=result.summary&&result.summary.comment||'';
        if(result.summary&&(result.summary.error||result.summary._saveError))s.notice='会話は終了しましたが、学習記録を保存できませんでした。';
      }catch(_){s.notice='会話は終了しましたが、学習記録を保存できませんでした。';}
      finally{s.busy=false;if(persona===p)draw();}
    }
  }
  function diaryEditor(s,active) {
    return '<div class="voice-card"><h3>日記にする</h3><label>話したことをたしかめよう<textarea id="diarySource" rows="5" maxlength="8000" '+(active||s.busy?'disabled':'')+' placeholder="文字で書き足してもいいよ">'+esc(s.source)+'</textarea></label>'+
      '<button id="diaryDraft" class="voice-secondary" '+(active||s.busy?'disabled':'')+'>'+(s.busy?'下書きを作っています…':'この内容で下書きを作る')+'</button>'+
      '<p class="voice-help">音声と下書きづくりにはAIを使います。「確認して保存」した日記をご家族の端末と共有します。未保存の下書きは共有しません。</p>'+
      (s.draft?'<div class="diary-review"><h3>読んで、直して、保存しよう</h3><label>日付<input id="diaryDate" type="date" value="'+esc(s.date)+'"></label><label>題名<input id="diaryTitle" maxlength="100" value="'+esc(s.draft.title)+'"></label><label>日記<textarea id="diaryBody" rows="7" maxlength="8000">'+esc(s.draft.body)+'</textarea></label><button id="diarySave" class="voice-primary" '+(active||s.busy?'disabled':'')+'>確認して保存</button></div>':'')+'</div>';
  }
  function diaryList() {
    try {
      const list=diaries();
      return '<div class="voice-card"><h3>保存した日記</h3><p class="voice-help">共有済みの日記は別の端末でも読めます。大切な日記は「ファイルに保存」でも残せるよ。</p>'+(!list.length?'<p>まだ日記はないよ。</p>':list.slice().reverse().map(d=>'<details><summary>'+esc(d.date)+'　'+esc(d.title)+'</summary><p class="diary-text">'+esc(d.body)+'</p><button class="voice-secondary" data-diary-export="'+esc(d.id)+'">ファイルに保存</button></details>').join(''))+'</div>';
    } catch(_){return '<p class="voice-notice">保存した日記を読み込めません。ブラウザーの保存設定を確認してね。</p>';}
  }
  function bindDiary(s) {
    root.querySelector('#diarySource').oninput=e=>{s.source=e.target.value;};
    root.querySelector('#diaryDraft').onclick=async()=>{
      if(!s.source.trim()){s.notice='話したことを入れてから押してね。';draw();return;}
      s.busy=true;s.notice='';draw();
      try {
        const result=await FamilyAuth.request({action:'diaryDraft',transcript:s.source});
        if(!result.draft||!result.draft.body)throw new Error('下書きを作れませんでした。');
        s.draft=result.draft;s.savedId=null;status('kumi','まだ保存していません。読んで、合っているかたしかめてね。');
      }catch(e){s.notice=e.name==='AbortError'?'時間がかかっています。少し待ってからもう一度ためしてね。':e.message;}
      finally{s.busy=false;if(persona==='kumi')draw();}
    };
    if(s.draft){
      root.querySelector('#diaryDate').oninput=e=>{s.date=e.target.value;};
      root.querySelector('#diaryTitle').oninput=e=>{s.draft.title=e.target.value;};
      root.querySelector('#diaryBody').oninput=e=>{s.draft.body=e.target.value;};
      root.querySelector('#diarySave').onclick=()=>{
        if(!s.date||!s.draft.title.trim()||!s.draft.body.trim()){s.notice='日付・題名・日記を入れてね。';draw();return;}
        try{
          const list=diaries(), id=s.savedId||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
          const entry={id,date:s.date,title:s.draft.title.trim(),body:s.draft.body.trim()};
          const index=list.findIndex(d=>d.id===id);if(index<0)list.push(entry);else list[index]=entry;
          if(window.KeepsakeSync)KeepsakeSync.save('diaries',entry);else localStorage.setItem(KEY,JSON.stringify(list));s.savedId=id;s.notice='';status('kumi','日記を保存したよ。共有状況は画面の上で確認できるよ。');
        }catch(_){s.notice='保存できませんでした。本文をコピーして残してね。ブラウザーの空き容量や保存設定を確認してください。';}
        draw();
      };
    }
    root.querySelectorAll('[data-diary-export]').forEach(button=>button.onclick=()=>{
      const entry=diaries().find(d=>d.id===button.dataset.diaryExport);if(!entry)return;
      const url=URL.createObjectURL(new Blob([entry.date+'\n'+entry.title+'\n\n'+entry.body],{type:'text/plain;charset=utf-8'}));
      const a=document.createElement('a');a.href=url;a.download='Kumi-'+entry.date+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
  }
  function mount(element,p) {
    if(persona&&persona!==p&&states[persona].phase!=='idle')end(persona,false);
    root=element;persona=p;
    if(!p||!element)return;
    if(!states[p])states[p]=initial();
    draw();
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&persona)end(persona,false);});
  window.addEventListener('pagehide',()=>VoiceSession.stop());
  // 入力中の本文はstatesに保持されるため、共有履歴を更新しても下書きを失わない。
  window.addEventListener('keepsakes-updated',()=>{if(root&&persona==='kumi')draw();});
  window.VoiceStudio={mount};
})();

</script>

    var h=document.createElement('h2');h.textContent='家族のアプリ登録';panel.append(h);
    var note=document.createElement('p');note.textContent='このアプリは登録済みです。日数による再ログインはありません。';panel.append(note);
    if(!device.manager)return;
    var invite=document.createElement('button');invite.className='btn-primary';invite.textContent='家族の招待コードを作る';panel.append(invite);
    var result=document.createElement('p');result.setAttribute('role','status');panel.append(result);
    invite.onclick=async function(){invite.disabled=true;try{
      var r=await core.request({action:'authCreateInvite'});result.textContent='24時間以内に一回使えます。ホーム画面のアプリから入力してください。';
      var input=document.createElement('input');input.readOnly=true;input.value=r.code;input.setAttribute('aria-label','家族の招待コード');panel.append(input);
      var copy=document.createElement('button');copy.textContent='コードをコピー';copy.onclick=function(){navigator.clipboard.writeText(r.code).catch(function(){input.select();});};panel.append(copy);
    }catch(e){result.textContent='通信できませんでした。登録は保持しています。';}finally{invite.disabled=false;}};
    try{
      var list=await core.request({action:'authDevices'});
      list.devices.forEach(function(d){var row=document.createElement('p');row.textContent=d.name+(d.current?'（この端末）':'');
        if(!d.current){var revoke=document.createElement('button');revoke.textContent='登録解除';revoke.onclick=async function(){if(!confirm(d.name+'の登録を解除しますか？'))return;try{await core.request({action:'authRevokeDevice',id:d.id});mountDevices();}catch(_){result.textContent='解除できませんでした。もう一度お試しください。';}};row.append(revoke);}panel.append(row);
      });
    }catch(_){result.textContent='一覧を取得できません。登録は保持しています。';}
  }
  window.FamilyAuth={boot:boot,request:function(body){return core.request(body);},mountDevices:mountDevices,isAuthorized:function(){return !!(core&&core.current());}};
})();

</script>
<script>
(function(){
  "use strict";

  var APP_VERSION = "2026.10.07.1";

  var STORAGE_KEY = "riho-study-state-v1";
  var state = {
    todos: [], events: [], units: [], routines: [], routineDone: {},
    view: "home", parentTab: "family", dbReady: false,
    familyDraft: null, familyMessage: "", familyDate: null, parentAdvanced: false,
    soraState: "idle", soraStatus: "", soraTranscript: "", soraLastSummary: null,
    quiz: null, // { questions, current, score, answered, finished, loading, subject }
    learningLogs: null, learningLogsLoading: false, quizLogs: null,
    usage: null, usageLoading: false,
    printLoading: false, printError: null, printExtract: null,
    parentDarkMode: false,
    childTheme: "gentle", showReading: true, focusedTaskId: null,
    calendarEvents: null, calendarLoading: false,
    weeklyReport: null, weeklyReportLoading: false,
    calMonth: null, calSelectedDate: null, // カレンダー(保護者・こども共通)
    routineDaysSelected: [0,1,2,3,4,5,6],
    tabOrder: null, // 保護者が並び替えたタブ順(nullならデフォルト)
    editingTodoId: null, editingEventId: null, editingRoutineId: null,
    eventRecurring: false, eventDaysSelected: [1,2,3,4,5],
    worksheetSubject: null, worksheet: null, worksheetShowAnswers: false
  };
  var db = null;
  var familySync = null, syncStatus = 'local';

  function loadLocal(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.todos = parsed.todos || [];
        state.events = parsed.events || [];
        state.units = parsed.units || [];
        state.routines = parsed.routines || [];
        state.routineDone = parsed.routineDone || {};
      }
      state.parentDarkMode = localStorage.getItem("riho-study-parent-dark") === "1";
      var appearance = {};
      try { appearance = JSON.parse(localStorage.getItem("riho-study-appearance-v1") || "{}") || {}; } catch(e3) { /* 表示設定が壊れていても学習データの読み込みを続ける */ }
      if (["gentle", "calm", "planner"].indexOf(appearance.theme) !== -1) state.childTheme = appearance.theme;
      state.showReading = appearance.showReading !== false;
      var savedOrder = localStorage.getItem("riho-study-tab-order");
      if (savedOrder) { try { state.tabOrder = JSON.parse(savedOrder); } catch(e2) {} }
    } catch(e) { /* ignore */ }
  }
  function saveLocal(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        todos: state.todos, events: state.events, units: state.units,
        routines: state.routines, routineDone: state.routineDone
      }));
    } catch(e) { /* ignore */ }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(s){
    if (!s) return "";
    var p = s.split("-");
    return p[1] + "/" + p[2];
  }
  var WEEK = ["日","月","火","水","木","金","土"];
  function fmtDateLong(s){
    var d = new Date(s + "T00:00:00");
    return (d.getMonth()+1) + "月" + d.getDate() + "日 (" + WEEK[d.getDay()] + ")";
  }

  var CATS = {
    "算数": {icon:"🔢", color:"teal"},
    "国語": {icon:"📖", color:"teal"},
    "理科": {icon:"🔬", color:"teal"},
    "社会": {icon:"🌏", color:"teal"},
    "英語": {icon:"🗣️", color:"teal"},
    "その他": {icon:"✏️", color:"teal"}
  };
  var UNDERSTAND = ["まだ","学習中","できる","復習が必要"];
  var EVENT_TYPES = { school: "学校", lesson: "習い事", test: "テスト", other: "その他" };

  /* ---------------- persistence layer (db capability, fallback to localStorage) ---------------- */

  function persistAdd(col, data){
    data.id = uid();
    state[col].push(data);
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(data.id).set(data).catch(function(){});
    }
    if (typeof syncUpsert === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'upsert',collection:col,item:data});
    }
  }
  function persistUpdate(col, id, patch){
    var arr = state[col];
    var full = null;
    for (var i=0;i<arr.length;i++){
      if (arr[i].id === id) { Object.assign(arr[i], patch); full = arr[i]; break; }
    }
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(id).update(patch).catch(function(){});
    }
    if (full && typeof syncUpsert === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'upsert',collection:col,item:full});
    }
  }
  function persistDelete(col, id){
    state[col] = state[col].filter(function(x){ return x.id !== id; });
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(id).delete().catch(function(){});
    }
    if (typeof syncDeleteItem === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'delete',collection:col,id:id});
    }
  }

  function initDb(){
    if (!window.claude || !window.claude.use) return;
    window.claude.use("db").then(function(ns){
      if (!ns) return;
      db = ns;
      ["todos","events","units","routines"].forEach(function(col){
        db.collection(col).onSnapshot(function(snap){
          state[col] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          saveLocal();
          render();
        }, function(){ /* fall back silently to local state */ });
      });
    }).catch(function(){});
  }

  // GAS(Googleスプレッドシート)から他端末分のデータを取り込み、この端末の表示にも反映する。
  // GitHub Pages環境(claude.aiのdb機能が使えない環境)向けの同期経路。
  // 初回の端末データ移行は保護者が選択し、未送信キューは端末に残す。
  function pullFromGas(){
    if (!FamilyAuth.isAuthorized()) return Promise.resolve();
    if (familySync) return familySync.refresh();
  }

  function initFamilySync(){
    if (typeof syncPull !== 'function') return;
    try {
      familySync = FamilySync.create({storage:localStorage,
        snapshot:function(){return {todos:state.todos,events:state.events,units:state.units,routines:state.routines,routineDone:state.routineDone};},
        pull:syncPull,
        send:function(op){
          if (op.type === 'done') return syncRoutineDone(op.key,op.done);
          if (op.type === 'delete') return syncDeleteItem(op.collection,op.id);
          return syncUpsert(op.collection,op.item);
        },
        apply:function(data){
          ['todos','events','units','routines','routineDone'].forEach(function(c){state[c] = data[c];});
          saveLocal();
          // 入力途中のフォームは再描画しない。画面遷移時に最新状態を表示する。
          if (state.view !== 'parent') render();
        },
        status:function(value){ syncStatus = value; var node = document.getElementById('familySyncStatus'); if (node) node.textContent = syncStatusText(); updateGlobalSyncBar(); }
      });
    } catch(e){syncStatus = 'storage-error';}
  }
  function syncStatusText(){
    return {local:'プレビュー：このPCだけに保存します',setup:'最初の共有設定が必要です。端末内の記録は保持しています。',syncing:'家族のデータを共有中…',synced:'家族のデータと共有できました',pending:'未送信の変更があります。「共有を更新」を押してください。',error:'共有できませんでした。変更はこの端末に残っています。通信が戻ったら再試行してください。','storage-error':'端末への保存を確認できません。ページを閉じずに保存設定を確認してください。'}[syncStatus];
  }
  function updateGlobalSyncBar(){
    var global=document.getElementById('globalSyncStatus'),family=document.getElementById('familySyncStatusGlobal');
    if(family)family.textContent='予定・ToDo：'+syncStatusText();
    if(!global)return;
    var keepsake=document.getElementById('keepsakeSyncStatus'),keepText=keepsake?keepsake.textContent:'';
    if(syncStatus==='syncing'||/共有中/.test(keepText))global.textContent='同期中…';
    else if(syncStatus==='error'||syncStatus==='storage-error'||/共有できません|未送信/.test(keepText))global.textContent='未送信があります。もう一度同期してください';
    else if(syncStatus==='setup')global.textContent='初回の共有設定を確認してください';
    else if(syncStatus==='synced'&&/共有済み/.test(keepText))global.textContent='✓ 最新の状態です';
    else global.textContent='同期できます';
  }
  function syncAllNow(){
    var button=document.getElementById('refreshKeepsakes');if(!button)return Promise.resolve();
    button.disabled=true;button.textContent='同期中…';
    var jobs=[KeepsakeSync.refresh()];if(familySync)jobs.push(familySync.refresh());
    return Promise.all(jobs.map(function(p){return Promise.resolve(p).catch(function(){return null;});})).then(function(){updateGlobalSyncBar();}).finally(function(){button.disabled=false;button.textContent='↻ 同期する';});
  }

  // ルーチンは「その日やったか」を日付ごとに記録する(ルーチン自体はテンプレートなので使い回す)
  function toggleRoutineDone(routineId, dateStr){
    var key = routineId + "|" + dateStr;
    state.routineDone[key] = !state.routineDone[key];
    render();
    saveLocal();
    if (typeof syncRoutineDone === "function") {
      if (familySync) familySync.enqueue({type:'done',key:key,done:state.routineDone[key]});
    }
  }
  function isRoutineDone(routineId, dateStr){
    return !!state.routineDone[routineId + "|" + dateStr];
  }
  // 指定した日付(曜日)に有効なルーチン一覧(除外日指定があれば除く)
  function routinesForDate(dateStr){
    var dow = new Date(dateStr + "T00:00:00").getDay();
    return state.routines.filter(function(r){
      var days = r.days || [0,1,2,3,4,5,6];
      return DailySupport.occurs(r, dateStr);
    });
  }
  // 今日のToDo(日付指定分)とルーチン(曜日に応じて)を合わせた一覧
  function combinedItemsForDate(dateStr){
    var fromTodos = state.todos.filter(function(t){ return t.date === dateStr; });
    var fromRoutines = routinesForDate(dateStr).map(function(r){
      return {
        id: "routine:" + r.id, title: r.title, category: r.category, minutes: r.minutes,
        priority: r.priority || 2, done: isRoutineDone(r.id, dateStr),
        isRoutine: true, routineId: r.id, dailyLife: r.dailyLife, period: r.period, kind: r.kind
      };
    });
    return fromTodos.concat(fromRoutines).sort(function(a,b){ return (a.priority||2)-(b.priority||2); });
  }

  /* ---------------- rendering ---------------- */

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function render(){
    if(window.RewardGames)RewardGames.check();
    if(state.view !== 'parent' && getVisibleTabs().indexOf(state.view) === -1) state.view = getVisibleTabs()[0];
    var app = document.getElementById("app");
    var isParent = state.view === "parent";
    app.className = isParent ? ("app--parent" + (state.parentDarkMode ? " dark-mode" : "")) : "";
    document.body.classList.toggle("parent-dark-bg", isParent && state.parentDarkMode);
    document.body.classList.toggle("app--parent-active", isParent);
    document.body.dataset.theme = isParent ? "parent" : state.childTheme;
    document.body.classList.toggle("hide-reading", !isParent && !state.showReading);
    app.innerHTML = isParent ? renderParent() : renderChild();
    bindEvents();
    if (window.VoiceStudio) VoiceStudio.mount(document.getElementById("voiceStudio"),state.view === "sora" ? "sola" : state.view === "kumi" ? "kumi" : null);
  }

  var TAB_DEFS = {
    home:     { icon: "🏠", label: "きょう" },
    manabu:   { icon: "📚", label: "まなぶ" },
    dekita:   { icon: "🌟", label: "できた" },
    sora:     { icon: "☁️", label: "Sola" },
    kumi:     { icon: "📖", label: "Kumi" },
    calendar: { icon: "📅", label: "カレンダー" }
  };
  var DEFAULT_TAB_ORDER = ["home","manabu","dekita","sora","kumi","calendar"];
  var tabPreferences = {hidden:[],start:'home'};
  function getVisibleTabs(){
    var order=getTabOrder().filter(function(id){return tabPreferences.hidden.indexOf(id)===-1;});
    return order.length ? order : ['home'];
  }
  function startupView(){return getVisibleTabs().indexOf(tabPreferences.start)!==-1 ? tabPreferences.start : getVisibleTabs()[0];}
  function saveTabPreferences(){try{localStorage.setItem('riho-study-tab-preferences-v1',JSON.stringify(tabPreferences));}catch(e){}}
  function renderTabPreferences(){
    var visible=getVisibleTabs();
    return '<div class="panel"><h2>表示するタブ・起動時の画面</h2><p class="ri-sub">この端末に自動保存します。非表示にしても記録は残ります。</p>'+getTabOrder().map(function(id){
      return '<label style="display:flex;align-items:center;gap:10px;margin:12px 0"><input type="checkbox" data-tabvisible="'+id+'" '+(visible.indexOf(id)!==-1?'checked ':'')+(visible.length===1&&visible[0]===id?'disabled':'')+'>'+TAB_DEFS[id].label+'</label>';
    }).join('')+'<label for="childStartupTab">起動時の画面</label><select id="childStartupTab">'+visible.map(function(id){return '<option value="'+id+'" '+(startupView()===id?'selected':'')+'>'+TAB_DEFS[id].label+'</option>';}).join('')+'</select></div>';
  }

  function getTabOrder(){
    var order = Array.isArray(state.tabOrder) ? state.tabOrder.filter(function(id,i,a){return TAB_DEFS[id] && a.indexOf(id) === i;}) : [];
    DEFAULT_TAB_ORDER.forEach(function(id){if(order.indexOf(id) === -1)order.push(id);});
    return order;
  }

  function renderChild(){
    var body = "";
    if (state.view === "home") body = renderHome();
    else if (state.view === "manabu") body = renderManabu();
    else if (state.view === "dekita") body = renderDekita();
    else if (state.view === "sora" || state.view === "kumi") body = renderSoraTab();
    else if (state.view === "calendar") body = renderParentCalendar();

    var order = getVisibleTabs();
    return (
      '<div class="topbar"><h1>Rihoko Study</h1>' +
      '<button class="icon-btn" id="gotoParent" title="保護者用" aria-label="保護者用の設定を開く">' +
        '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="12" r="3.2" stroke="#2F8F86" stroke-width="1.8"/>' +
        '<path d="M12 3.5v2.1M12 18.4v2.1M20.5 12h-2.1M5.6 12H3.5M17.7 6.3l-1.5 1.5M7.8 16.2l-1.5 1.5M17.7 17.7l-1.5-1.5M7.8 7.8L6.3 6.3" stroke="#2F8F86" stroke-width="1.8" stroke-linecap="round"/>' +
        '</svg></button></div>' +
      body +
      '<div class="tabbar"><div class="tabbar-inner">' +
        order.map(function(id){ return tabBtn(id, TAB_DEFS[id].icon, TAB_DEFS[id].label); }).join("") +
      '</div></div>'
    );
  }

  function tabBtn(id, icon, label){
    return '<button class="tab-item ' + (state.view===id?"active":"") + '" ' + (state.view===id?'aria-current="page" ':'') + 'data-tab="' + id + '">' +
      '<span class="ic nav-art nav-art--' + id + '">' + DailySupport.icon(id) + '</span>' + label + '</button>';
  }

  function greetingWord(){
    return "Hello Rihoko!";
  }

  function renderHome(){
    var today = todayStr();
    var todays = combinedItemsForDate(today);

    var html = '<div class="greeting"><p class="hello">' + greetingWord() + '</p>' +
      '<p class="date">' + fmtDateLong(today) + '</p></div>';

    var completed = todays.filter(function(t){ return t.done; }).length;
    var pending = todays.filter(function(t){ return !t.done; });
    var dailyLife = todays.filter(function(t){ return t.dailyLife; });
    if (dailyLife.length) {
      var left = dailyLife.filter(function(t){ return !t.done; }).length;
      html += '<section class="daily-check"><div class="daily-check-heading">' + DailySupport.icon('bag') + '<div><h2>わすれずチェック</h2><p>' + (left ? 'あと ' + left + 'こ。おうちの人とたしかめよう' : 'きょうのチェック、ぜんぶできたね') + '</p></div></div>' + dailyLife.map(renderTodoCard).join('') + '</section>';
    }
    var selected = pending.find(function(t){ return t.id === state.focusedTaskId; });
    var first = selected || pending[0];
    var questLabel = state.childTheme === "gentle" ? "きょうのクエスト" : "きょうの学習";
    html += '<section class="daily-hero" aria-label="きょうの進みぐあい"><div class="hero-eyebrow">' + questLabel + '</div>';
    if (first) {
      html += '<h2>' + (selected ? 'いまは、これに集中しよう' : 'ひとつずつ、できるをふやそう') + '</h2>' +
        '<p class="hero-task">' + addFurigana(first.title) + '</p>' +
        '<p class="hero-detail">' + (first.minutes ? 'めやす ' + escapeHtml(first.minutes) + '分 · ' : '') + 'あと ' + pending.length + 'こ</p>' +
        (selected ? '<button class="hero-start" data-toggle="' + escapeHtml(first.id) + '">できた！</button>' :
          '<button class="hero-start" data-focus-task="' + escapeHtml(first.id) + '">これをはじめる →</button>');
    } else {
      state.focusedTaskId = null;
      html += '<h2>' + (todays.length ? 'きょうの分、できたね！' : 'きょうは何をしてみよう？') + '</h2>' +
        '<p class="hero-detail">' + (todays.length ? 'がんばったね。ゆっくり休もう。' : '問題や英会話をえらんではじめられるよ。') + '</p>' +
        '<button class="hero-start" data-tab="' + (todays.length ? 'dekita' : 'manabu') + '">' + (todays.length ? 'できたことを見る' : 'まなぶを開く →') + '</button>';
    }
    if (todays.length) html += '<div class="daily-progress"><span>' + completed + ' / ' + todays.length + ' できた</span><progress value="' + completed + '" max="' + todays.length + '" aria-label="きょうの完了数"></progress></div>';
    html += '</section>' + renderRewardCard(false) + renderGameEntry() + '<div class="home-shortcuts"><button data-tab="sora"><span class="shortcut-symbol">S</span><span><b>Solaと話す</b><small>えいごで、ひとこと</small></span><span aria-hidden="true">↗</span></button>' +
      '<button data-tab="kumi"><span class="shortcut-symbol">K</span><span><b>Kumiと日記</b><small>きょうのことを、日本語で</small></span><span aria-hidden="true">↗</span></button></div>';
    html += '<div class="home-columns"><section><h2 class="section-label">きょうやること</h2>';
    if (todays.length === 0) {
      html += '<div class="empty-state">きょうやることは、まだないよ。<br>おうちの人といっしょに決めよう。</div>';
    } else {
      var otherTasks = todays.filter(function(t){ return !t.dailyLife; });
      html += otherTasks.length ? '<div class="todo-list">' + otherTasks.map(renderTodoCard).join("") + '</div>' : '<div class="empty-state">きょうやることは、上のチェックにまとまっているよ。</div>';
    }

    var next = nextEvent();
    html += '</section><section><h2 class="section-label">つぎの予定</h2>';
    if (next) {
      html += '<div class="next-card"><div class="dot"></div><div class="txt"><b>' + escapeHtml(next.title) +
        '</b><br>' + fmtDateLong(next.date) + (next.time ? " " + next.time : "") + '</div></div>';
    } else {
      html += '<div class="empty-state">つぎの予定はまだありません。</div>';
    }
    return html + '</section></div>';
  }

  function renderSoraTab(){
    return '<div id="voiceStudio"></div>';
  }

  function renderTodoCard(t){
    var cat = CATS[t.category] || CATS["その他"];
    return '<div class="todo-card ' + (t.done?"done":"") + '" data-id="' + t.id + '">' +
      '<button class="check" aria-label="' + escapeHtml(t.title) + '" aria-pressed="' + !!t.done + '" data-toggle="' + escapeHtml(t.id) + '">' + (t.done ? "✓" : "") + '</button>' +
      '<div class="todo-body">' +
      '<p class="todo-title">' + (t.dailyLife ? '' : cat.icon + ' ') + addFurigana(t.title) + '</p>' +
      '<p class="todo-meta"><span class="tag">' + (t.dailyLife ? (DailySupport.periods[t.period] || 'いつでも') : addFurigana(t.category||"その他")) + '</span>' + (t.done ? 'できたよ' : t.dailyLife ? 'まだチェックしていないよ' : t.minutes ? t.minutes + '分' : '') + '</p>' +
      '</div></div>';

  // 予定が指定日に発生するか(単発 or 毎週くり返し)を判定
  function eventOccursOnDate(ev, dateStr){
    if (!ev.recurring) return ev.date === dateStr;
    var dow = new Date(dateStr + "T00:00:00").getDay();
    if ((ev.days || []).indexOf(dow) === -1) return false;
    if (ev.startDate && dateStr < ev.startDate) return false;
    if ((ev.skipDates || []).indexOf(dateStr) !== -1) return false;
    return true;
  }

  function nextEvent(){
    var now = new Date();
    var best = null, bestDt = null;
    for (var i = 0; i < 60; i++) {
      var d = new Date(); d.setDate(d.getDate() + i);
      var dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      state.events.forEach(function(ev){
        if (!eventOccursOnDate(ev, dateStr)) return;
        var dt = new Date(dateStr + "T" + (ev.time || "23:59"));
        if (dt < now) return;
        if (!bestDt || dt < bestDt) { bestDt = dt; best = Object.assign({}, ev, { date: dateStr }); }
      });
      if (best) break;
    }
    return best;
  }

    var pick = learning.length ? learning[learning.length-1] : list[list.length-1];
    return pick.unit + (pick.page ? ("(" + pick.page + ")") : "");

    render();
    if (typeof fetchWorksheet !== "function") {
      state.worksheet = { loading: false, questions: [] };
      render();
      return;
    }
    var context = currentUnitContextFor(subject);
    fetchWorksheet(subject, context, 8).then(function(w){
      var entry = {id:uid(),subject:subject,context:context,date:todayStr(),worksheet:w};
      var saveError = "";

      var msg = String(err && err.message || err || "");

  function bindFamilyEvents(app){
    FamilyAuth.mountDevices();
    var refresh = document.getElementById('refreshFamilySync');
    if (refresh) refresh.onclick = function(){familySync.refresh().then(render);};
    var importButton = document.getElementById('importFamilySync');
    if (importButton) importButton.onclick = function(){familySync.refresh(true).then(render);};
    var adopt = document.getElementById('adoptFamilySync');
    if (adopt) adopt.onclick = function(){familySync.adopt().then(render);};
    app.querySelectorAll('[data-family-preset]').forEach(function(b){ b.onclick = function(){
      var p = DailySupport.presets[b.getAttribute('data-family-preset')];
      state.familyDraft = Object.assign({}, p, {days:p.days.slice()}); state.familyMessage = ''; render();
      document.getElementById('familyTitle').focus();
    }; });
    app.querySelectorAll('[data-family-edit]').forEach(function(b){ b.onclick = function(){
      var r = state.routines.find(function(x){return x.id === b.getAttribute('data-family-edit');});
      if (!r) return;
      state.familyDraft = Object.assign({}, r, {days:(r.days || []).slice()}); state.familyMessage = ''; render();
      document.getElementById('familyTitle').focus();
    }; });
    var cancel = document.getElementById('familyCancel');
    if (cancel) cancel.onclick = function(){state.familyDraft = null; render();};
    var form = document.getElementById('familyForm');
    if (form) form.oninput = function(){
      state.familyDraft.title = form.elements.title.value;
      state.familyDraft.period = form.elements.period.value;
      state.familyDraft.days = Array.from(form.querySelectorAll('input[name="day"]:checked')).map(function(c){return Number(c.value);});
    };
    if (form) form.onsubmit = function(e){
      e.preventDefault();
      var title = form.elements.title.value.trim();
      var days = Array.from(form.querySelectorAll('input[name="day"]:checked')).map(function(c){return Number(c.value);});
      var error = document.getElementById('familyError');
      if (!title || !days.length) { error.textContent = !title ? 'やることを入力してください。' : '曜日を1つ以上えらんでください。'; return; }
      var draft = state.familyDraft;
      var period = form.elements.period.value;
      if (state.routines.some(function(r){return r.id !== draft.id && r.title === title && r.period === period && (r.days || []).some(function(d){return days.indexOf(d) !== -1;});})) {error.textContent = '同じ内容が登録されています。「変更する」から直せます。'; return;}
      var data = {title:title,days:days,period:period,dailyLife:true,kind:draft.kind || 'check',category:draft.category || 'その他',priority:1,minutes:draft.minutes || 0};
      state.familyDraft = null; state.familyMessage = '保存しました。下の日付で、表示する曜日を確認できます。';
      if (draft.id) persistUpdate('routines',draft.id,data);
      else persistAdd('routines',Object.assign(data,{skipDates:[]}));
    };
    var date = document.getElementById('familyDate');
    if (date) date.onchange = function(){ if (date.value) {state.familyDate = date.value; render();} };
    app.querySelectorAll('[data-family-pause]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-pause'); var r = state.routines.find(function(x){return x.id === id;});
      state.familyMessage = r.paused ? '曜日の設定に合わせて、また表示します。' : 'お休み中にしました。「また表示する」で戻せます。';
      persistUpdate('routines',id,{paused:!r.paused});
    };});
    app.querySelectorAll('[data-family-skip]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-skip');
      var input = Array.from(app.querySelectorAll('[data-family-skipdate]')).find(function(x){return x.getAttribute('data-family-skipdate') === id;});
      if (!input.value) { input.focus(); return; }
      var r = state.routines.find(function(x){return x.id === id;});
      var skip = (r.skipDates || []).slice(); if (skip.indexOf(input.value) === -1) skip.push(input.value);
      state.familyMessage = 'お休みの日を保存しました。あとから取り消せます。'; persistUpdate('routines',id,{skipDates:skip});
    };});
    app.querySelectorAll('[data-family-unskip]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-unskip'); var date = b.getAttribute('data-date');
      var r = state.routines.find(function(x){return x.id === id;});
      state.familyMessage = 'お休みを取り消しました。'; persistUpdate('routines',id,{skipDates:(r.skipDates || []).filter(function(d){return d !== date;})});
    };});
  }

    if (!state.calMonth) {

    var year = parseInt(parts[0],10), month = parseInt(parts[1],10); // month:1-12
    var firstDay = new Date(year, month-1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startWeekday = firstDay.getDay();
    var today = todayStr();
    var rewardDates = {};
    try { StudyKeepsakes.rewards().forEach(function(r){ rewardDates[r.date] = true; }); } catch(e) {}

    var html = '<div class="panel">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
      '<button class="icon-btn" id="calPrevMonth" style="background:var(--bg-parent);"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#5B6B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<h2 style="margin:0;">' + year + '年' + month + '月</h2>' +
      '<button class="icon-btn" id="calNextMonth" style="background:var(--bg-parent);"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#5B6B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '</div>';

      WEEKDAY_LABELS.map(function(w){return '<div>'+w+'</div>';}).join("") + '</div>';

    var cells = [];
    for (var i=0;i<startWeekday;i++) cells.push('<div></div>');
    for (var day=1; day<=daysInMonth; day++){
      var dateStr = year + "-" + String(month).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      var items = combinedItemsForDate(dateStr);
      var hasEvent = state.events.some(function(e){ return eventOccursOnDate(e, dateStr); });
      var count = items.length;

      var isToday = dateStr === today;

      cells.push('<button data-caldate="' + dateStr + '" style="' +

        'position:relative;background:' + (isToday?"var(--teal-soft)":"var(--card)") + ';font-family:inherit;font-size:12px;color:var(--ink);' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;">' +
        (achieved ? '<span class="calendar-achievement" aria-label="ぜんぶできた日">★</span>' : '') +
        '<span>' + day + '</span>' +
        (count>0 ? '<span style="width:5px;height:5px;border-radius:50%;background:var(--coral);"></span>' : '') +
        (hasEvent ? '<span style="width:5px;height:5px;border-radius:50%;background:var(--yellow);"></span>' : '') +
        '</button>');
    }
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">' + cells.join("") + '</div>';
    html += '<div class="ri-sub" style="margin-top:8px;">⭐ ぜんぶできた日　🔴 ToDo・ルーチン　🟡 予定</div>';
    html += '</div>';

    if (state.calSelectedDate) {
      html += renderCalendarDayDetail_(state.calSelectedDate);

  function renderWeeklyMinutesChart(){
    var days = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      var mins = state.todos.filter(function(t){ return t.date === key && t.done; })
        .reduce(function(sum,t){ return sum + (t.minutes||0); }, 0);
      days.push({ label: WEEK[d.getDay()], mins: mins });
    }
    var max = Math.max(10, Math.max.apply(null, days.map(function(d){return d.mins;})));
    return '<div style="display:flex;align-items:flex-end;gap:8px;height:100px;">' +
      days.map(function(d){
        var h = Math.round((d.mins / max) * 80) + 4;
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">' +
          '<div style="font-size:10px;color:var(--ink-soft);margin-bottom:2px;">' + (d.mins||"") + '</div>' +
          '<div style="width:100%;background:var(--teal);border-radius:6px 6px 0 0;height:' + h + 'px;"></div>' +
          '<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">' + d.label + '</div>' +
          '</div>';
      }).join("") + '</div>';
  }

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- フリガナ ---------------- */
  // よく使う単語には固定の読みを振る(確実に効く分)。
  // AIが生成する文章(クイズ・週次レポート等)は、プロンプト側で「漢字(かな)」の
  // 形式で読みを添えるよう指示しており、furiganaFromParens_ でそれを<ruby>に変換する。
  var FURIGANA_DICT = [
    ["教科書","きょうかしょ"],["理解度","りかいど"],["提出物","ていしゅつぶつ"],
    ["持ち物","もちもの"],["宿題","しゅくだい"],["準備","じゅんび"],
    ["学校","がっこう"],["明日","あした"],["予定","よてい"],
    ["問題","もんだい"],["単元","たんげん"],["復習","ふくしゅう"],
    ["会話","かいわ"],["記録","きろく"],["行事","ぎょうじ"],
    ["範囲","はんい"],["算数","さんすう"],["国語","こくご"],
    ["理科","りか"],["社会","しゃかい"],["英語","えいご"],
    ["薬","くすり"],["飲む","のむ"],["練習","れんしゅう"],
    ["提出","ていしゅつ"],["期限","きげん"]
  ].sort(function(a,b){ return b[0].length - a[0].length; });

  function addFurigana(rawText){
    var escaped = escapeHtml(rawText);
    FURIGANA_DICT.forEach(function(pair){
      if (escaped.indexOf(pair[0]) === -1) return;
      escaped = escaped.split(pair[0]).join('<ruby>'+pair[0]+'<rt>'+pair[1]+'</rt></ruby>');
    });
    return escaped;
  }

  // AIが「漢字(かな)」の形式で返した読みを<ruby>タグに変換する。
  // かな以外が()内に来るケースは変換しない(誤爆防止)。
  function furiganaFromParens(rawText){
    var escaped = escapeHtml(rawText);
    return escaped.replace(/([\u4E00-\u9FFF]+)\(([\u3041-\u3096\u30FC]+)\)/g, function(m, kanji, kana){
      return '<ruby>' + kanji + '<rt>' + kana + '</rt></ruby>';
    });
  }

      tabPreferences.hidden=tabPreferences.hidden.filter(function(x){return x!==id;});if(!input.checked)tabPreferences.hidden.push(id);

  document.getElementById('refreshKeepsakes').onclick=syncAllNow;
  window.addEventListener('keepsake-status',updateGlobalSyncBar);
  updateGlobalSyncBar();

  pullFromGas();

  var renderedDay = todayStr();
  function refreshDay(){
    if (renderedDay !== todayStr() && state.view !== 'parent') { renderedDay = todayStr(); state.focusedTaskId = null; render(); }
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) {refreshDay(); if (state.view !== 'parent') pullFromGas();} });
  setInterval(refreshDay, 60000);
  setInterval(function(){ if (!document.hidden && state.view !== 'parent') pullFromGas(); }, 45000);
  window.addEventListener('online', pullFromGas);
  }
  FamilyAuth.boot(startApp);
})();
</script>
</body>
