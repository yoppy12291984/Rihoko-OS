window.RihokoLessonPacks = [{"format":"rihoko-lesson-pack","version":1,"id":"thinking-grade3-2026","revision":1,"title":"小3・考える力の4週間","description":"算数・読む力・観察を、週に3つの短いレッスンで。できそうなら問題は、お休みしても大丈夫。","lessons":[{"id":"W1-A","week":1,"title":"分数を「絵」で話そう","subject":"算数","time":"15〜20分","passage":"","source":"S3・S4への土台。約分の意味を確かめる。\nS3：同志社2026 算数（PDF 2頁・大問4〜7）\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）","questions":[{"id":"q1","question":"同じ大きさの長方形を2つかきます。一方を8つの同じ大きさに分けて6つ分をぬり、もう一方を4つに分けて3つ分をぬりましょう。6/8と3/4が同じ大きさになる理由を話してください。","answer":"ぬる広さは同じ。","hint":"8つに分けた小さい部分を、2こずつ組にしてみよう。","explanation":"8つ分けの2こを1組にすると4組になり、ぬった6こは3組になる。","optional":false},{"id":"q2","question":"赤いリボンは12cm、青いリボンは8cmです。どちらも半分の長さに切ります。半分の長さはそれぞれ何cmですか。「どちらも1/2だから同じ長さだ」という考えは正しいですか。","answer":"赤6cm、青4cm。","hint":"半分の長さを出す前に、もとの長さをくらべよう。","explanation":"同じ1/2でも、もとの長さが違うので同じ長さとは限らない。","optional":false},{"id":"q3","question":"【できそうなら】12このおはじきの3/4はいくつですか。まず4つの同じ数の組に分けて考えましょう。","answer":"9こ。","hint":"12こを同じ数ずつ4組に分けると、1組は何こかな。","explanation":"12÷4＝3、3×3＝9。","optional":true}]},{"id":"W1-B","week":1,"title":"ことばの中の手がかり","subject":"国語","time":"15分","passage":"図書室で、あかりは読みたい本を見つけました。しかし、本をもとの場所へもどしました。となりのゆいが「どうして借りないの」と聞くと、あかりは「家に、まだ返していない本があるの。先にそれを返すよ」と答えました。次の日、あかりは家の本を持って図書室へ来ました。","source":"S7・S8：文章の根拠を見つける練習。\nS7：西京2026 適性検査I（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"あかりが、その日に本を借りなかったのはなぜですか。文章を手がかりに答えましょう。","answer":"家にまだ返していない本があり、先にその本を返そうと考えたから。","hint":"あかりがゆいに答えたせりふを読もう。","explanation":"","optional":false},{"id":"q2","question":"「それを返す」の「それ」は何ですか。","answer":"家にある、まだ返していない本。","hint":"「それ」のすぐ前に、どんな本が出てくるかな。","explanation":"","optional":false},{"id":"q3","question":"「あかりは本がきらいだ」と、この文章だけで言えますか。そう考えた手がかりも答えましょう。","answer":"言えない。","hint":"「きらい」と言える根拠はあるかな。最初の文にも注目しよう。","explanation":"「読みたい本を見つけた」と書いてある。借りなかった理由は本がきらいだからではない。","optional":false}]},{"id":"W1-C","week":1,"title":"表を見て、言えること","subject":"観察・資料","time":"10〜15分","passage":"公園で同じ時こくに鳥を数えた記録です。月曜：晴れ・8羽／火曜：晴れ・6羽／水曜：雨・3羽／木曜：くもり・7羽。これは練習用の記録です。","source":"S4・S6：表と実験結果を読む土台。\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）\nS6：西京2026 適性検査III（PDF 3〜4頁）","questions":[{"id":"q1","question":"4日間で数えた羽数を足すと、いくつですか。同じ鳥を別の日に数えたかもしれません。答えを「公園にすむ鳥は全部で○羽」と言ってよいですか。","answer":"24羽分の記録。","hint":"足した数は、別々の鳥の数と同じかな。","explanation":"別の日に同じ鳥を数えた可能性があるので、すむ鳥の総数とは言えない。","optional":false},{"id":"q2","question":"水曜と月曜の記録は何羽ちがいますか。","answer":"5羽。","hint":"多い数から少ない数を引こう。","explanation":"8－3＝5。","optional":false},{"id":"q3","question":"「雨の日は、いつでも必ず鳥が少ない」と決めてよいですか。もっと確かめるなら、何を調べますか。","answer":"決められない。","hint":"雨の日の記録は何日分あるかな。","explanation":"雨の日の記録は1日だけ。同じ場所・同じ時刻・同じ長さの観察で、晴れや雨の日を何日も調べる。","optional":false}]},{"id":"W2-A","week":2,"title":"あまりのひみつ","subject":"算数","time":"15〜20分","passage":"","source":"S1・S5：複数の余り条件を小さい数で調べる。\nS1：洛南2026 算数（PDF 2〜3頁・大問1）\nS5：西京2026 適性検査II（PDF 3頁・問題1(4)）","questions":[{"id":"q1","question":"おはじきの数は1こ以上20こ以下です。3こずつ組にすると1こあまります。あてはまる数を、小さい順にすべて書きましょう。","answer":"1、4、7、10、13、16、19。","hint":"3この組に1こ足した数を、順番に書こう。1こだけの場合も考えてね。","explanation":"1こも「0組できて1こあまる」ので入る。","optional":false},{"id":"q2","question":"その中で、4こずつ組にしても1こあまる数をすべて見つけましょう。","answer":"1、13。","hint":"問1の数を、4こずつの組に分けて確かめよう。","explanation":"","optional":false},{"id":"q3","question":"【できそうなら】おはじきの数を30こ以下まで広げると、両方のきまりに合う数はどうなりますか。おはじきか図を使って説明しましょう。","answer":"1、13、25。","hint":"20より大きい数でも、同じように両方を確かめよう。","explanation":"1こよけた残りが3こずつにも4こずつにも分けられる。12こ増やすと両方で分け切れる。最小公倍数という用語は不要。","optional":true}]},{"id":"W2-B","week":2,"title":"「でも」と「だから」","subject":"国語","time":"15分","passage":"はるとは、遠足に大きな水とうを持っていこうとしました。でも、荷物が重くなりすぎると思いました。そこで、歩く道に水を入れられる場所があるか、先生にたずねました。先生から「途中で水を足せるよ」と聞き、はるとは小さな水とうを用意しました。","source":"S7・S8：文のつながりと要約の土台。\nS7：西京2026 適性検査I（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"はるとは、はじめに何を持っていこうとしましたか。最後には何を用意しましたか。","answer":"はじめは大きな水とう。","hint":"はじめの文と、最後の文をくらべよう。","explanation":"最後は小さな水とう。","optional":false},{"id":"q2","question":"小さな水とうを選べたのは、どんなことが分かったからですか。","answer":"途中で水を足せることが分かったから。","hint":"先生が教えてくれたことは何かな。","explanation":"重すぎる荷物を避けたかったことも背景。","optional":false},{"id":"q3","question":"「はるとは、＿＿ので、＿＿。」の形で、話の大事なところを1文にまとめましょう。","answer":"例：はるとは、途中で水を足せると分かったので、小さな水とうを用意した。","hint":"水を足せることと、選んだ水とうをつなげよう。","explanation":"意味が合えば表現は自由。","optional":false}]},{"id":"W2-C","week":2,"title":"公平にくらべるには？","subject":"観察・資料","time":"10〜15分","passage":"紙の橋の形をくらべます。Aは平らなコピー用紙1枚、Bは同じ大きさのコピー用紙1枚をじゃばらに折ったものです。橋の両はしを本にのせ、真ん中へ同じ種類のコインを1枚ずつ置きます。本の間はどちらも10cmにします。","source":"S6：実験で変える条件・そろえる条件。\nS6：西京2026 適性検査III（PDF 3〜4頁）","questions":[{"id":"q1","question":"AとBで変えたものは何ですか。そろえたものを2つ書きましょう。","answer":"変えたものは紙の形。","hint":"紙そのもの、紙の形、本の間かくを分けて考えよう。","explanation":"そろえたものは紙の種類・大きさ・枚数、本の間隔、コインの種類や置く位置など。","optional":false},{"id":"q2","question":"「Aはコピー用紙、Bはあつい板紙」に変えると、紙の形だけをくらべられますか。","answer":"くらべられない。","hint":"形以外にもちがいがあると、何が理由か分かるかな。","explanation":"紙の種類と形の2つが変わるので、違いの理由を分けられない。","optional":false},{"id":"q3","question":"【やってみよう】家族と3回ずつ試し、落ちる直前のコインの枚数を表にしましょう。結果がちがったら、どんな理由が考えられますか。","answer":"結果は実測でよい。","hint":"1回目・2回目・3回目の列と、A・Bの行を作ろう。","explanation":"折り方、紙のずれ、置く場所など。必ずBが強いと結論を誘導しない。","optional":false}]},{"id":"W3-A","week":3,"title":"ぬけなく数える","subject":"算数","time":"15〜20分","passage":"","source":"S2・S4：場合分けとルール整理。\nS2：高槻2026 算数A（PDF 4〜5頁・大問1(2)、2）\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）","questions":[{"id":"q1","question":"上着は赤・青・白の3色、ぼうしは黄・緑の2色です。上着1枚とぼうし1つの組合せをすべて書きましょう。全部で何通りですか。","answer":"赤黄・赤緑・青黄・青緑・白黄・白緑の6通り。","hint":"上着を赤に決めると、ぼうしは何通りかな。","explanation":"","optional":false},{"id":"q2","question":"1・2・3と書いたカードを1枚ずつ持っています。2枚を選んでならべ、2けたの数を作ります。同じカードは2回使えません。できる数をすべて書きましょう。","answer":"12、13、21、23、31、32の6通り。","hint":"十の位を1に決めて書き、次に2、3の順で調べよう。","explanation":"","optional":false},{"id":"q3","question":"【できそうなら】設問2で、十の位が一の位より大きい数だけを選びましょう。数えもれを防ぐために、どんな順に書きましたか。","answer":"21、31、32の3通り。","hint":"十の位と一の位を、1つずつくらべよう。","explanation":"十の位を1、2、3と固定して順に調べるなど。","optional":true}]},{"id":"W3-B","week":3,"title":"2つの案をくらべよう","subject":"国語","time":"15分","passage":"花だんの水やりについて、2つの案があります。A案：毎朝、当番の1人が全部に水をやる。道具はバケツ1つ。B案：花だんを2つに分け、当番の2人が半分ずつ水をやる。道具はバケツ2つ。どちらも1週間続けて調べることにしました。","source":"S7・S9：複数資料を根拠に説明する土台。\nS7：西京2026 適性検査I（PDF 3〜4頁）\nS9：洛北2026 適性検査II（PDF 3〜4頁）","questions":[{"id":"q1","question":"A案とB案で同じところを1つ、ちがうところを2つ書きましょう。","answer":"同じ：花だんの水やりをする、1週間続けて調べる。","hint":"人数・道具・することを、AとBでくらべよう。","explanation":"違う：人数、分担、バケツの数。","optional":false},{"id":"q2","question":"「B案なら必ず半分の時間で終わる」と、今ある情報だけで言えますか。理由も答えましょう。","answer":"言えない。","hint":"水をくむ場所で待つことはないかな。","explanation":"水をくむ待ち時間、各人の作業の速さ、分けた場所の広さなどが分からない。","optional":false},{"id":"q3","question":"あなたなら、案を選ぶ前に何を調べますか。「＿＿を調べたい。なぜなら＿＿。」と書きましょう。","answer":"例：それぞれにかかった時間を調べたい。","hint":"案を決めるのに足りない情報は何かな。","explanation":"なぜなら、どちらが短時間で終わるかくらべたいから。合理的なら他の答えも可。","optional":false}]},{"id":"W3-C","week":3,"title":"地図で行き方を説明","subject":"観察・資料","time":"10〜15分","passage":"下の地図は上が北です。となり合う場所の間は、どこも歩いて5分です。道は、横かたてにとなり合う場所を結んでいます。ななめの道はありません。\n北の列：公園　　図書館　　駅\n南の列：家　　　学校　　　店","source":"S9：資料の位置関係をことばにする。\nS9：洛北2026 適性検査II（PDF 3〜4頁）","questions":[{"id":"q1","question":"家から学校を通って店へ行きます。どの方角へ、合計何分歩きますか。","answer":"東へ進み、合計10分。","hint":"地図で学校は家の右か左か、確認しよう。","explanation":"","optional":false},{"id":"q2","question":"家から図書館へ、10分で行ける道順をすべて書きましょう。","answer":"家→公園→図書館、家→学校→図書館の2通り。","hint":"10分なら道を何本通れるかな。最初に公園へ行く道と学校へ行く道を考えよう。","explanation":"","optional":false},{"id":"q3","question":"図書館から家へ行く道順を1つ選び、地図を見ていない人にも分かるように説明しましょう。","answer":"例：図書館から南へ5分歩いて学校へ行き、そこから西へ5分歩くと家。","hint":"1回曲がるまでの方角と時間、そのあとを順に話そう。","explanation":"","optional":false}]},{"id":"W4-A","week":4,"title":"図を作って、きまりを見つける","subject":"算数","time":"15〜20分","passage":"","source":"S10：棒で作る図形のきまり。\nS10：洛北2026 適性検査III（PDF 4頁・大問2）","questions":[{"id":"q1","question":"同じ長さの棒4本で正方形を1つ作ります。その右に、辺を1本だけ共有して正方形を1つ足します。正方形が1こ、2こ、3こと横一列にならぶと、棒はそれぞれ何本ですか。図をかきましょう。","answer":"4本、7本、10本。","hint":"となり同士の正方形が使う、同じ1本を2回数えないようにしよう。","explanation":"","optional":false},{"id":"q2","question":"同じならべ方で正方形を5こ作ると、棒は何本ですか。正方形を1こ足すたびに、何本増えるか説明してください。","answer":"16本。","hint":"最初の4本から、正方形を1こずつ増やした表を作ろう。","explanation":"新しい正方形の4辺のうち1辺はすでにあるため、3本増える。","optional":false},{"id":"q3","question":"【できそうなら】棒が22本になるのは、正方形が何このときですか。表を続けて調べてもよいです。","answer":"7こ。","hint":"棒の本数と正方形の数を、上下2行の表にしよう。","explanation":"4、7、10、13、16、19、22。","optional":true}]},{"id":"W4-B","week":4,"title":"事実と考えを分ける","subject":"国語","time":"15分","passage":"みなは、ベランダの鉢を見ました。土の表面はかわいていて、葉は昨日より少したれていました。みなは「水が足りないのかもしれない」と考えました。兄は「暑さのせいかもしれないね」と言いました。2人は、まず土の中のしめり方を確かめることにしました。","source":"S6・S8：観察から言えることを見極める。\nS6：西京2026 適性検査III（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"実際に見たことを2つ書きましょう。","answer":"土の表面がかわいていた。","hint":"「見ました」のあとに書いてあることを探そう。","explanation":"葉が昨日より少したれていた。","optional":false},{"id":"q2","question":"まだ確かめていない考えを2つ書きましょう。","answer":"水が足りないのかもしれない。","hint":"「かもしれない」が付いている文を探そう。","explanation":"暑さのせいかもしれない。","optional":false},{"id":"q3","question":"なぜ土の中のしめり方を確かめようとしたのでしょう。文章を手がかりに説明しましょう。","answer":"土の表面だけでは、水が足りないか分からないため。","hint":"表面がかわいていても、中はしめっていることがあるかな。","explanation":"水不足という考えを確かめたいから。","optional":false}]},{"id":"W4-C","week":4,"title":"4週間の力だめし","subject":"観察・資料","time":"10〜15分","passage":"","source":"W1〜W4の別問題。入試判定ではない。\n","questions":[{"id":"q1","question":"1以上20以下の数で、2でわると1あまり、3でわっても1あまる数をすべて書きましょう。調べたあとも残してください。","answer":"1、7、13、19。","hint":"2でわった場合と3でわった場合の候補を、別々に書こう。","explanation":"2で割る候補と3で割る候補の共通部分を調べるなど。","optional":false},{"id":"q2","question":"同じ大きさの長方形で、4/6と2/3が同じ広さになることを図で説明しましょう。","answer":"6等分の2こを1組にすると3組。","hint":"6つ分けの2こをまとめたら、全体はいくつの組になるかな。","explanation":"ぬった4こは2組になる。","optional":false},{"id":"q3","question":"同じコースを歩いた時間は、月曜12分、火曜10分、水曜11分でした。「木曜は必ず10分で歩ける」と言えますか。理由を書きましょう。","answer":"言えない。","hint":"3日間の記録だけで、まだ歩いていない日のことまで決められるかな。","explanation":"記録から木曜の時間が必ず同じになるとは分からない。歩く速さや信号などで変わり得る。","optional":false}]}],"archived":true},{"format":"rihoko-lesson-pack","version":1,"id":"thinking-grade3-2026","revision":2,"title":"小3・考える力の4週間","description":"1回10〜20分。まず基本の2問、余裕があれば3問目へ。分数は図をタップして考え、国語は本文の言葉を根拠に答えます。","lessons":[{"id":"W1-A","week":1,"title":"分数を「絵」で話そう","subject":"算数","time":"15〜20分","passage":"","source":"S3・S4への土台。約分の意味を確かめる。\nS3：同志社2026 算数（PDF 2頁・大問4〜7）\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）","questions":[{"id":"q1","question":"下に、同じ大きさの長方形が2つあります。上は8つ、下は4つに等しく分けてあります。上の6マスと下の3マスを、左から順にぬりましょう。ぬった広さをくらべて、6/8と3/4が同じ大きさになる理由を書きましょう。","answer":"ぬった広さは同じ。上のマスを2つずつ組にすると、全体は4組、ぬった部分は3組になるから。","hint":"8つに分けた小さい部分を、2こずつ組にしてみよう。","explanation":"分母の8も分子の6も2でわると、4と3になるね。マスの数は変わっても、ぬった広さは変わらない。","optional":false,"workspace":"fraction","parts":[8,4]},{"id":"q2","question":"赤いリボンは12cm、青いリボンは8cmです。どちらも半分の長さに切ります。半分の長さはそれぞれ何cmですか。「どちらも1/2だから同じ長さだ」という考えは正しいですか。","answer":"赤は6cm、青は4cm。「同じ長さだ」は正しくない。もとのリボンの長さがちがうから。","hint":"半分の長さを出す前に、もとの長さをくらべよう。","explanation":"同じ1/2でも、もとの長さが違うので同じ長さとは限らない。","optional":false,"workspace":"text"},{"id":"q3","question":"【できそうなら】12このおはじきの3/4はいくつですか。まず4つの同じ数の組に分けて考えましょう。","answer":"9こ。","hint":"12こを同じ数ずつ4組に分けると、1組は何こかな。","explanation":"12÷4＝3、3×3＝9。","optional":true,"workspace":"text"}],"mission":"図や数のひみつを見つけよう。答えが出たら、どうしてそうなるかも話してみてね。"},{"id":"W1-B","week":1,"title":"ことばの中の手がかり","subject":"国語","time":"15分","passage":"図書室で、あかりは読みたい本を見つけました。しかし、本をもとの場所へもどしました。となりのゆいが「どうして借りないの」と聞くと、あかりは「家に、まだ返していない本があるの。先にそれを返すよ」と答えました。次の日、あかりは家の本を持って図書室へ来ました。","source":"S7・S8：文章の根拠を見つける練習。\nS7：西京2026 適性検査I（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"あかりが、その日に本を借りなかったのはなぜですか。文章を手がかりに答えましょう。","answer":"家にまだ返していない本があり、先にその本を返そうと考えたから。","hint":"あかりがゆいに答えたせりふを読もう。","explanation":"「家に、まだ返していない本がある」「先にそれを返す」の2つをつなげて理由にしよう。","optional":false,"workspace":"text"},{"id":"q2","question":"「それを返す」の「それ」は何ですか。","answer":"家にある、まだ返していない本。","hint":"「それ」のすぐ前に、どんな本が出てくるかな。","explanation":"「それ」は、すぐ前の「家に、まだ返していない本」を指している。「本」だけより、どの本か分かるように書こう。","optional":false,"workspace":"text"},{"id":"q3","question":"「あかりは本がきらいだから借りなかった」という考えは、本文と合っていますか。合っていないと考える手がかりを、本文から一つ書きましょう。","answer":"合っていない。「読みたい本を見つけました」が手がかり。","hint":"「きらい」と言える根拠はあるかな。最初の文にも注目しよう。","explanation":"本を借りなかった理由と、本を好きかどうかは別のことだね。「先にそれを返すよ」を根拠にしてもよい。","optional":false,"workspace":"text"}],"mission":"ことば探偵の出番。本文の中から、答えの手がかりをさがそう。"},{"id":"W1-C","week":1,"title":"表を見て、言えること","subject":"観察・資料","time":"10〜15分","passage":"公園で同じ時こくに鳥を数えた記録です。月曜：晴れ・8羽／火曜：晴れ・6羽／水曜：雨・3羽／木曜：くもり・7羽。これは練習用の記録です。","source":"S4・S6：表と実験結果を読む土台。\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）\nS6：西京2026 適性検査III（PDF 3〜4頁）","questions":[{"id":"q1","question":"4日間で数えた羽数を足すと、いくつですか。同じ鳥を別の日に数えたかもしれません。答えを「公園にすむ鳥は全部で○羽」と言ってよいですか。","answer":"合計は24羽。ただし「公園にすむ鳥は全部で24羽」とは言えない。同じ鳥を別の日に数えたかもしれないから。","hint":"足した数は、別々の鳥の数と同じかな。","explanation":"別の日に同じ鳥を数えた可能性があるので、すむ鳥の総数とは言えない。","optional":false,"workspace":"text"},{"id":"q2","question":"水曜と月曜の記録は何羽ちがいますか。","answer":"5羽。","hint":"多い数から少ない数を引こう。","explanation":"8－3＝5。","optional":false,"workspace":"text"},{"id":"q3","question":"「雨の日は、いつでも必ず鳥が少ない」と決めてよいですか。もっと確かめるなら、何を調べますか。","answer":"決められない。雨の日は1日しか調べていないから。同じ場所・同じ時こくで、晴れの日と雨の日を何日も調べたい。","hint":"雨の日の記録は何日分あるかな。","explanation":"雨の日の記録は1日だけ。同じ場所・同じ時刻・同じ長さの観察で、晴れや雨の日を何日も調べる。","optional":false,"workspace":"text"}],"mission":"調査隊になって、記録から分かることを見つけよう。分からないことを見つけるのも大事だよ。"},{"id":"W2-A","week":2,"title":"あまりのひみつ","subject":"算数","time":"15〜20分","passage":"","source":"S1・S5：複数の余り条件を小さい数で調べる。\nS1：洛南2026 算数（PDF 2〜3頁・大問1）\nS5：西京2026 適性検査II（PDF 3頁・問題1(4)）","questions":[{"id":"q1","question":"おはじきの数は1こ以上20こ以下です。3こずつ組にすると1こあまります。あてはまる数を、小さい順にすべて書きましょう。","answer":"1、4、7、10、13、16、19。","hint":"3この組に1こ足した数を、順番に書こう。1こだけの場合も考えてね。","explanation":"1こも「0組できて1こあまる」ので入る。","optional":false,"workspace":"text"},{"id":"q2","question":"その中で、4こずつ組にしても1こあまる数をすべて見つけましょう。","answer":"1、13。","hint":"問1の数を、4こずつの組に分けて確かめよう。","explanation":"4こずつで1こあまる数は1、5、9、13、17。問1の数と両方にあるのは1と13。","optional":false,"workspace":"text"},{"id":"q3","question":"【できそうなら】おはじきの数を30こ以下まで広げると、両方のきまりに合う数はどうなりますか。おはじきか図を使って説明しましょう。","answer":"1、13、25。","hint":"20より大きい数でも、同じように両方を確かめよう。","explanation":"1こよけた残りが3こずつにも4こずつにも分けられる。12こ増やすと両方で分け切れる。最小公倍数という用語は不要。","optional":true,"workspace":"draw"}],"mission":"図や数のひみつを見つけよう。答えが出たら、どうしてそうなるかも話してみてね。"},{"id":"W2-B","week":2,"title":"「でも」と「だから」","subject":"国語","time":"15分","passage":"はるとは、遠足に大きな水とうを持っていこうとしました。でも、荷物が重くなりすぎると思いました。そこで、歩く道に水を入れられる場所があるか、先生にたずねました。先生から「途中で水を足せるよ」と聞き、はるとは小さな水とうを用意しました。","source":"S7・S8：文のつながりと要約の土台。\nS7：西京2026 適性検査I（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"はるとは、はじめに何を持っていこうとしましたか。最後には何を用意しましたか。","answer":"はじめは大きな水とう。最後は小さな水とう。","hint":"はじめの文と、最後の文をくらべよう。","explanation":"「持っていこうとしました」は最初の予定、「用意しました」は最後にしたこと。途中で考えが変わったね。","optional":false,"workspace":"text"},{"id":"q2","question":"小さな水とうを選べたのは、どんなことが分かったからですか。","answer":"途中で水を足せることが分かったから。","hint":"先生が教えてくれたことは何かな。","explanation":"重すぎる荷物を避けたかったことも背景。","optional":false,"workspace":"text"},{"id":"q3","question":"「はるとは、＿＿ので、＿＿。」の形で、話の大事なところを1文にまとめましょう。","answer":"例：はるとは、途中で水を足せると分かったので、小さな水とうを用意した。","hint":"水を足せることと、選んだ水とうをつなげよう。","explanation":"意味が合えば表現は自由。","optional":false,"workspace":"text"}],"mission":"ことば探偵の出番。本文の中から、答えの手がかりをさがそう。"},{"id":"W2-C","week":2,"title":"公平にくらべるには？","subject":"観察・資料","time":"10〜15分","passage":"紙の橋の形をくらべます。Aは平らなコピー用紙1枚、Bは同じ大きさのコピー用紙1枚をじゃばらに折ったものです。橋の両はしを本にのせ、真ん中へ同じ種類のコインを1枚ずつ置きます。本の間はどちらも10cmにします。","source":"S6：実験で変える条件・そろえる条件。\nS6：西京2026 適性検査III（PDF 3〜4頁）","questions":[{"id":"q1","question":"AとBで変えたものは何ですか。そろえたものを2つ書きましょう。","answer":"変えたものは紙の形。そろえたものは、例えば、紙の種類と本の間かく。","hint":"紙そのもの、紙の形、本の間かくを分けて考えよう。","explanation":"紙のもとの大きさ・枚数、コインの種類・置く位置も答えになる。そろえたものを2つ書けているか確かめよう。","optional":false,"workspace":"text"},{"id":"q2","question":"「Aはコピー用紙、Bはあつい板紙」に変えると、紙の形だけをくらべられますか。","answer":"くらべられない。","hint":"形以外にもちがいがあると、何が理由か分かるかな。","explanation":"紙の種類と形の2つが変わるので、違いの理由を分けられない。","optional":false,"workspace":"text"},{"id":"q3","question":"【週末に家族と】AとBを3回ずつ試しましょう。橋からコインが落ちる直前の枚数を「A：1回目○枚、2回目○枚、3回目○枚／B：…」と記録しましょう。用具がない日は、この問題はとばしてかまいません。","answer":"自分で試した枚数を6か所に記録できればよい。決まった正解の枚数はありません。","hint":"1回目・2回目・3回目の列と、A・Bの行を作ろう。","explanation":"1回ごとに橋を同じ置き方に直そう。枚数が変わったら、紙のずれやコインを置いた場所などもメモしよう。","optional":true,"workspace":"text"}],"mission":"調査隊になって、記録から分かることを見つけよう。分からないことを見つけるのも大事だよ。"},{"id":"W3-A","week":3,"title":"ぬけなく数える","subject":"算数","time":"15〜20分","passage":"","source":"S2・S4：場合分けとルール整理。\nS2：高槻2026 算数A（PDF 4〜5頁・大問1(2)、2）\nS4：立命館2024 前期 算数（PDF 4頁・大問2(3)、8〜9頁・大問5）","questions":[{"id":"q1","question":"上着は赤・青・白の3色、ぼうしは黄・緑の2色です。上着1枚とぼうし1つの組合せをすべて書きましょう。全部で何通りですか。","answer":"赤黄・赤緑・青黄・青緑・白黄・白緑の6通り。","hint":"上着を赤に決めると、ぼうしは何通りかな。","explanation":"上着を赤に決めると、ぼうしは黄・緑の2通り。青も白も2通りずつなので、2+2+2=6通り。","optional":false,"workspace":"text"},{"id":"q2","question":"1・2・3と書いたカードを1枚ずつ持っています。2枚を選んでならべ、2けたの数を作ります。同じカードは2回使えません。できる数をすべて書きましょう。","answer":"12、13、21、23、31、32の6通り。","hint":"十の位を1に決めて書き、次に2、3の順で調べよう。","explanation":"十の位を1にすると12・13、2なら21・23、3なら31・32。11などは同じカードを2回使うので入らない。","optional":false,"workspace":"text"},{"id":"q3","question":"【できそうなら】設問2で、十の位が一の位より大きい数だけを選びましょう。数えもれを防ぐために、どんな順に書きましたか。","answer":"21、31、32の3通り。","hint":"十の位と一の位を、1つずつくらべよう。","explanation":"十の位を1、2、3と固定して順に調べるなど。","optional":true,"workspace":"text"}],"mission":"図や数のひみつを見つけよう。答えが出たら、どうしてそうなるかも話してみてね。"},{"id":"W3-B","week":3,"title":"行動から気持ちを読む","subject":"国語","time":"15分","passage":"図工の時間、ゆうは作った船を机に置きました。となりのけんが手をのばすと、ゆうは船を自分の方へ引きよせました。「ごめんね。まだのりがかわいていないんだ。かわいたら、いっしょに動かそう。」休み時間、ゆうはけんを呼び、船をそっと手わたしました。けんが「よく走るね」と言うと、ゆうはにっこりしました。","source":"オリジナル読解。行動の理由を本文で確かめ、時間による行動の変化を読む練習。","questions":[{"id":"q1","question":"ゆうが船を自分の方へ引きよせたのは、なぜですか。","answer":"まだのりがかわいていなかったから。","hint":"船を引きよせた直後のせりふを読もう。","explanation":"「けんにさわってほしくないから」と決めつけず、本文に書かれた理由を使おう。","optional":false,"workspace":"text"},{"id":"q2","question":"ゆうが「かわいたら、いっしょに動かそう」という約束を守ったと分かる行動を、本文から書きましょう。","answer":"休み時間、けんを呼び、船をそっと手わたした。","hint":"休み時間のゆうは何をしたかな。","explanation":"「けんを呼ぶ」「船を手わたす」が、約束に対応する行動だね。","optional":false,"workspace":"text"},{"id":"q3","question":"最後にゆうがにっこりしたとき、どんな気持ちだったと考えられますか。けんの言葉を手がかりに書きましょう。","answer":"作った船を「よく走るね」とほめてもらえて、うれしかった。","hint":"にっこりする直前に、けんは何と言ったかな。","explanation":"「うれしい」「ほっとした」など、本文の言葉に合う理由も書ければよい。本文にない出来事を理由にしないようにしよう。","optional":false,"workspace":"text"}],"mission":"ことば探偵の出番。本文の中から、答えの手がかりをさがそう。"},{"id":"W3-C","week":3,"title":"地図で行き方を説明","subject":"観察・資料","time":"10〜15分","passage":"下の地図は上が北です。となり合う場所の間は、どこも歩いて5分です。道は、横かたてにとなり合う場所を結んでいます。ななめの道はありません。\n北の列：公園　　図書館　　駅\n南の列：家　　　学校　　　店","source":"S9：資料の位置関係をことばにする。\nS9：洛北2026 適性検査II（PDF 3〜4頁）","questions":[{"id":"q1","question":"家から学校を通って店へ行きます。どの方角へ、合計何分歩きますか。","answer":"東へ進み、合計10分。","hint":"地図で学校は家の右か左か、確認しよう。","explanation":"上が北なので右が東。家→学校と学校→店は、それぞれ5分。5+5=10分。","optional":false,"workspace":"text"},{"id":"q2","question":"家から図書館へ、10分で行ける道順をすべて書きましょう。","answer":"家→公園→図書館、家→学校→図書館の2通り。","hint":"10分なら道を何本通れるかな。最初に公園へ行く道と学校へ行く道を考えよう。","explanation":"10分では5分の道を2本通る。東→北か、北→東の2通り。ななめには進めない。","optional":false,"workspace":"text"},{"id":"q3","question":"図書館から家へ行く道順を1つ選び、地図を見ていない人にも分かるように説明しましょう。","answer":"例：図書館から南へ5分歩いて学校へ行き、そこから西へ5分歩くと家。","hint":"1回曲がるまでの方角と時間、そのあとを順に話そう。","explanation":"「西へ5分で公園、南へ5分で家」も正解。出発する場所、方角、時間、曲がる場所が分かるように話そう。","optional":false,"workspace":"text"}],"mission":"調査隊になって、記録から分かることを見つけよう。分からないことを見つけるのも大事だよ。"},{"id":"W4-A","week":4,"title":"図を作って、きまりを見つける","subject":"算数","time":"15〜20分","passage":"","source":"S10：棒で作る図形のきまり。\nS10：洛北2026 適性検査III（PDF 4頁・大問2）","questions":[{"id":"q1","question":"同じ長さの棒4本で正方形を1つ作ります。その右に、辺を1本だけ共有して正方形を1つ足します。正方形が1こ、2こ、3こと横一列にならぶと、棒はそれぞれ何本ですか。図をかきましょう。","answer":"4本、7本、10本。","hint":"となり同士の正方形が使う、同じ1本を2回数えないようにしよう。","explanation":"1こ目は4本。右に1こ足すときは、左の辺を前の正方形と共有するので、あと3本あればよい。4、7、10と増える。","optional":false,"workspace":"draw"},{"id":"q2","question":"同じならべ方で正方形を5こ作ると、棒は何本ですか。正方形を1こ足すたびに、何本増えるか説明してください。","answer":"16本。","hint":"最初の4本から、正方形を1こずつ増やした表を作ろう。","explanation":"新しい正方形の4辺のうち1辺はすでにあるため、3本増える。","optional":false,"workspace":"text"},{"id":"q3","question":"【できそうなら】棒が22本になるのは、正方形が何このときですか。表を続けて調べてもよいです。","answer":"7こ。","hint":"棒の本数と正方形の数を、上下2行の表にしよう。","explanation":"4、7、10、13、16、19、22。","optional":true,"workspace":"text"}],"mission":"図や数のひみつを見つけよう。答えが出たら、どうしてそうなるかも話してみてね。"},{"id":"W4-B","week":4,"title":"事実と考えを分ける","subject":"国語","time":"15分","passage":"みなは、ベランダの鉢を見ました。土の表面はかわいていて、葉は昨日より少したれていました。みなは「水が足りないのかもしれない」と考えました。兄は「暑さのせいかもしれないね」と言いました。2人は、まず土の中のしめり方を確かめることにしました。","source":"S6・S8：観察から言えることを見極める。\nS6：西京2026 適性検査III（PDF 3〜4頁）\nS8：洛北2026 適性検査I（PDF 3〜4頁）","questions":[{"id":"q1","question":"実際に見たことを2つ書きましょう。","answer":"土の表面がかわいていたこと。葉が昨日より少したれていたこと。","hint":"「見ました」のあとに書いてあることを探そう。","explanation":"見て確かめたことを2つ書こう。「水が足りない」は、まだ確かめていない考え。","optional":false,"workspace":"text"},{"id":"q2","question":"まだ確かめていない考えを2つ書きましょう。","answer":"水が足りないのかもしれないという考え。暑さのせいかもしれないという考え。","hint":"「かもしれない」が付いている文を探そう。","explanation":"「かもしれない」は、考えられる理由を表している。どちらが正しいかは、まだ調べていない。","optional":false,"workspace":"text"},{"id":"q3","question":"なぜ土の中のしめり方を確かめようとしたのでしょう。文章を手がかりに説明しましょう。","answer":"土の表面だけでは、水が足りないか分からないため。","hint":"表面がかわいていても、中はしめっていることがあるかな。","explanation":"水不足という考えを確かめたいから。","optional":false,"workspace":"text"}],"mission":"ことば探偵の出番。本文の中から、答えの手がかりをさがそう。"},{"id":"W4-C","week":4,"title":"4週間の力だめし","subject":"観察・資料","time":"10〜15分","passage":"","source":"W1〜W4の別問題。入試判定ではない。\n","questions":[{"id":"q1","question":"1以上20以下の数で、2でわると1あまり、3でわっても1あまる数をすべて書きましょう。調べたあとも残してください。","answer":"1、7、13、19。","hint":"2でわった場合と3でわった場合の候補を、別々に書こう。","explanation":"2で割る候補と3で割る候補の共通部分を調べるなど。","optional":false,"workspace":"text"},{"id":"q2","question":"下の同じ大きさの長方形で、上の6マスのうち4マス、下の3マスのうち2マスを左からぬりましょう。4/6と2/3が同じ広さになる理由も書きましょう。","answer":"上のマスを2つずつまとめると、全体は3組、ぬった部分は2組になる。だから4/6と2/3は同じ広さ。","hint":"6つ分けの2こをまとめたら、全体はいくつの組になるかな。","explanation":"ぬった4こは2組になる。","optional":false,"workspace":"fraction","parts":[6,3]},{"id":"q3","question":"同じコースを歩いた時間は、月曜12分、火曜10分、水曜11分でした。「木曜は必ず10分で歩ける」と言えますか。理由を書きましょう。","answer":"言えない。歩く速さや信号で待つ時間が変わることもあるから。","hint":"3日間の記録だけで、まだ歩いていない日のことまで決められるかな。","explanation":"記録から木曜の時間が必ず同じになるとは分からない。歩く速さや信号などで変わり得る。","optional":false,"workspace":"text"}],"mission":"調査隊になって、記録から分かることを見つけよう。分からないことを見つけるのも大事だよ。"}],"archived":true},{"format":"rihoko-lesson-pack","version":1,"id":"thinking-explain-2026","revision":1,"title":"ためす・説明する・考え直す","description":"1回1レッスン、週末15〜20分。途中の考えも大切にします。ヒントは行きづまってから。","lessons":[{"id":"T1","week":1,"title":"カード研究所：10のひみつ","subject":"算数","time":"10〜15分","passage":"1、2、3、4、5、6のカードが1枚ずつあります。3枚を選び、たした数が10になる組を作ります。同じカードは2回使えません。順番を変えただけの組は同じと数えます。","questions":[{"id":"q1","question":"条件に合う組を、まず一つ見つけましょう。たし算も書いて確かめてください。","answer":"例：1、3、6。1+3+6=10。","hint":"大きいカードを1枚決めて、残りの2枚でいくつにすればよいか考えよう。","explanation":"1・4・5や2・3・5でもよい。選んだ数が全部ちがい、合計が10かを確認しよう。","optional":false,"workspace":"text","cards":[1,2,3,4,5,6]},{"id":"q2","question":"条件に合う組を全部見つけましょう。「もうない」と確かめるために、どんな順番で調べましたか。","answer":"1・3・6、1・4・5、2・3・5の3組。小さい順に並べ、一番小さい数を1、2、3…と決めて調べる。","hint":"一番小さい数が1のとき、残り2枚の合計は9。2のときは8。3以上だと？","explanation":"最小が1なら3+6、4+5。最小が2なら3+5。最小が3以上なら一番小さくても3+4+5=12で10をこえる。だから全部で3組。","optional":false,"workspace":"text","cards":[1,2,3,4,5,6]},{"id":"q3","question":"6のカードを使えなくしました。もう一度全部調べ直さずに、残る組を答える方法を説明しましょう。","answer":"問2の3組から、6をふくむ1・3・6だけを除く。1・4・5と2・3・5の2組が残る。","hint":"変わった条件は「6が使えない」だけ。前に見つけた組を利用できるかな。","explanation":"条件が変わっても、使える結果は残してよい。新しい組が増えることはなく、6を使う組だけが使えなくなる。","optional":false,"workspace":"text","cards":[1,2,3,4,5]}],"source":"小3向けオリジナル思考練習。目的は、条件を整理する・調べ方を説明する・条件を変えて確かめること。速さや正解数だけでは評価しません。","mission":"カード研究所からの依頼！ 合計10になる三人組をさがそう。見つけた組だけでなく、「もうほかにはない」と言える理由も報告してね。"},{"id":"T2","week":2,"title":"文具店の買い物ミッション","subject":"算数","time":"10〜15分","passage":"お店で、えんぴつは1本40円、消しゴムは1こ60円です。どちらも1つ以上買い、全部で200円にします。","questions":[{"id":"q1","question":"買い方を一つ見つけましょう。えんぴつの本数と、消しゴムの数を書いてください。","answer":"例：えんぴつ2本、消しゴム2こ。40×2+60×2=200円。","hint":"消しゴムを1こ、2こ、3こ買うと考えて、残りのお金を調べよう。","explanation":"40円を2本分と60円を2こ分で200円。どちらも1つ以上、という条件にも合うね。","optional":false,"workspace":"text"},{"id":"q2","question":"「えんぴつ5本でも200円だから正解だ」という意見は、この問題の答えとしてよいですか。条件を使って説明しましょう。","answer":"よくない。消しゴムを1こも買っていないので、「どちらも1つ以上」に合わない。","hint":"計算が合うだけで、条件も全部満たしているかな。","explanation":"合計金額だけでなく、どちらも買うという条件がある。答えを出したら、問題の条件に戻って確かめよう。","optional":false,"workspace":"text"},{"id":"q3","question":"条件を「どちらか一方だけ買ってもよい」に変えます。200円になる買い方を全部書きましょう。","answer":"えんぴつ5本・消しゴム0こ、えんぴつ2本・消しゴム2この2通り。","hint":"消しゴムが0、1、2、3この場合を順に考えよう。4こでは200円をこえる。","explanation":"消しゴム0こなら残り200円でえんぴつ5本。1こなら残り140円、2こなら80円、3こなら20円。40円ずつで使い切れるのは200円と80円。","optional":false,"workspace":"text"}],"source":"小3向けオリジナル思考練習。目的は、条件を整理する・調べ方を説明する・条件を変えて確かめること。速さや正解数だけでは評価しません。","mission":"200円で文具を買う係になったよ。金額が合っていても、注文とちがったら困るね。条件をよく見て、お買い物を成功させよう。"}],"archived":true},{"format":"rihoko-lesson-pack","version":1,"id":"english4-first-2026","revision":1,"title":"英検4級・手がかりから考える英語","description":"ことば探偵になって、会話やメモの手がかりを集めよう。1回3問。ゆっくりの英語音声付き（端末の読み上げ）。公式試験の模擬テストではありません。","lessons":[{"id":"E1","week":1,"title":"ことば探偵：消えた言葉","subject":"英語","time":"10〜15分","passage":"空らんに入る言葉を一つ選びましょう。","questions":[{"id":"q1","question":"I (     ) my grandmother last Sunday.","answer":"2. visited","hint":"last Sunday は、これから？ それとも、もう終わった日？","explanation":"last Sunday（この前の日曜日）は過去のこと。visitの過去形visitedを使う。「この前の日曜日、おばあさんを訪ねました。」","optional":false,"workspace":"text","choices":["visit","visited","visits","visiting"],"audio":"I, blank, my grandmother last Sunday."},{"id":"q2","question":"We have no bread at home. Let’s go to the (     ) to buy some.","answer":"3. supermarket","hint":"買い物をする場所はどこかな。","explanation":"buy someは「いくらか買う」。breadとbuyが手がかりなのでsupermarket（スーパー）が合う。","optional":false,"workspace":"text","choices":["hospital","library","supermarket","station"],"audio":"We have no bread at home. Let us go to the, blank, to buy some."},{"id":"q3","question":"My brother is taller (     ) me.","answer":"1. than","hint":"taller は、二人の高さをくらべる言い方だよ。","explanation":"taller than ...で「…より背が高い」。比べる相手meの前にthanを置く。","optional":false,"workspace":"text","choices":["than","from","with","at"],"audio":"My brother is taller, blank, me."}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"英文に、言葉のぬけた場所があるよ。「いつ」「どこで」「何を」を手がかりに、合う言葉を見つけよう。"},{"id":"E2","week":2,"title":"会話のバトンをつなごう","subject":"英語","time":"10〜15分","passage":"空らんに入る返事を一つ選びましょう。","questions":[{"id":"q1","question":"A: How long does it take to walk to the park?\nB: (     )","answer":"4. About ten minutes.","hint":"How long と take が一緒に出てきたら、かかる時間を考えよう。","explanation":"公園まで歩くのにかかる時間を聞いている。「約10分」が合う。場所や行った日は答えにならない。","optional":false,"workspace":"text","choices":["Near the station.","Last Sunday.","With my sister.","About ten minutes."],"audio":"How long does it take to walk to the park?"},{"id":"q2","question":"A: Would you like some orange juice?\nB: (     ) I’m very thirsty.","answer":"2. Yes, please.","hint":"thirsty は「のどがかわいている」。ジュースをすすめられたら？","explanation":"飲みたい気持ちに合う返事はYes, please.（はい、お願いします）。後ろの文も読んで選ぼう。","optional":false,"workspace":"text","choices":["No, thank you.","Yes, please.","You’re welcome.","See you tomorrow."],"audio":"Would you like some orange juice? Blank. I am very thirsty."},{"id":"q3","question":"A: Where did you put my bag?\nB: (     )","answer":"3. Under your chair.","hint":"Where は何をたずねているかな。","explanation":"場所をたずねているので「あなたのいすの下」が合う。Yesterdayは時、It is blueは色の説明。","optional":false,"workspace":"text","choices":["Yesterday.","It is blue.","Under your chair.","I like it."],"audio":"Where did you put my bag?"}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"相手の言葉を受け取って、ぴったりの返事を選ぼう。後ろに続く言葉も大事なヒント！"},{"id":"E3","week":3,"title":"お出かけ探偵：待ち合わせを守れ","subject":"英語","time":"10〜15分","passage":"Hi Emma,\nLet’s go to the zoo on Saturday. It opens at nine. Please meet me at the station at eight thirty. We can take a bus from there. Bring your lunch. We will eat in the park near the zoo.\nLucy","questions":[{"id":"q1","question":"What time will Emma and Lucy meet?","answer":"1. At eight thirty.","hint":"動物園が開く時間と、二人が会う時間は同じかな。","explanation":"meet me ... at eight thirtyが答えの根拠。nineは動物園の開く時間なので区別しよう。","optional":false,"workspace":"text","choices":["At eight thirty.","At nine.","At ten.","At twelve."],"audio":"What time will Emma and Lucy meet?"},{"id":"q2","question":"How will they go from the station to the zoo?","answer":"4. By bus.","hint":"from the station と from there の there は、同じ場所を表しているよ。","explanation":"We can take a bus from there.のthereはstation。駅からバスで向かう。","optional":false,"workspace":"text","choices":["By train.","By bike.","On foot.","By bus."],"audio":"How will they go from the station to the zoo?"},{"id":"q3","question":"What should Emma bring?","answer":"2. Her lunch.","hint":"Bring の後ろを探そう。","explanation":"Bring your lunch.は「お昼ごはんを持ってきて」。公園で食べる予定も書いてある。","optional":false,"workspace":"text","choices":["A map.","Her lunch.","A ball.","A camera."],"audio":"What should Emma bring?"}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"Lucyからメモが届いたよ。時間や場所を取りちがえないように、三つの情報を見つけよう。","audio":"Hi Emma,\nLet’s go to the zoo on Saturday. It opens at nine. Please meet me at the station at eight thirty. We can take a bus from there. Bring your lunch. We will eat in the park near the zoo.\nLucy"},{"id":"E4","week":4,"title":"ばらばら英文を組み立てよう","subject":"英語","time":"10〜15分","passage":"すべての語を1回ずつ使い、日本語に合う英文を書きましょう。文のはじめは大文字にします。","questions":[{"id":"q1","question":"「私はきのう、ピアノを練習しました。」\n[ the / practiced / I / yesterday / piano ]","answer":"I practiced the piano yesterday.","hint":"だれが→何をした→何を→いつ、の順に考えよう。","explanation":"Iが主語、practicedが過去の動作。楽器はthe pianoという形にする。Yesterday, I practiced the piano.も意味は同じ。","optional":false,"workspace":"text","audio":"the. practiced. I. yesterday. piano."},{"id":"q2","question":"「あなたは放課後、何をするつもりですか。」\n[ you / after school / what / to / going / do / are ]","answer":"What are you going to do after school?","hint":"What の後ろは are you。be going to をひとかたまりにしよう。","explanation":"What + are you going to doで「何をするつもりですか」。toの後ろのdoは、する予定の動作。","optional":false,"workspace":"text","audio":"you. after school. what. to. going. do. are."},{"id":"q3","question":"「私は本を読むことが好きです。」\n[ books / like / I / reading ]","answer":"I like reading books.","hint":"I like の後ろに、「本を読むこと」をつなげよう。","explanation":"reading booksは「本を読むこと」。I like books.だけではreadingが残り、聞かれた意味を全部表せない。","optional":false,"workspace":"text","audio":"books. like. I. reading."}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"言葉のカードがばらばらになったよ。全部使って、意味の通る文を完成させよう。"}],"archived":true},{"format":"rihoko-lesson-pack","version":1,"id":"detective-five-subjects-2026","revision":1,"title":"Rihokoの探偵ノート","description":"教科を一つ選び、1回3問。基本から考える問題へ進もう。","lessons":[{"id":"M01","week":1,"title":"バッジを運ぶ箱のなぞ","subject":"算数","level":"小3・あまりのあるわり算","time":"10〜15分","passage":"探偵クラブのバッジが29こあります。箱1つには6こまで入ります。バッジを切ったり、箱からはみ出させたりはできません。","questions":[{"id":"q1","question":"6こずつ入った箱は、何箱作れますか。また、バッジは何こあまりますか。","answer":"4箱できて、5こあまる。29÷6＝4あまり5。","hint":"6×4と6×5を、29とくらべてみよう。","explanation":"6×4＝24、29−24＝5。6×5＝30は29をこえるので、6こ入りの箱は4箱。あまり5は6より小さいね。","workspace":"text","optional":false,"diagram":""},{"id":"q2","question":"29こ全部を箱に入れて運ぶには、箱は少なくとも何箱いりますか。あまりのバッジをどうするかも書きましょう。","answer":"5箱。6こ入りの4箱に加え、あまった5こを入れる箱が1箱いる。","hint":"問1のあまりも運ばなければいけないね。","explanation":"4箱では24こまでしか入らない。5箱なら30こまで入るので、29こ全部が入る。「商の4」と「必要な箱の5」を区別しよう。","workspace":"text","optional":false,"diagram":""},{"id":"q3","question":"箱は今、5箱あります。バッジが29こからあと何こ増えると、初めて6箱目が必要になりますか。","answer":"2こ。5箱には30こまで入るので、31こになったとき6箱目がいる。31−29＝2。","hint":"5箱に入る一番多い数を調べ、その一つ上を考えよう。","explanation":"1こ増えて30こなら5箱に入る。2こ増えて31こになると入らない。答えの前後を確かめると、間違いを見つけられる。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["2","2こ","2個"]}],"mission":"バッジを一つも残さず届けよう。計算の「あまり」を、場面に合う答えに変えるのが今回の手がかり。","source":"構成の参考：Z会グレードアップ問題集 小学3年 算数 計算・図形 公開見本（例→自分で計算→確かめる）。https://happylilac.net/zgusy3sansu-keisan2023.html\n文章題の段階づけも参考に、新しい場面・数値・設問で作成。原文の転載ではありません。"},{"id":"M02","week":1,"title":"図書館へ向かう時間メモ","subject":"算数","level":"小3・時刻と時間","time":"10〜15分","passage":"探偵は午前10時45分に事務所を出ます。図書館までは歩いて20分かかります。図書館に着いたら、すぐに調べものを始めます。","questions":[{"id":"q1","question":"図書館に着くのは午前何時何分ですか。","answer":"午前11時5分。","hint":"10時45分から11時までは何分？ 残りの時間も足そう。","explanation":"11時まで15分。20分のうち残り5分を進めて11時5分。1時間は60分なので、10時65分とは書かない。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["午前11時5分","11時5分","11:05"]},{"id":"q2","question":"図書館で35分間調べものをしました。終わるのは午前何時何分ですか。","answer":"午前11時40分。","hint":"問1の到着時刻から35分進めよう。","explanation":"11時5分から35分後は11時40分。出発時刻ではなく、調べものを始めた時刻を使おう。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["午前11時40分","11時40分","11:40"]},{"id":"q3","question":"正午までに事務所に戻ります。帰り道も20分かかります。図書館を出る一番おそい時刻は、午前何時何分ですか。","answer":"午前11時40分。","hint":"正午12時から、帰り道の20分をもどそう。","explanation":"12時から20分もどると11時40分。問2の調べものが終わったらすぐ出れば間に合う。時間は、進めるだけでなく逆にも考えられる。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["午前11時40分","11時40分","11:40"]}],"mission":"時間メモをつないで、正午までに戻る計画を完成させよう。","source":"構成の参考：Z会グレードアップ問題集 小学3年 算数 計算・図形 公開見本（例→自分で計算→確かめる）。https://happylilac.net/zgusy3sansu-keisan2023.html\n文章題の段階づけも参考に、新しい場面・数値・設問で作成。原文の転載ではありません。"},{"id":"M03","week":1,"title":"消えた値札を見つけよう","subject":"算数","level":"小3・逆から考える計算","time":"10〜15分","passage":"文具店のレシートを調べます。えんぴつは1本70円です。書かれた金額には、消費税もふくまれています。","questions":[{"id":"q1","question":"えんぴつ3本とノート1冊を買うと、合計500円でした。ノート1冊は何円ですか。","answer":"290円。70×3＝210、500−210＝290。","hint":"まず、ねだんの分かっているえんぴつ3本分を出そう。","explanation":"全体の500円から、えんぴつの210円を引く。確かめは210＋290＝500。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["290","290円"]},{"id":"q2","question":"別の人は、えんぴつ何本かを買って1000円を出し、おつりを650円もらいました。買ったえんぴつは何本ですか。","answer":"5本。1000−650＝350、350÷70＝5。","hint":"おつりは使わなかったお金。まず、使ったお金を出そう。","explanation":"350円を70円ずつに分けると5本。5×70＋650＝1000でも確かめられる。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["5","5本"]},{"id":"q3","question":"「えんぴつ4本とノート1冊で500円」というレシートもありました。ノートは問1と同じ品物です。このレシートは正しいですか。正しい合計も書きましょう。","answer":"正しくない。正しい合計は570円。70×4＋290＝570。","hint":"問1よりえんぴつが1本増えたから、合計はいくら増えるかな。","explanation":"問1の500円に70円を足しても570円になる。全部計算し直す方法と、変わった分だけ考える方法がある。","workspace":"text","optional":false,"diagram":""}],"mission":"値札の消えたノートと、あやしいレシート。計算した後に、もとの金額に戻るか確かめよう。","source":"構成の参考：Z会グレードアップ問題集 小学3年 算数 計算・図形 公開見本（例→自分で計算→確かめる）。https://happylilac.net/zgusy3sansu-keisan2023.html\n文章題の段階づけも参考に、新しい場面・数値・設問で作成。原文の転載ではありません。"},{"id":"M04","week":1,"title":"展示室の床を調べよう","subject":"算数","level":"小4チャレンジ・面積","time":"10〜15分","passage":"青いマスは、1辺が1cmの正方形です。この1マスの広さを1cm²（1平方センチメートル）といいます。面積をまだ習っていなければ、マスを数えて考えてかまいません。","questions":[{"id":"q1","question":"青い長方形の面積は何cm²ですか。マスを数えるか、同じ数のまとまりで考えましょう。","answer":"12cm²。横4マスが3段あるので、4×3＝12。","hint":"1段に何マスある？ それが何段ある？","explanation":"広さは青い1cm²のマスの数で表せる。周りの線の長さをたすのとは、ちがう量を調べているよ。","workspace":"text","optional":false,"diagram":"area12","acceptedAnswers":["12","12cm²","12平方センチメートル"]},{"id":"q2","question":"こちらの展示室は、右上の2マスがありません。青い部分の面積は何cm²ですか。","answer":"13cm²。5×3＝15、15−2＝13。","hint":"欠けた部分をうめると、横5マス、たて3マスの長方形になる。","explanation":"上の段は3マス、下の2段は5マスずつなので、3＋5＋5＝13と分けてもよい。","workspace":"text","optional":false,"diagram":"area13","acceptedAnswers":["13","13cm²","13平方センチメートル"]},{"id":"q3","question":"問2の13cm²を、「全体から引く方法」と「部分に分けて足す方法」の二つの式で表しましょう。","answer":"5×3−2＝13。3＋5＋5＝13（または3＋5×2＝13）。","hint":"同じ青いマスを、二つの数え方で数えてみよう。","explanation":"どちらも青い13マスを数えている。式は違っても、どの部分を表しているか説明できればよい。","workspace":"text","optional":false,"diagram":"area13"}],"mission":"床のマスが広さの手がかり。数える・まとめる・別の方法で確かめる、の順に調べよう。","source":"構成の参考：Z会グレードアップ問題集 小学4年 算数 計算・図形「面積」公開見本（分ける・全体から引く）。https://happylilac.net/zgusy4sansu-keisan2023.html\n新しい図と設問で作成。原文の転載ではありません。"},{"id":"J01","week":1,"title":"雨の日の小さな約束","subject":"国語","level":"小3・物語の読み取り","time":"10〜15分","passage":"下校の時、まおは玄関で立ち止まりました。朝は晴れていたのに、外は雨です。まおが空を見上げていると、はなが「いっしょに入ろう」と、かさを広げました。\n道の途中で、はなの右の肩がぬれていることに、まおは気づきました。まおは、かさのえを持つはなの手に、そっと自分の手をそえました。「もう少し、まん中にしよう。」\n分かれ道で、まおは言いました。「明日は、わたしが大きいかさを持ってくるね。」はなは、にっこりうなずきました。","questions":[{"id":"q1","question":"まおが玄関で立ち止まったのは、どんなことに困っていたからだと考えられますか。","answer":"雨が降っているのに、使えるかさがなく、帰るのに困っていたから。","hint":"朝の天気と、はながかさに入れてくれたことをつなげよう。","explanation":"本文に「かさを忘れた」とは書かれていない。忘れたと決めつけず、雨の中を帰れず困っていたことを読み取ろう。","workspace":"text","optional":false,"diagram":""},{"id":"q2","question":"まおが「もう少し、まん中にしよう」と言ったのはなぜですか。直前の出来事を使って答えましょう。","answer":"はなの右の肩がぬれていることに気づき、はなもぬれないようにしたかったから。","hint":"まおが「気づきました」とある文を探そう。","explanation":"「はなの肩がぬれていた」と「ぬれないようにしたい」をつなぐと、言葉の理由がはっきりする。","workspace":"text","optional":false,"diagram":""},{"id":"q3","question":"「明日は、わたしが大きいかさを持ってくるね」には、どんな気持ちがこめられていると考えられますか。今日してもらったこととつなげて書きましょう。","answer":"今日かさに入れてもらってうれしかったので、明日は自分がはなを助けたいという気持ち。","hint":"今日、だれがだれを助けたかな。明日はどうしたいのかな。","explanation":"「お礼をしたい」「今度は自分がかさに入れてあげたい」などもよい。本文の出来事に合う理由を書こう。","workspace":"text","optional":false,"diagram":""}],"mission":"言葉に書かれていない気持ちを、行動と言葉の手がかりから見つけよう。","source":"オリジナル教材。問題文と解答を対応させ、本文・資料にある条件から考える。"},{"id":"J02","week":1,"title":"掲示板の読みちがいを防げ","subject":"国語","level":"小3〜4・必要な情報を読む","time":"10〜15分","passage":"【図書館のお知らせ】\n土曜日に「本のしゅうり体験」を行います。\n・時間：午前10時から11時まで\n・場所：図書館の2階、工作室\n・持ち物：古いタオル1まい\n・参加できる人数：12人\n・申しこみ：金曜日までに、1階の受付で名前を書いてください。\n※本や道具は図書館で用意します。定員になったら、申しこみをしめ切ります。","questions":[{"id":"q1","question":"参加するためには、いつまでに、どこで、何をすればよいですか。三つとも書きましょう。","answer":"金曜日までに、1階の受付で、名前を書く。","hint":"体験をする「場所」と、申しこむ「場所」は同じかな。","explanation":"2階の工作室は体験会の場所。申しこみは1階の受付なので、目的に合う情報を選ぶ。","workspace":"text","optional":false,"diagram":""},{"id":"q2","question":"「自分の古い本を必ず持っていかなければならない」という考えは正しいですか。お知らせの言葉を根拠に答えましょう。","answer":"正しくない。「本や道具は図書館で用意します」と書いてあるから。","hint":"持ち物の行と、※のついた行を両方読もう。","explanation":"持っていくように書かれているのは古いタオル1まい。本を持っていくことは、このお知らせでは求められていない。","workspace":"text","optional":false,"diagram":""},{"id":"q3","question":"友だちに、申しこみを早めにした方がよい理由を説明しましょう。","answer":"参加できるのは12人で、定員になったら金曜日より前でも申しこみがしめ切られるから。","hint":"しめ切りには「曜日」以外の条件もあるね。","explanation":"期限内なら必ず申しこめるわけではない。「金曜日まで」と「定員になったら」を組み合わせて読む。","workspace":"text","optional":false,"diagram":""}],"mission":"参加したい友だちのために、見落としやすい条件を見つけよう。","source":"オリジナル教材。問題文と解答を対応させ、本文・資料にある条件から考える。"},{"id":"J03","week":1,"title":"伝わる案内文に直そう","subject":"国語","level":"小3〜4・文章を整える","time":"10〜15分","passage":"公園の入口には、青いポストがあります。入口からまっすぐ進むと、右側に大きな木があります。集合場所は、その木の下です。\n案内係のメモ：\n「公園に来てください。あそこの下で待っています。」","questions":[{"id":"q1","question":"初めて公園に来る人にとって、メモの「あそこ」が分かりにくいのはなぜですか。","answer":"どの場所や物を指しているか、メモだけでは分からないから。","hint":"読んだ人は、案内係と同じ場所を見ているかな。","explanation":"「あそこ」は、その場を一緒に見ていれば分かることがある。離れた人への案内では、具体的な場所を書く必要がある。","workspace":"text","optional":false,"diagram":""},{"id":"q2","question":"「あそこの下で待っています」を、集合場所が分かる一文に書き直しましょう。","answer":"公園の入口からまっすぐ進んだ右側にある、大きな木の下で待っています。","hint":"入口からの行き方と、目印の木を入れよう。","explanation":"「大きな木の下」だけでなく、どの木か分かる情報があると、初めての人もたどり着ける。","workspace":"text","optional":false,"diagram":""},{"id":"q3","question":"友だちは「公園には入口が二つある」と言いました。案内にどんな情報を足すとよいですか。本文の目印を使って書きましょう。","answer":"青いポストがある入口から入ってください、という情報を足す。","hint":"二つの入口を区別できる目印が、最初の文にあるよ。","explanation":"相手が迷う理由に合わせて情報を足そう。本文にない目印を勝手につけ足す必要はない。","workspace":"text","optional":false,"diagram":""}],"mission":"名探偵の報告は、相手に伝わってこそ。あいまいな言葉を、たどれる案内に変えよう。","source":"オリジナル教材。問題文と解答を対応させ、本文・資料にある条件から考える。"},{"id":"E1","week":1,"title":"ことば探偵：消えた言葉","subject":"英語","time":"10〜15分","passage":"空らんに入る言葉を一つ選びましょう。","questions":[{"id":"q1","question":"I (     ) my grandmother last Sunday.","answer":"2. visited","hint":"last Sunday は、これから？ それとも、もう終わった日？","explanation":"last Sunday（この前の日曜日）は過去のこと。visitの過去形visitedを使う。「この前の日曜日、おばあさんを訪ねました。」","optional":false,"workspace":"text","choices":["visit","visited","visits","visiting"],"audio":"I, blank, my grandmother last Sunday.","correctChoice":1},{"id":"q2","question":"We have no bread at home. Let’s go to the (     ) to buy some.","answer":"3. supermarket","hint":"買い物をする場所はどこかな。","explanation":"buy someは「いくらか買う」。breadとbuyが手がかりなのでsupermarket（スーパー）が合う。","optional":false,"workspace":"text","choices":["hospital","library","supermarket","station"],"audio":"We have no bread at home. Let us go to the, blank, to buy some.","correctChoice":2},{"id":"q3","question":"My brother is taller (     ) me.","answer":"1. than","hint":"taller は、二人の高さをくらべる言い方だよ。","explanation":"taller than ...で「…より背が高い」。比べる相手meの前にthanを置く。","optional":false,"workspace":"text","choices":["than","from","with","at"],"audio":"My brother is taller, blank, me.","correctChoice":0}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"英文に、言葉のぬけた場所があるよ。「いつ」「どこで」「何を」を手がかりに、合う言葉を見つけよう。","level":"英検4級"},{"id":"E2","week":1,"title":"会話のバトンをつなごう","subject":"英語","time":"10〜15分","passage":"空らんに入る返事を一つ選びましょう。","questions":[{"id":"q1","question":"A: How long does it take to walk to the park?\nB: (     )","answer":"4. About ten minutes.","hint":"How long と take が一緒に出てきたら、かかる時間を考えよう。","explanation":"公園まで歩くのにかかる時間を聞いている。「約10分」が合う。場所や行った日は答えにならない。","optional":false,"workspace":"text","choices":["Near the station.","Last Sunday.","With my sister.","About ten minutes."],"audio":"How long does it take to walk to the park?","correctChoice":3},{"id":"q2","question":"A: Would you like some orange juice?\nB: (     ) I’m very thirsty.","answer":"2. Yes, please.","hint":"thirsty は「のどがかわいている」。ジュースをすすめられたら？","explanation":"飲みたい気持ちに合う返事はYes, please.（はい、お願いします）。後ろの文も読んで選ぼう。","optional":false,"workspace":"text","choices":["No, thank you.","Yes, please.","You’re welcome.","See you tomorrow."],"audio":"Would you like some orange juice? Blank. I am very thirsty.","correctChoice":1},{"id":"q3","question":"A: Where did you put my bag?\nB: (     )","answer":"3. Under your chair.","hint":"Where は何をたずねているかな。","explanation":"場所をたずねているので「あなたのいすの下」が合う。Yesterdayは時、It is blueは色の説明。","optional":false,"workspace":"text","choices":["Yesterday.","It is blue.","Under your chair.","I like it."],"audio":"Where did you put my bag?","correctChoice":2}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"相手の言葉を受け取って、ぴったりの返事を選ぼう。後ろに続く言葉も大事なヒント！","level":"英検4級"},{"id":"E3","week":1,"title":"お出かけ探偵：待ち合わせを守れ","subject":"英語","time":"10〜15分","passage":"Hi Emma,\nLet’s go to the zoo on Saturday. It opens at nine. Please meet me at the station at eight thirty. We can take a bus from there. Bring your lunch. We will eat in the park near the zoo.\nLucy","questions":[{"id":"q1","question":"What time will Emma and Lucy meet?","answer":"1. At eight thirty.","hint":"動物園が開く時間と、二人が会う時間は同じかな。","explanation":"meet me ... at eight thirtyが答えの根拠。nineは動物園の開く時間なので区別しよう。","optional":false,"workspace":"text","choices":["At eight thirty.","At nine.","At ten.","At twelve."],"audio":"What time will Emma and Lucy meet?","correctChoice":0},{"id":"q2","question":"How will they go from the station to the zoo?","answer":"4. By bus.","hint":"from the station と from there の there は、同じ場所を表しているよ。","explanation":"We can take a bus from there.のthereはstation。駅からバスで向かう。","optional":false,"workspace":"text","choices":["By train.","By bike.","On foot.","By bus."],"audio":"How will they go from the station to the zoo?","correctChoice":3},{"id":"q3","question":"What should Emma bring?","answer":"2. Her lunch.","hint":"Bring の後ろを探そう。","explanation":"Bring your lunch.は「お昼ごはんを持ってきて」。公園で食べる予定も書いてある。","optional":false,"workspace":"text","choices":["A map.","Her lunch.","A ball.","A camera."],"audio":"What should Emma bring?","correctChoice":1}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"Lucyからメモが届いたよ。時間や場所を取りちがえないように、三つの情報を見つけよう。","audio":"Hi Emma,\nLet’s go to the zoo on Saturday. It opens at nine. Please meet me at the station at eight thirty. We can take a bus from there. Bring your lunch. We will eat in the park near the zoo.\nLucy","level":"英検4級"},{"id":"E4","week":1,"title":"ばらばら英文を組み立てよう","subject":"英語","time":"10〜15分","passage":"すべての語を1回ずつ使い、日本語に合う英文を書きましょう。文のはじめは大文字にします。","questions":[{"id":"q1","question":"「私はきのう、ピアノを練習しました。」\n[ the / practiced / I / yesterday / piano ]","answer":"I practiced the piano yesterday.","hint":"だれが→何をした→何を→いつ、の順に考えよう。","explanation":"Iが主語、practicedが過去の動作。楽器はthe pianoという形にする。Yesterday, I practiced the piano.も意味は同じ。","optional":false,"workspace":"text","audio":"the. practiced. I. yesterday. piano.","acceptedAnswers":["I practiced the piano yesterday."]},{"id":"q2","question":"「あなたは放課後、何をするつもりですか。」\n[ you / after school / what / to / going / do / are ]","answer":"What are you going to do after school?","hint":"What の後ろは are you。be going to をひとかたまりにしよう。","explanation":"What + are you going to doで「何をするつもりですか」。toの後ろのdoは、する予定の動作。","optional":false,"workspace":"text","audio":"you. after school. what. to. going. do. are.","acceptedAnswers":["What are you going to do after school?"]},{"id":"q3","question":"「私は本を読むことが好きです。」\n[ books / like / I / reading ]","answer":"I like reading books.","hint":"I like の後ろに、「本を読むこと」をつなげよう。","explanation":"reading booksは「本を読むこと」。I like books.だけではreadingが残り、聞かれた意味を全部表せない。","optional":false,"workspace":"text","audio":"books. like. I. reading.","acceptedAnswers":["I like reading books."]}],"source":"英検4級の公式出題形式を参考にしたオリジナル練習。https://www.eiken.or.jp/eiken/exam/grade_4/solutions.html\n今回は語句・会話・読解・語順を練習します。リスニングはこの教材には含みません。","mission":"言葉のカードがばらばらになったよ。全部使って、意味の通る文を完成させよう。","level":"英検4級"},{"id":"S01","week":1,"title":"氷がとけたのはなぜ？","subject":"理科","level":"小3〜4・くらべ方","time":"10〜15分","passage":"同じ形・同じ大きさの氷を、同じ皿に1こずつのせました。同じ時こくに、Aは日なた、Bは日かげに置きました。10分後、Aの氷は小さくなり、Bの氷はAより大きく残っていました。","questions":[{"id":"q1","question":"この実験で、AとBで変えたことは何ですか。","answer":"置く場所を日なたと日かげに変えた。","hint":"氷や皿ではなく、どこに置いたかに注目。","explanation":"くらべたい条件を一つ変え、氷の形・大きさ・皿・調べる時間はそろえている。","workspace":"text","optional":false,"diagram":""},{"id":"q2","question":"この記録では、どちらの氷が多くとけましたか。見た結果を使って答えましょう。","answer":"A。はじめは同じ大きさで、10分後にはAの方が小さく残っていたから。","hint":"残った氷が小さいということは、とけた量はどうなるかな。","explanation":"「日なたの方」と知識だけで答えるのでなく、同じ大きさで始めて残りが小さかった、という結果を根拠にしよう。","workspace":"text","optional":false,"diagram":""},{"id":"q3","question":"次に、Aは小さい氷、Bは大きい氷でくらべました。置く場所だけのちがいを調べる実験として、どこを直せばよいですか。","answer":"AとBの氷を、はじめに同じ形・同じ大きさにそろえる。","hint":"氷の大きさと置く場所が、両方変わっていないかな。","explanation":"二つの条件が変わると、結果のちがいがどちらによるものか判断しにくい。知りたいことに合わせて条件をそろえる。","workspace":"text","optional":false,"diagram":""}],"mission":"観察記録を使って、実験のくらべ方を点検しよう。","source":"オリジナル教材。問題文と解答を対応させ、本文・資料にある条件から考える。"},{"id":"S02","week":1,"title":"磁石の調査メモ","subject":"理科","level":"小3・磁石と物の性質","time":"10〜15分","passage":"同じ磁石で調べました。\n鉄のくぎ：ついた\nアルミニウムのはく：つかなかった\n木の棒：つかなかった\n鉄のゼムクリップ：ついた\n調べたものは、名前のとおりの材料でできています。","questions":[{"id":"q1","question":"磁石についた二つのものに共通する材料は何ですか。","answer":"鉄。","hint":"物の名前の前にある材料をくらべよう。","explanation":"くぎとゼムクリップは形がちがうが、どちらも鉄でできている。形だけでなく材料に注目しよう。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["鉄","てつ"]},{"id":"q2","question":"「金属なら、どれも磁石につく」という考えに合わないものを、この記録から一つ選びましょう。","answer":"アルミニウムのはく。","hint":"アルミニウムも金属の仲間だけれど、結果はどうだったかな。","explanation":"アルミニウムは金属だが、この記録ではつかなかった。「金属なら全部」という考えを見直す手がかりになる。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["アルミニウムのはく","アルミニウムはく","アルミはく","アルミ箔","アルミニウム箔"]},{"id":"q3","question":"紙で包んだ鉄のクリップでも、磁石につくか調べたいです。包む前と後で、何を同じにして試しますか。一つ書きましょう。","answer":"例：同じ磁石と同じクリップを使う。","hint":"包んだこと以外は、できるだけ変えないようにするには？","explanation":"磁石の近づけ方をそろえるという答えもよい。予想と実際の結果を分けて記録しよう。","workspace":"text","optional":false,"diagram":""}],"mission":"形にまどわされず、材料という手がかりで記録を整理しよう。","source":"オリジナル教材。問題文と解答を対応させ、本文・資料にある条件から考える。"},{"id":"C01","week":1,"title":"町の地図で待ち合わせ","subject":"社会","level":"小3・地図と方位","time":"10〜15分","passage":"地図の上が北です。道は、となり合う場所を横・たてにつないでいます。ななめの道はありません。となりまで歩く時間は、どこも5分です。\n北の列：公園 ― 図書館 ― 駅\n南の列：家　 ― 学校　 ― 店","questions":[{"id":"q1","question":"学校から見て、図書館はどの方角にありますか。","answer":"北。","hint":"図書館は学校の上にあるね。地図の上はどの方角？","explanation":"方角は見る場所を基準にする。地図の上が北なら、右は東、下は南、左は西。","workspace":"text","optional":false,"diagram":"","acceptedAnswers":["北","きた"]},{"id":"q2","question":"家から学校を通って図書館へ行きます。合計何分かかりますか。","answer":"10分。5＋5＝10。","hint":"家→学校、学校→図書     host.querySelectorAll('[data-rs-choice]').forEach(b=>b.onclick=()=>act(()=>{db.update(s.id,i,{answer:q.choices[Number(b.dataset.rsChoice)]},'choice');message='この端末に保存しました';}));
    const check=host.querySelector('[data-rs-check]');if(check)check.onclick=()=>act(()=>{db.check(s.id,i);message='答え合わせを保存しました';});
    host.querySelectorAll('[data-rs-back]').forEach(b=>b.onclick=()=>{selected=null;message='';draw();});
    host.querySelectorAll('[data-rs-step]').forEach(b=>b.onclick=()=>act(()=>{db.update(s.id,i,{step:Number(b.dataset.rsStep)},'step');message='';}));

    host.querySelector('[data-rs-solution]').onclick=()=>act(()=>db.update(s.id,i,{solutionSeen:true},'solution'));
    host.querySelectorAll('[data-rs-rating]').forEach(b=>b.onclick=()=>act(()=>db.update(s.id,i,{rating:b.dataset.rsRating},'rating')));
    const upgrade=host.querySelector('[data-rs-upgrade]');if(upgrade)upgrade.onclick=()=>act(()=>{const p=packs.find(p=>p.id===s.pack.id),l=p&&p.lessons.find(l=>l.id===s.lesson.id);if(!l||!l.questions.every(q=>q.choices))throw Error('この追加教材には選択肢がありません。保護者画面から選択式の新版を取り込んでください。');selected=db.start(p,l,true).id;});
    if(!choiceMode&&r.drawing&&r.drawing.length&&root.LessonDrawing)root.LessonDrawing.mount(host.querySelector('[data-old-drawing]'),r.drawing,()=>{});
    host.querySelectorAll('[data-rs-print]').forEach(b=>b.onclick=()=>{const popup=root.open('','_blank');if(!popup){notice('印刷画面を開けませんでした。');return;}popup.opener=null;popup.document.write(printHtml(s.lesson,b.dataset.rsPrint==='answers'));popup.document.close();});
  }

    var db=getStore(),sessions=db.exportData().sessions;
    host.innerHTML='<h2>塾の復習：教材と記録</h2><p>このチャットで作った復習教材を追加できます。内蔵教材はアプリの更新で届きます。個別の教材ファイルを取り込む場合は、使うiPadでも取り込んでください。</p><p>選択式で間違えた問題には類題を自動追加します。回答・過去の手書き・ふり返りは端末内保存です。家族の端末には自動共有されません。</p><details><summary>復習教材を追加する</summary><label>教材ファイル（JSON）<input data-rs-import-file type="file" accept=".json,application/json"></label><label>教材データを貼り付ける<textarea data-rs-import rows="4" maxlength="300000">'+esc(importDraft)+'</textarea></label><button data-rs-take>取り込む</button></details><button data-rs-export>復習記録を書き出す</button><details data-rs-export-box><summary>書き出した記録をコピーする</summary><textarea readonly data-rs-export-text rows="5">'+esc(exportText)+'</textarea></details><p role="status" data-rs-status>'+esc(message)+'</p><h3>取り組みの記録</h3>'+(sessions.length?sessions.slice().reverse().map(function(s){return '<details><summary>'+esc(dateLabel(s.startedAt))+' · '+esc(s.lesson.title)+' · '+status(s)+'</summary>'+s.responses.map(function(r,i){return '<section><h4>'+(i?'別の1問':'最初の1問')+'</h4><p>初回：'+esc(r.initial?(r.initial.answer||((r.initial.drawing||[]).length?'手書きあり':'未入力')):'まだ確定していません')+'</p><p>現在：'+esc(r.answer||((r.drawing||[]).length?'手書きあり':'未入力'))+'</p><p>ヒント：'+(r.hintSeen?'開いた':'開いていない')+' ／ 解説：'+(r.solutionSeen?'開いた':'開いていない')+'</p><p>ふり返り：'+esc(ratings[r.rating]||'未記録')+'</p><p>'+esc(r.note||'')+'</p></section>';}).join('')+'</details>';}).join(''):'<p>まだ取り組みの記録はありません。</p>');
    host.querySelector('[data-rs-import]').oninput=function(e){importDraft=e.target.value;};
    function take(raw){try{var p=db.importPack(raw);message=p.title+'を取り込みました。';importDraft='';}catch(e){message='取り込めませんでした：'+e.message;}draw();}
    host.querySelector('[data-rs-take]').onclick=function(){take(importDraft);};

    host.querySelector('[data-rs-export]').onclick=function(){exportText=JSON.stringify(db.exportData(),null,2);host.querySelector('[data-rs-export-text]').value=exportText;host.querySelector('[data-rs-export-box]').open=true;var url=URL.createObjectURL(new Blob([exportText],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='塾の復習記録.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);notice('保存できない場合は、表示した記録をコピーしてこのチャットへ渡せます。');};
  }
  var api={createStore:createStore,validatePack:validatePack,printHtml:printHtml,diagram:diagram,mount:function(el,parent){if(!el)return;host=el;parentMode=!!parent;draw();},isWorking:function(){return !!selected&&!parentMode;}};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.ReviewStudy=api;
})(typeof window!=='undefined'?window:globalThis);
