<script>
(function(root){
  'use strict';
  var KEY='rihoko-home-companion-v1', DAYS=['日','月','火','水','木','金','土'];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function minute(v){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v||''))return null;return +v.slice(0,2)*60 + +v.slice(3);}
  function dayKey(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!isNaN(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;}
  function clock(now){var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now||new Date()),p={};parts.forEach(function(x){p[x.type]=x.value;});var date=p.year+'-'+p.month+'-'+p.day;return {date:date,day:new Date(date+'T12:00:00+09:00').getUTCDay(),minute:+p.hour*60 + +p.minute};}
  function defaults(){return {format:KEY,enabled:true,school:{},events:[],skipDates:[]};}
  function validate(input){
    var p=typeof input==='string'?JSON.parse(input):input;
    if(!p||p.format!==KEY)throw Error('声かけ用の予定ファイルではありません。');
    var result=defaults();result.enabled=p.enabled!==false;
    if(!p.school||typeof p.school!=='object'||Array.isArray(p.school))throw Error('曜日ごとの時刻を確認してください。');
    Object.keys(p.school).forEach(function(d){var v=p.school[d];if(!/^[0-6]$/.test(d)||!v||typeof v!=='object')throw Error('曜日を確認してください。');var depart=v.depart||'',home=v.home||'';if((depart&&minute(depart)===null)||(home&&minute(home)===null)||(depart&&home&&minute(depart)>=minute(home)))throw Error('登校・帰宅時刻を確認してください。');result.school[d]={depart:depart,home:home};});
    if(!Array.isArray(p.skipDates)||p.skipDates.length>400||p.skipDates.some(function(d){return !dayKey(d);}))throw Error('お休みの日付を確認してください。');
    result.skipDates=p.skipDates.slice();
    if(!Array.isArray(p.events)||p.events.length>100)throw Error('予定は100件までです。');
    result.events=p.events.map(function(e){
      if(!e||typeof e.title!=='string'||!e.title.trim()||e.title.length>60||minute(e.time)===null||(e.endTime&&minute(e.endTime)===null)||(e.endTime&&minute(e.endTime)<=minute(e.time))||(e.departTime&&(minute(e.departTime)===null||minute(e.departTime)>minute(e.time)))||(e.homeTime&&(minute(e.homeTime)===null||minute(e.homeTime)<minute(e.endTime||e.time))))throw Error('予定の名前・開始・終了・出発・帰宅時刻を確認してください。');
      if(e.recurring){if(!Array.isArray(e.days)||!e.days.length||e.days.some(function(d){return !Number.isInteger(d)||d<0||d>6;}))throw Error('予定の曜日を確認してください。');}else if(!dayKey(e.date))throw Error('予定の日付を確認してください。');
      ['startDate','endDate'].forEach(function(k){if(e[k]&&!dayKey(e[k]))throw Error('予定の期間を確認してください。');});
      if(e.startDate&&e.endDate&&e.startDate>e.endDate)throw Error('予定の期間が逆になっています。');
      var skip=e.skipDates||[];if(!Array.isArray(skip)||skip.some(function(d){return !dayKey(d);}))throw Error('予定のお休みの日を確認してください。');
      return {title:e.title.trim(),time:e.time,endTime:e.endTime||'',departTime:e.departTime||'',homeTime:e.homeTime||'',recurring:!!e.recurring,days:e.recurring?e.days.slice():[],date:e.date||'',startDate:e.startDate||'',endDate:e.endDate||'',skipDates:skip.slice(),paused:!!e.paused};
    });
    return result;
  }
  function createStore(storage){var config=defaults(),error='';try{var raw=storage.getItem(KEY);if(raw)config=validate(raw);}catch(e){error='保存した声かけの設定を読めませんでした。元の記録はそのまま残しています。';}
    return {get:function(){return JSON.parse(JSON.stringify(config));},error:function(){return error;},save:function(p){var next=validate(p);storage.setItem(KEY,JSON.stringify(next));config=next;error='';return next;}};
  }
  function occurs(e,c){if(!e||e.paused||e.deleted||(e.skipDates||[]).indexOf(c.date)>=0)return false;if(e.startDate&&c.date<e.startDate)return false;if(e.endDate&&c.date>e.endDate)return false;return e.recurring?(e.days||[]).indexOf(c.day)>=0:e.date===c.date;}
  function choose(now,config,events){
    var c=clock(now),p=config||defaults(),m=c.minute,off=(p.skipDates||[]).indexOf(c.date)>=0,school=(p.school||{})[c.day]||{};
    function msg(kind,title,text,context){return {kind:kind,title:title,text:text,context:context||'',date:c.date};}
    if(m<300||m>=1260)return msg('night','今日も、おつかれさま。','今日はここまででも大丈夫。あたたかくして、ゆっくり休もうね。');
    if(off)return msg('rest','今日は、ゆったりいこう。','予定の声かけはお休み。自分のペースで過ごしてね。');
    var list=(events||[]).concat(p.events||[]).filter(function(e){return occurs(e,c)&&minute(e.time)!==null;});
    function prep(e){var d=minute(e.departTime);return d===null?minute(e.time):d;}
    var upcoming=list.filter(function(e){return m>=prep(e)-45&&m<=minute(e.time);}).sort(function(a,b){return minute(a.time)-minute(b.time);})[0];
    if(upcoming)return msg('before','そろそろ、じゅんびの時間。','「'+upcoming.title+'」の予定が近づいてきたね。あわてず、持ち物をたしかめよう。',upcoming.departTime?upcoming.departTime+' ごろ出発のめやす':upcoming.time+' の予定');
    var active=list.some(function(e){return minute(e.time)<=m&&minute(e.endTime)!==null&&m<minute(e.endTime);});
    var returned=list.filter(function(e){var h=minute(e.homeTime);return h!==null&&m>=h&&m<h+90;}).sort(function(a,b){return minute(b.homeTime)-minute(a.homeTime);})[0];
    if(!active&&returned)return msg('home','おかえり！','「'+returned.title+'」から帰ってきたら、まずはひと休み。ゆっくり過ごそうね。','帰宅のめやすに合わせて');
    var after=list.filter(function(e){var end=minute(e.endTime);return !e.homeTime&&end!==null&&end>minute(e.time)&&m>=end&&m<end+90;}).sort(function(a,b){return minute(b.endTime)-minute(a.endTime);})[0];
    if(!active&&after)return msg('after','ひと息つこう。','「'+after.title+'」の予定がひと区切りのころだね。まずは、ゆっくりしてね。','予定に合わせた声かけ');
    var home=minute(school.home),depart=minute(school.depart);
    if(!active&&home!==null&&m>=home&&m<home+90)return msg('home','おかえり！','帰ってきたら、まずはひと休み。今日はどんな一日だったかな？','帰宅のめやすに合わせて');
    if(depart!==null&&m>=depart-60&&m<depart)return msg('school','おはよう！ いってらっしゃい。','今日も、自分のペースでいこうね。持ち物はそろったかな？');
    if(m<660)return msg('morning','おはよう！','今日も一日、自分のペースでいこう。小さな「できた」が見つかるといいね。');
    if(m>=1080)return msg('evening','今日も、おつかれさま。','がんばる時間も、休む時間も大切。今は、ほっとひと息ついてね。');
    var variants=['会えてうれしいな。今日はどんなことがあった？','あわてなくて大丈夫。ひとつずつ、自分のペースでいこう。','ちょっとひと休みするのもいいね。今の気分を大切にしよう。'];
    return msg('day','こんにちは！',variants[Number(c.date.replace(/-/g,''))%variants.length]);
  }
  function card(message){return '<section class="hc-card" aria-label="キャラクターからのひとこと"><div class="hc-character"><img src="detective-kotone-v2.png" alt="やさしくほほえむキャラクター" width="128" height="150"><span>きょうのひとこと</span></div><div class="hc-bubble"><h2>'+esc(message.title)+'</h2><p>'+esc(message.text)+'</p>'+(message.context?'<small>'+esc(message.context)+'</small>':'')+'</div></section>';}
  var store=null,eventsProvider=function(){return [];};
  function getStore(){if(!store)store=createStore(root.localStorage);return store;}
  function refresh(){var host=root.document&&root.document.getElementById('homeCompanion');if(!host)return;var p=getStore().get();var html=p.enabled?card(choose(new Date(),p,eventsProvider())):'';if(host.innerHTML!==html)host.innerHTML=html;}
  function mount(provider){eventsProvider=provider||eventsProvider;refresh();var admin=root.document.getElementById('homeCompanionAdmin');if(admin)mountAdmin(admin);}
  function eventEditor(e){return '<fieldset class="hc-event"><legend>習い事・お出かけ</legend><label>予定の名前<input data-hc-field="title" maxlength="60" value="'+esc(e.title)+'"></label><label>曜日（複数選べます）<select data-hc-field="days" multiple size="3">'+DAYS.map(function(d,i){return '<option value="'+i+'" '+((e.days||[]).indexOf(i)>=0?'selected':'')+'>'+d+'曜日</option>';}).join('')+'</select></label><div class="hc-event-times">'+[['time','開始'],['endTime','終了（任意）'],['departTime','出発のめやす（任意）'],['homeTime','帰宅のめやす（任意）']].map(function(x){return '<label>'+x[1]+'<input type="time" data-hc-field="'+x[0]+'" value="'+esc(e[x[0]])+'"></label>';}).join('')+'</div><label>この日だけの予定（毎週なら空欄）<input type="date" data-hc-field="date" value="'+esc(e.recurring?'':e.date)+'"></label><label>開始日（任意）<input type="date" data-hc-field="startDate" value="'+esc(e.startDate)+'"></label><label>終了日（決まったときに）<input type="date" data-hc-field="endDate" value="'+esc(e.endDate)+'"></label><label>この予定を休む日（1行に1日）<textarea data-hc-field="skipDates" rows="2">'+esc((e.skipDates||[]).join('\n'))+'</textarea></label><label><input type="checkbox" data-hc-field="paused" '+(e.paused?'checked':'')+'> この予定をしばらく休む</label><label><input type="checkbox" data-hc-field="remove"> 保存するときにこの予定を削除する</label></fieldset>';}
  function mountAdmin(host){var db=getStore(),p=db.get();host.innerHTML='<details class="hc-settings"><summary>キャラクターの声かけと予定</summary><p>日本時間の時間帯と、このアプリの「予定・ToDo」に登録した予定に合わせます。帰宅は時刻からの目安です。位置や実際の出席は確認しません。</p><p>ここで追加する設定はこの端末だけに保存します。チャットで作った予定ファイルも取り込めます。</p><form data-hc-form><label><input type="checkbox" name="enabled" '+(p.enabled?'checked':'')+'> 声かけを表示する</label><div class="hc-times"><b>曜日</b><b>登校のめやす</b><b>帰宅のめやす</b>'+DAYS.map(function(d,i){var s=p.school[i]||{};return '<span>'+d+'</span><input aria-label="'+d+'曜の登校時刻" type="time" name="depart'+i+'" value="'+esc(s.depart)+'"><input aria-label="'+d+'曜の帰宅時刻" type="time" name="home'+i+'" value="'+esc(s.home)+'">';}).join('')+'</div><label>予定に合わせた声かけを休む日（1行に1日、例：2026-12-01）<textarea name="skipDates" rows="3">'+esc(p.skipDates.join('\n'))+'</textarea></label><button class="btn-primary" type="submit">声かけの設定を保存</button></form><p data-hc-status role="status">'+esc(db.error())+'</p><p>追加の予定：'+p.events.length+'件</p>'+(p.events.length?'<ul>'+p.events.map(function(e){return '<li>'+esc(e.title)+' / '+esc(e.recurring?e.days.map(function(d){return DAYS[d];}).join('・'):e.date)+' '+esc(e.time)+(e.endTime?'〜'+esc(e.endTime):'')+'</li>';}).join('')+'</ul>':'')+'<label>チャットで作った予定ファイルを取り込む<input data-hc-import type="file" accept=".json,application/json"></label><p>取り込み前に内容を表示します。今の声かけ用設定と置き換わります。アプリの予定・ToDoは変更しません。</p><div data-hc-preview></div></details>';
    var status=host.querySelector('[data-hc-status]');
    host.querySelector('[type="submit"]').insertAdjacentHTML('beforebegin','<details class="hc-event-settings"><summary>習い事・お出かけの予定を編集（'+p.events.length+'件）</summary><p>時刻は声かけのめやすです。終了時刻が分からない予定は空欄にできます。</p><div data-hc-events>'+p.events.map(eventEditor).join('')+'</div><button type="button" data-hc-add>予定を追加する</button></details>');
    host.querySelector('[data-hc-add]').onclick=function(){host.querySelector('[data-hc-events]').insertAdjacentHTML('beforeend',eventEditor({days:[]}));};
    host.querySelector('form').onsubmit=function(e){e.preventDefault();var f=e.currentTarget,next=db.get();next.enabled=f.elements.enabled.checked;next.school={};DAYS.forEach(function(_,i){next.school[i]={depart:f.elements['depart'+i].value,home:f.elements['home'+i].value};});next.skipDates=f.elements.skipDates.value.split(/\s+/).filter(Boolean);
      next.events=Array.from(host.querySelectorAll('.hc-event')).filter(function(row){return !row.querySelector('[data-hc-field="remove"]').checked;}).map(function(row){var x={};row.querySelectorAll('[data-hc-field]').forEach(function(el){var k=el.dataset.hcField;if(k==='remove')return;x[k]=k==='paused'?el.checked:k==='days'?Array.from(el.selectedOptions).map(function(o){return +o.value;}):k==='skipDates'?el.value.split(/\s+/).filter(Boolean):el.value.trim();});x.recurring=!x.date;return x;});
      try{db.save(next);mountAdmin(host);host.querySelector('details').open=true;host.querySelector('[data-hc-status]').textContent='この端末に保存しました。';}catch(err){status.textContent='保存できませんでした。'+err.message;}};
    host.querySelector('[data-hc-import]').onchange=async function(e){var file=e.target.files[0],preview=host.querySelector('[data-hc-preview]');preview.innerHTML='';if(!file)return;try{if(file.size>100000)throw Error('ファイルが大きすぎます。');var next=validate(await file.text());preview.innerHTML='<p>この内容で声かけの設定を置き換えます。</p><pre>'+esc(JSON.stringify(next,null,2))+'</pre><button type="button" data-hc-apply>この予定を使う</button>';preview.querySelector('button').onclick=function(){try{db.save(next);mountAdmin(host);host.querySelector('details').open=true;host.querySelector('[data-hc-status]').textContent='予定を取り込みました。';}catch(err){status.textContent='保存できませんでした。'+err.message;}};}catch(err){status.textContent='取り込めませんでした。'+err.message;}};
  }
  var api={clock:clock,defaults:defaults,validate:validate,createStore:createStore,choose:choose,card:card,mount:mount,refresh:refresh};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;else {root.HomeCompanion=api;root.document.addEventListener('visibilitychange',function(){if(!root.document.hidden)refresh();});root.addEventListener('pageshow',refresh);root.setInterval(function(){if(!root.document.hidden)refresh();},60000);}
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
(function(){
  "use strict";

  var APP_VERSION = "2026.11.26.1";

  var STORAGE_KEY = "riho-study-state-v1";
  var state = {
    todos: [], events: [], units: [], routines: [], routineDone: {},
    view: "home", parentTab: "family", dbReady: false,
    familyDraft: null, familyMessage: "", familyDate: null, parentAdvanced: false,
    soraState: "idle", soraStatus: "", soraTranscript: "", soraLastSummary: null,
    learningLogs: null, learningLogsLoading: false, quizLogs: null,
    usage: null, usageLoading: false,
    printLoading: false, printError: null, printExtract: null,
    parentDarkMode: false,
    childTheme: "gentle", showReading: true, focusedTaskId: null,
    calendarEvents: null, calendarLoading: false,
    weeklyReport: null, weeklyReportLoading: false,
    calMonth: null, calSelectedDate: null, // カレンダー(保護者・こども共通)
    routineDaysSelected: [0,1,2,3,4,5,6],
    tabOrder: null, // 保護者が並び替えたタブ順(nullならデフォルト)
    editingTodoId: null, editingEventId: null, editingRoutineId: null,
    eventRecurring: false, eventDaysSelected: [1,2,3,4,5],
    worksheetSubject: null, worksheet: null, worksheetShowAnswers: false
  };
  var db = null;
  var familySync = null, syncStatus = 'local';

  function loadLocal(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.todos = parsed.todos || [];
        state.events = parsed.events || [];
        state.units = parsed.units || [];
        state.routines = parsed.routines || [];
        state.routineDone = parsed.routineDone || {};
      }
      state.parentDarkMode = localStorage.getItem("riho-study-parent-dark") === "1";
      var appearance = {};
      try { appearance = JSON.parse(localStorage.getItem("riho-study-appearance-v1") || "{}") || {}; } catch(e3) { /* 表示設定が壊れていても学習データの読み込みを続ける */ }
      if (["gentle", "calm", "planner"].indexOf(appearance.theme) !== -1) state.childTheme = appearance.theme;
      state.showReading = appearance.showReading !== false;
      var savedOrder = localStorage.getItem("riho-study-tab-order");
      if (savedOrder) { try { state.tabOrder = JSON.parse(savedOrder); } catch(e2) {} }
    } catch(e) { /* ignore */ }
  }
  function saveLocal(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        todos: state.todos, events: state.events, units: state.units,
        routines: state.routines, routineDone: state.routineDone
      }));
    } catch(e) { /* ignore */ }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(s){
    if (!s) return "";
    var p = s.split("-");
    return p[1] + "/" + p[2];
  }
  var WEEK = ["日","月","火","水","木","金","土"];
  function fmtDateLong(s){
    var d = new Date(s + "T00:00:00");
    return (d.getMonth()+1) + "月" + d.getDate() + "日 (" + WEEK[d.getDay()] + ")";
  }

  var CATS = {
    "算数": {icon:"🔢", color:"teal"},
    "国語": {icon:"📖", color:"teal"},
    "理科": {icon:"🔬", color:"teal"},
    "社会": {icon:"🌏", color:"teal"},
    "英語": {icon:"🗣️", color:"teal"},
    "その他": {icon:"✏️", color:"teal"}
  };
  var UNDERSTAND = ["まだ","学習中","できる","復習が必要"];
  var EVENT_TYPES = { school: "学校", lesson: "習い事", test: "テスト", other: "その他" };

  /* ---------------- persistence layer (db capability, fallback to localStorage) ---------------- */

  function persistAdd(col, data){
    data.id = uid();
    state[col].push(data);
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(data.id).set(data).catch(function(){});
    }
    if (typeof syncUpsert === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'upsert',collection:col,item:data});
    }
  }
  function persistUpdate(col, id, patch){
    var arr = state[col];
    var full = null;
    for (var i=0;i<arr.length;i++){
      if (arr[i].id === id) { Object.assign(arr[i], patch); full = arr[i]; break; }
    }
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(id).update(patch).catch(function(){});
    }
    if (full && typeof syncUpsert === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'upsert',collection:col,item:full});
    }
  }
  function persistDelete(col, id){
    state[col] = state[col].filter(function(x){ return x.id !== id; });
    render();
    saveLocal();
    if (db) {
      db.collection(col).doc(id).delete().catch(function(){});
    }
    if (typeof syncDeleteItem === "function" && ["todos","events","units","routines"].indexOf(col) !== -1) {
      if (familySync) familySync.enqueue({type:'delete',collection:col,id:id});
    }
  }

  function initDb(){
    if (!window.claude || !window.claude.use) return;
    window.claude.use("db").then(function(ns){
      if (!ns) return;
      db = ns;
      ["todos","events","units","routines"].forEach(function(col){
        db.collection(col).onSnapshot(function(snap){
          state[col] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          saveLocal();
          reconcileRewards();
          render();
        }, function(){ /* fall back silently to local state */ });
      });
    }).catch(function(){});
  }

  // GAS(Googleスプレッドシート)から他端末分のデータを取り込み、この端末の表示にも反映する。
  // GitHub Pages環境(claude.aiのdb機能が使えない環境)向けの同期経路。
  // 初回の端末データ移行は保護者が選択し、未送信キューは端末に残す。
  function pullFromGas(){
    if (!FamilyAuth.isAuthorized()) return Promise.resolve();
    if (familySync) return familySync.refresh();
  }

  function initFamilySync(){
    if (typeof syncPull !== 'function') return;
    try {
      familySync = FamilySync.create({storage:localStorage,
        snapshot:function(){return {todos:state.todos,events:state.events,units:state.units,routines:state.routines,routineDone:state.routineDone};},
        pull:syncPull,
        send:function(op){
          if (op.type === 'done') return syncRoutineDone(op.key,op.done);
          if (op.type === 'delete') return syncDeleteItem(op.collection,op.id);
          return syncUpsert(op.collection,op.item);
        },
        apply:function(data){
          ['todos','events','units','routines','routineDone'].forEach(function(c){state[c] = data[c];});
          saveLocal();
          reconcileRewards();
          // 入力途中のフォームは再描画しない。画面遷移時に最新状態を表示する。
          if (state.view !== 'parent') render();
        },
        status:function(value){ syncStatus = value; var node = document.getElementById('familySyncStatus'); if (node) node.textContent = syncStatusText(); updateGlobalSyncBar(); }
      });
    } catch(e){syncStatus = 'storage-error';}
  }
  function syncStatusText(){
    return {local:'プレビュー：このPCだけに保存します',setup:'最初の共有設定が必要です。端末内の記録は保持しています。',syncing:'家族のデータを共有中…',synced:'家族のデータと共有できました',pending:'未送信の変更があります。「共有を更新」を押してください。',error:'共有できませんでした。変更はこの端末に残っています。通信が戻ったら再試行してください。','storage-error':'端末への保存を確認できません。ページを閉じずに保存設定を確認してください。'}[syncStatus];
  }
  function updateGlobalSyncBar(){
    var global=document.getElementById('globalSyncStatus'),family=document.getElementById('familySyncStatusGlobal');
    if(family)family.textContent='予定・ToDo：'+syncStatusText();
    if(!global)return;
    var keepsake=document.getElementById('keepsakeSyncStatus'),keepText=keepsake?keepsake.textContent:'';
    if(syncStatus==='syncing'||/共有中/.test(keepText))global.textContent='同期中…';
    else if(syncStatus==='error'||syncStatus==='storage-error'||/共有できません|未送信/.test(keepText))global.textContent='未送信があります。もう一度同期してください';
    else if(syncStatus==='setup')global.textContent='初回の共有設定を確認してください';
    else if(syncStatus==='synced'&&/共有済み/.test(keepText))global.textContent='✓ 最新の状態です';
    else global.textContent='同期できます';
  }
  function syncAllNow(){
    var button=document.getElementById('refreshKeepsakes');if(!button)return Promise.resolve();
    button.disabled=true;button.textContent='同期中…';
    var jobs=[KeepsakeSync.refresh()];if(familySync)jobs.push(familySync.refresh());
    return Promise.all(jobs.map(function(p){return Promise.resolve(p).catch(function(){return null;});})).then(function(){updateGlobalSyncBar();}).finally(function(){button.disabled=false;button.textContent='↻ 同期する';});
  }

  // ルーチンは「その日やったか」を日付ごとに記録する(ルーチン自体はテンプレートなので使い回す)
  function toggleRoutineDone(routineId, dateStr){
    var key = routineId + "|" + dateStr;
    state.routineDone[key] = !state.routineDone[key];
    render();
    saveLocal();
    if (typeof syncRoutineDone === "function") {
      if (familySync) familySync.enqueue({type:'done',key:key,done:state.routineDone[key]});
    }
  }
  function isRoutineDone(routineId, dateStr){
    return !!state.routineDone[routineId + "|" + dateStr];
  }
  // 指定した日付(曜日)に有効なルーチン一覧(除外日指定があれば除く)
  function routinesForDate(dateStr){
    var dow = new Date(dateStr + "T00:00:00").getDay();
    return state.routines.filter(function(r){
      var days = r.days || [0,1,2,3,4,5,6];
      return DailySupport.occurs(r, dateStr);
    });
  }
  // 今日のToDo(日付指定分)とルーチン(曜日に応じて)を合わせた一覧
  function combinedItemsForDate(dateStr){
    var fromTodos = state.todos.filter(function(t){ return t.date === dateStr; });
    var fromRoutines = routinesForDate(dateStr).map(function(r){
      return {
        id: "routine:" + r.id, title: r.title, category: r.category, minutes: r.minutes,
        priority: r.priority || 2, done: isRoutineDone(r.id, dateStr),
        isRoutine: true, routineId: r.id, dailyLife: r.dailyLife, period: r.period, kind: r.kind
      };
    });
    return fromTodos.concat(fromRoutines).sort(function(a,b){ return (a.priority||2)-(b.priority||2); });
  }

  /* ---------------- rendering ---------------- */

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  var reconcilingRewards=false;
  function reconcileRewards(){
    if(reconcilingRewards)return;
    reconcilingRewards=true;
    try{
      var before=StudyKeepsakes.rewards().length;
      var added=StudyKeepsakes.reconcile(todayStr(),state.todos,state.routineDone,combinedItemsForDate);
      rewardError="";
      if(added.length){
        rewardJustClaimed=true;
        var after=StudyKeepsakes.rewards().length;
        if(added.some(function(r){return r.date===todayStr();})&&Math.floor(after/10)>Math.floor(before/10)&&typeof RewardCelebration!=="undefined"){
          setTimeout(function(){RewardCelebration.show(RewardCelebration.levelFor(after));},0);
        }
      }
    }catch(e){rewardError="スタンプを保存できませんでした。記録はそのままに、画面を開き直すともう一度ためします。";}
    finally{reconcilingRewards=false;}
  }
  function render(){
    reconcileRewards();
    if(state.view === "review" && window.ReviewStudy && ReviewStudy.isWorking() && document.querySelector("#reviewContent .rs-question")) return;
    // Keep the live input/drawing DOM during background sync. Explicit navigation still renders.
    if(state.view === "manabu" && !state.worksheetSubject && window.LearningContent && LearningContent.isWorking() && document.querySelector("#learningContent .lc-question")) return;
    if(window.LearningContent)LearningContent.setActive(state.view === "manabu" && !state.worksheetSubject);
    var contentFocus=document.activeElement,contentSelection=null;
    if(contentFocus&&contentFocus.tagName==='TEXTAREA'&&contentFocus.closest('#learningContent')) contentSelection={answer:contentFocus.getAttribute('data-answer'),isImport:contentFocus.hasAttribute('data-import-text'),start:contentFocus.selectionStart,end:contentFocus.selectionEnd};
    if(state.view !== 'parent' && getVisibleTabs().indexOf(state.view) === -1) state.view = getVisibleTabs()[0];
    var app = document.getElementById("app");
    var isParent = state.view === "parent";
    app.className = isParent ? ("app--parent" + (state.parentDarkMode ? " dark-mode" : "")) : "";
    document.body.classList.toggle("parent-dark-bg", isParent && state.parentDarkMode);
    document.body.classList.toggle("app--parent-active", isParent);
    document.body.dataset.theme = isParent ? "parent" : state.childTheme;
    document.body.classList.toggle("hide-reading", !isParent && !state.showReading);
    app.innerHTML = isParent ? renderParent() : renderChild();
    bindEvents();
    if(window.HomeCompanion) HomeCompanion.mount(function(){return state.events;});
    if (window.LearningContent) LearningContent.mount(document.getElementById('learningContent'),isParent);
    if (window.ReviewStudy) ReviewStudy.mount(document.getElementById(isParent?'reviewAdmin':'reviewContent'),isParent);
    if(contentSelection){var restored=Array.from(app.querySelectorAll('#learningContent textarea')).find(function(el){return contentSelection.isImport?el.hasAttribute('data-import-text'):el.getAttribute('data-answer')===contentSelection.answer;});if(restored){restored.focus({preventScroll:true});restored.setSelectionRange(contentSelection.start,contentSelection.end);}}
    if (window.VoiceStudio) VoiceStudio.mount(null,null); // 音声機能は休止中。
  }

  var TAB_DEFS = {
    home:     { icon: "🏠", label: "きょう" },
    review:   { icon: "📝", label: "塾の復習" },
    manabu:   { icon: "📚", label: "探偵クイズ" },
    dekita:   { icon: "🌟", label: "できた" },
    calendar: { icon: "📅", label: "カレンダー" }
  };
  var DEFAULT_TAB_ORDER = ["home","review","manabu","dekita","calendar"];
  var tabPreferences = {hidden:[],start:'home'};
  function getVisibleTabs(){
    var order=getTabOrder().filter(function(id){return tabPreferences.hidden.indexOf(id)===-1;});
    return order.length ? order : ['home'];
  }
  function startupView(){return getVisibleTabs().indexOf(tabPreferences.start)!==-1 ? tabPreferences.start : getVisibleTabs()[0];}
  function saveTabPreferences(){try{localStorage.setItem('riho-study-tab-preferences-v1',JSON.stringify(tabPreferences));}catch(e){}}
  function renderTabPreferences(){
    var visible=getVisibleTabs();
    return '<div class="panel"><h2>表示するタブ・起動時の画面</h2><p class="ri-sub">この端末に自動保存します。非表示にしても記録は残ります。</p>'+getTabOrder().map(function(id){
      return '<label style="display:flex;align-items:center;gap:10px;margin:12px 0"><input type="checkbox" data-tabvisible="'+id+'" '+(visible.indexOf(id)!==-1?'checked ':'')+(visible.length===1&&visible[0]===id?'disabled':'')+'>'+TAB_DEFS[id].label+'</label>';
    }).join('')+'<label for="childStartupTab">起動時の画面</label><select id="childStartupTab">'+visible.map(function(id){return '<option value="'+id+'" '+(startupView()===id?'selected':'')+'>'+TAB_DEFS[id].label+'</option>';}).join('')+'</select></div>';
  }

  function getTabOrder(){
    var order = Array.isArray(state.tabOrder) ? state.tabOrder.filter(function(id,i,a){return TAB_DEFS[id] && a.indexOf(id) === i;}) : [];
    DEFAULT_TAB_ORDER.forEach(function(id){if(order.indexOf(id) === -1)order.push(id);});
    order=order.filter(function(id){return id!=='review';});
    order.splice(order.indexOf('manabu'),0,'review');
    return order;
  }

  function renderChild(){

  // 予定が指定日に発生するか(単発 or 毎週くり返し)を判定
  function eventOccursOnDate(ev, dateStr){
    if (!ev.recurring) return ev.date === dateStr;
    var dow = new Date(dateStr + "T00:00:00").getDay();
    if ((ev.days || []).indexOf(dow) === -1) return false;
    if (ev.startDate && dateStr < ev.startDate) return false;
    if ((ev.skipDates || []).indexOf(dateStr) !== -1) return false;
    return true;
  }

  function nextEvent(){
    var now = new Date();
    var best = null, bestDt = null;
    for (var i = 0; i < 60; i++) {
      var d = new Date(); d.setDate(d.getDate() + i);
      var dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      state.events.forEach(function(ev){
        if (!eventOccursOnDate(ev, dateStr)) return;
        var dt = new Date(dateStr + "T" + (ev.time || "23:59"));
        if (dt < now) return;
        if (!bestDt || dt < bestDt) { bestDt = dt; best = Object.assign({}, ev, { date: dateStr }); }
      });
      if (best) break;
    }
    return best;
  }

  function requestRoutineDelete(id){
    var routine = state.routines.find(function(r){return r.id === id;});
    if (!routine) return false;
    if (!window.confirm('「' + routine.title + '」を削除しますか？')) return false;
    if (state.familyDraft && state.familyDraft.id === id) state.familyDraft = null;
    if (state.editingRoutineId === id) {
      state.editingRoutineId = null;
      state.routineDaysSelected = [0,1,2,3,4,5,6];
    }
    state.familyMessage = '習慣を削除しました。';
    persistDelete('routines',id);
    return true;
  }

  function bindFamilyEvents(app){
    FamilyAuth.mountDevices();
    var refresh = document.getElementById('refreshFamilySync');
    if (refresh) refresh.onclick = function(){familySync.refresh().then(render);};
    var importButton = document.getElementById('importFamilySync');
    if (importButton) importButton.onclick = function(){familySync.refresh(true).then(render);};
    var adopt = document.getElementById('adoptFamilySync');
    if (adopt) adopt.onclick = function(){familySync.adopt().then(render);};
    app.querySelectorAll('[data-family-preset]').forEach(function(b){ b.onclick = function(){
      var p = DailySupport.presets[b.getAttribute('data-family-preset')];
      state.familyDraft = Object.assign({}, p, {days:p.days.slice()}); state.familyMessage = ''; render();
      document.getElementById('familyTitle').focus();
    }; });
    app.querySelectorAll('[data-family-edit]').forEach(function(b){ b.onclick = function(){
      var r = state.routines.find(function(x){return x.id === b.getAttribute('data-family-edit');});
      if (!r) return;
      state.familyDraft = Object.assign({}, r, {days:(r.days || []).slice()}); state.familyMessage = ''; render();
      document.getElementById('familyTitle').focus();
    }; });
    app.querySelectorAll('[data-family-delete]').forEach(function(b){b.onclick = function(){
      requestRoutineDelete(b.getAttribute('data-family-delete'));
    };});
    var cancel = document.getElementById('familyCancel');
    if (cancel) cancel.onclick = function(){state.familyDraft = null; render();};
    var form = document.getElementById('familyForm');
    if (form) form.oninput = function(){
      state.familyDraft.title = form.elements.title.value;
      state.familyDraft.period = form.elements.period.value;
      state.familyDraft.days = Array.from(form.querySelectorAll('input[name="day"]:checked')).map(function(c){return Number(c.value);});
    };
    if (form) form.onsubmit = function(e){
      e.preventDefault();
      var title = form.elements.title.value.trim();
      var days = Array.from(form.querySelectorAll('input[name="day"]:checked')).map(function(c){return Number(c.value);});
      var error = document.getElementById('familyError');
      if (!title || !days.length) { error.textContent = !title ? 'やることを入力してください。' : '曜日を1つ以上えらんでください。'; return; }
      var draft = state.familyDraft;
      var period = form.elements.period.value;
      if (state.routines.some(function(r){return r.id !== draft.id && r.title === title && r.period === period && (r.days || []).some(function(d){return days.indexOf(d) !== -1;});})) {error.textContent = '同じ内容が登録されています。「変更する」から直せます。'; return;}
      var data = {title:title,days:days,period:period,dailyLife:true,kind:draft.kind || 'check',category:draft.category || 'その他',priority:1,minutes:draft.minutes || 0};
      state.familyDraft = null; state.familyMessage = '保存しました。下の日付で、表示する曜日を確認できます。';
      if (draft.id) persistUpdate('routines',draft.id,data);
      else persistAdd('routines',Object.assign(data,{skipDates:[]}));
    };
    var date = document.getElementById('familyDate');
    if (date) date.onchange = function(){ if (date.value) {state.familyDate = date.value; render();} };
    app.querySelectorAll('[data-family-pause]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-pause'); var r = state.routines.find(function(x){return x.id === id;});
      state.familyMessage = r.paused ? '曜日の設定に合わせて、また表示します。' : 'お休み中にしました。「また表示する」で戻せます。';
      persistUpdate('routines',id,{paused:!r.paused});
    };});
    app.querySelectorAll('[data-family-skip]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-skip');
      var input = Array.from(app.querySelectorAll('[data-family-skipdate]')).find(function(x){return x.getAttribute('data-family-skipdate') === id;});
      if (!input.value) { input.focus(); return; }
      var r = state.routines.find(function(x){return x.id === id;});
      var skip = (r.skipDates || []).slice(); if (skip.indexOf(input.value) === -1) skip.push(input.value);
      state.familyMessage = 'お休みの日を保存しました。あとから取り消せます。'; persistUpdate('routines',id,{skipDates:skip});
    };});
    app.querySelectorAll('[data-family-unskip]').forEach(function(b){b.onclick = function(){
      var id = b.getAttribute('data-family-unskip'); var date = b.getAttribute('data-date');
      var r = state.routines.find(function(x){return x.id === id;});
      state.familyMessage = 'お休みを取り消しました。'; persistUpdate('routines',id,{skipDates:(r.skipDates || []).filter(function(d){return d !== date;})});
    };});
  }

  function renderParentCalendar(){
    if (!state.calMonth) {
      var d = new Date();
      state.calMonth = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    }
    var parts = state.calMonth.split("-");
    var year = parseInt(parts[0],10), month = parseInt(parts[1],10); // month:1-12
    var firstDay = new Date(year, month-1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startWeekday = firstDay.getDay();
    var today = todayStr();
    var rewardDates = {};
    try { StudyKeepsakes.rewards().forEach(function(r){ rewardDates[r.date] = true; }); } catch(e) {}

    var html = '<div class="panel">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
      '<button class="icon-btn" id="calPrevMonth" style="background:var(--bg-parent);"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#5B6B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<h2 style="margin:0;">' + year + '年' + month + '月</h2>' +
      '<button class="icon-btn" id="calNextMonth" style="background:var(--bg-parent);"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#5B6B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '</div>';

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:4px;">' +
      WEEKDAY_LABELS.map(function(w){return '<div>'+w+'</div>';}).join("") + '</div>';

    var cells = [];
    for (var i=0;i<startWeekday;i++) cells.push('<div></div>');
    for (var day=1; day<=daysInMonth; day++){
      var dateStr = year + "-" + String(month).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      var items = combinedItemsForDate(dateStr);
      var hasEvent = state.events.some(function(e){ return eventOccursOnDate(e, dateStr); });
      var count = items.length;
      var achieved = !!rewardDates[dateStr] || (count > 0 && items.every(function(item){ return item.done; }));
      var isToday = dateStr === today;
      var isSelected = dateStr === state.calSelectedDate;
      cells.push('<button data-caldate="' + dateStr + '" style="' +
        'aspect-ratio:1;border-radius:10px;border:' + (isSelected?"2px solid var(--teal)":"1px solid var(--border)") + ';' +
        'position:relative;background:' + (isToday?"var(--teal-soft)":"var(--card)") + ';font-family:inherit;font-size:12px;color:var(--ink);' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;">' +
        (achieved ? '<span class="calendar-achievement" aria-label="ぜんぶできた日">★</span>' : '') +
        '<span>' + day + '</span>' +
        (count>0 ? '<span style="width:5px;height:5px;border-radius:50%;background:var(--coral);"></span>' : '') +
        (hasEvent ? '<span style="width:5px;height:5px;border-radius:50%;background:var(--yellow);"></span>' : '') +
        '</button>');
    }
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">' + cells.join("") + '</div>';
    html += '<div class="ri-sub" style="margin-top:8px;">⭐ ぜんぶできた日　🔴 ToDo・ルーチン　🟡 予定</div>';
    html += '</div>';

    if (state.calSelectedDate) {
      html += renderCalendarDayDetail_(state.calSelectedDate);
    }
    return html;
  }

      else html += '<h3>ToDo・ルーチン</h3><div class="row-list">' + items.map(function(t){

  function renderWeeklyMinutesChart(){
    var days = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      var mins = state.todos.filter(function(t){ return t.date === key && t.done; })
        .reduce(function(sum,t){ return sum + (t.minutes||0); }, 0);
      days.push({ label: WEEK[d.getDay()], mins: mins });
    }
    var max = Math.max(10, Math.max.apply(null, days.map(function(d){return d.mins;})));
    return '<div style="display:flex;align-items:flex-end;gap:8px;height:100px;">' +
      days.map(function(d){
        var h = Math.round((d.mins / max) * 80) + 4;
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">' +
          '<div style="font-size:10px;color:var(--ink-soft);margin-bottom:2px;">' + (d.mins||"") + '</div>' +
          '<div style="width:100%;background:var(--teal);border-radius:6px 6px 0 0;height:' + h + 'px;"></div>' +
          '<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">' + d.label + '</div>' +
          '</div>';
      }).join("") + '</div>';
  }

  function renderQuizHistoryPanel(){
    var quizzes = state.quizLogs;
    if (!quizzes || quizzes.length === 0) return '';
    var bars = quizzes.slice(0, 8).map(function(q){
      var d = new Date(q.date);
      var dateLabel = isNaN(d.getTime()) ? String(q.date) : (d.getMonth()+1) + "/" + d.getDate();
      var total = Number(q.total) || 1;
      var pct = Math.round((Number(q.score) / total) * 100);
      return '<div style="margin-bottom:10px;">' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:3px;">' +

  function renderPrintIntakePanel(){

      html += '<div class="warn-note">読み取りに失敗しました: ' + escapeHtml(state.printError) + '</div></div>';

    var ex = state.printExtract;
    if (!ex) {
      html += '<div class="future-note">手書き文字や不鮮明な写真は読み間違えることがあります。登録前に必ず内容を確認してください。</div></div>';

      '<div class="form-row"><label>宿題</label><input id="pxHomework" value="' + escapeHtml(ex.homework||"") + '"></div>' +
      '<div class="form-row"><label>持ち物</label><input id="pxItems" value="' + escapeHtml(ex.items||"") + '"></div>' +
      '<div class="form-row"><label>テスト範囲</label><input id="pxTestRange" value="' + escapeHtml(ex.testRange||"") + '"></div>';

      '<button class="btn-primary" id="printIgnore" style="margin-top:8px;background:var(--ink-soft);">この内容は使わない</button>' +
      '</div>';

  }

  function renderCalendarPanel(){
    if (state.calendarLoading) {
      return '<div class="panel"><h2>Googleカレンダーの予定（参考）</h2><div class="future-note">読み込み中…</div></div>';
    }
    var events = state.calendarEvents;
    if (!events) {
      return '<div class="panel"><h2>Googleカレンダーの予定（参考）</h2>' +
        '<div class="future-note">GASのGoogleアカウントに入っている予定を確認できます。</div>' +
        '<button class="btn-primary" id="loadCalendar" style="margin-top:10px;">読み込む</button></div>';
    }
    if (events.length === 0) {
      return '<div class="panel"><h2>Googleカレンダーの予定（参考）</h2><div class="future-note">直近の予定は見つかりませんでした。</div></div>';
    }
    var rows = events.map(function(ev){
      var d = new Date(ev.start);
      var label = isNaN(d.getTime()) ? ev.start : (d.getMonth()+1) + "/" + d.getDate() + (ev.allDay ? "" : " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"));

        '<div class="ri-sub">' + label + '</div></div></div>';

      '<button class="btn-primary" id="loadCalendar" style="margin-top:10px;">更新する</button></div>';

      WEEKDAY_LABELS.map(function(w,i){
        var active = evDays.indexOf(i) !== -1;
        return '<button type="button" class="ptab ' + (active?"active":"") + '" data-eventday="'+i+'" style="padding:8px 0;flex:1;">'+w+'</button>';

      '<div class="form-grid">' +

      '<div class="form-grid">' +
      '<div class="form-row"><label>教科・分類</label><select id="routineCat">' + Object.keys(CATS).map(function(c){return '<option '+((editingRoutine&&editingRoutine.category===c)?"selected":"")+'>'+c+'</option>';}).join("") + '</select></div>' +

      '</select></div>' +

  function renderRoutineRows(){
    if (state.routines.length === 0) return '<div class="future-note">まだルーチンが登録されていません。</div>';
    return state.routines.map(function(r){
      var days = r.days || [0,1,2,3,4,5,6];
      var dayStr = days.length === 7 ? "毎日" : days.slice().sort().map(function(d){return WEEKDAY_LABELS[d];}).join("");
      var skip = r.skipDates || [];
      var skipStr = skip.length ? ("除外: " + skip.map(fmtDate).join("、")) : "";
      return '<div class="row-item" style="align-items:flex-start;flex-direction:column;gap:6px;">' +
        '<div style="display:flex;width:100%;justify-content:space-between;">' +
        '<div class="ri-title">' + escapeHtml(r.title) + '</div>' +
        '<div style="display:flex;gap:4px;">' +
        '<button class="del-btn" data-editroutine="' + r.id + '" style="color:var(--teal);">✎</button>' +
        '<button class="del-btn" data-delroutine="' + r.id + '">✕</button></div></div>' +
        '<div class="ri-sub">' + escapeHtml(r.category) + ' ・ ' + (r.minutes||"-") + '分 ・ ' + dayStr + (skipStr ? " ・ "+skipStr : "") + '</div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' +
        '<input type="date" data-skipdate-input="' + r.id + '" style="font-size:12px;padding:6px;border-radius:8px;border:1px solid var(--border);">' +
        '<button class="btn-primary" data-addskip="' + r.id + '" style="width:auto;padding:6px 12px;font-size:12px;margin:0;">この日は休む</button>' +
        '</div></div>';
    }).join("");
  }

  function renderTodoRows(){
    var list = state.todos.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(0,20);
    if (list.length === 0) return '<div class="future-note">まだToDoが登録されていません。</div>';

      return '<div class="row-item"><div class="ri-main"><div class="ri-title">' + (t.done?"✅ ":"") + escapeHtml(t.title) + '</div>' +

        '<button class="del-btn" data-deltodo="' + t.id + '">✕</button></div>';
    }).join("");

  function renderEventRows(){
    var list = state.events.slice().sort(function(a,b){ return (a.date+(a.time||"")) < (b.date+(b.time||"")) ? -1 : 1; }).slice(0,20);
    if (list.length === 0) return '<div class="future-note">まだ予定が登録されていません。</div>';
    return list.map(function(e){
      var recurStr = e.recurring ? ((e.days||[]).slice().sort().map(function(d){return WEEKDAY_LABELS[d];}).join("") + "曜 毎週") : fmtDate(e.date);
      return '<div class="row-item"><div class="ri-main"><div class="ri-title">' + escapeHtml(e.title) + '</div>' +
        '<div class="ri-sub">' + recurStr + (e.time?" "+e.time:"") + " ・ " + (EVENT_TYPES[e.type]||"その他") + '</div></div>' +
        '<button class="del-btn" data-editevent="' + e.id + '" style="color:var(--teal);">✎</button>' +

  function renderUsagePanel(){
    if (state.usageLoading) {
      return '<div class="panel"><h2>AI利用額の目安</h2><div class="future-note">読み込み中…</div></div>';
    }
    var u = state.usage;
    if (!u) {
      return '<div class="panel"><h2>AI利用額の目安</h2>' +
        '<div class="future-note">まだ読み込んでいません。</div>' +
        '<button class="btn-primary" id="loadUsage" style="margin-top:10px;">読み込む</button></div>';
    }
    var statusColor = u.status === "over" ? "var(--coral)" : (u.status === "warn" ? "var(--yellow)" : "var(--teal)");
    var statusLabel = u.status === "over" ? "上限に達しています(新しいAI機能は一時停止中)" :
      (u.status === "warn" ? "そろそろ上限が近づいています" : "利用は落ち着いています");
    var cap = u.capJpy || 3000, warn = u.warnJpy || 1500;
    var pct = Math.min(100, Math.round((u.estimatedCostJpy / cap) * 100));

    return '<div class="panel"><h2>AI利用額の目安（' + escapeHtml(u.monthLabel) + '）</h2>' +
      '<p style="font-size:22px;font-weight:800;margin:4px 0;">約 ' + Number(u.estimatedCostJpy).toLocaleString() + ' 円 <span style="font-size:13px;font-weight:700;color:var(--ink-soft);">/ 上限 ' + Number(cap).toLocaleString() + ' 円</span></p>' +
      '<div style="background:var(--bg-parent);border-radius:99px;height:10px;overflow:hidden;margin:6px 0 4px;">' +
      '<div style="background:' + statusColor + ';height:100%;width:' + pct + '%;"></div></div>' +
      '<div class="ri-sub" style="color:' + statusColor + ';font-weight:700;">' + statusLabel + '</div>' +
      '<div class="ri-sub" style="margin-top:6px;">クイズ・プリント読み取り等のテキスト/画像AI呼び出し ' + u.textCalls + '回、Sora会話 ' + u.soraSessions + '回</div>' +
      '<div class="future-note" style="margin-top:8px;">' + escapeHtml(u.note || '') + '</div>' +
      '<button class="btn-primary" id="loadUsage" style="margin-top:10px;">更新する</button>' +
      '<h3>上限を変更する</h3>' +
      '<div class="form-grid">' +

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- フリガナ ---------------- */
  // よく使う単語には固定の読みを振る(確実に効く分)。
  // AIが生成する文章(クイズ・週次レポート等)は、プロンプト側で「漢字(かな)」の
  // 形式で読みを添えるよう指示しており、furiganaFromParens_ でそれを<ruby>に変換する。
  var FURIGANA_DICT = [
    ["教科書","きょうかしょ"],["理解度","りかいど"],["提出物","ていしゅつぶつ"],
    ["持ち物","もちもの"],["宿題","しゅくだい"],["準備","じゅんび"],
    ["学校","がっこう"],["明日","あした"],["予定","よてい"],
    ["問題","もんだい"],["単元","たんげん"],["復習","ふくしゅう"],
    ["会話","かいわ"],["記録","きろく"],["行事","ぎょうじ"],
    ["範囲","はんい"],["算数","さんすう"],["国語","こくご"],
    ["理科","りか"],["社会","しゃかい"],["英語","えいご"],
    ["薬","くすり"],["飲む","のむ"],["練習","れんしゅう"],
    ["提出","ていしゅつ"],["期限","きげん"]
  ].sort(function(a,b){ return b[0].length - a[0].length; });

  function addFurigana(rawText){
    var escaped = escapeHtml(rawText);
    FURIGANA_DICT.forEach(function(pair){
      if (escaped.indexOf(pair[0]) === -1) return;
      escaped = escaped.split(pair[0]).join('<ruby>'+pair[0]+'<rt>'+pair[1]+'</rt></ruby>');
    });
    return escaped;
  }

  // AIが「漢字(かな)」の形式で返した読みを<ruby>タグに変換する。
  // かな以外が()内に来るケースは変換しない(誤爆防止)。
  function furiganaFromParens(rawText){
    var escaped = escapeHtml(rawText);
    return escaped.replace(/([\u4E00-\u9FFF]+)\(([\u3041-\u3096\u30FC]+)\)/g, function(m, kanji, kana){
      return '<ruby>' + kanji + '<rt>' + kana + '</rt></ruby>';
    });
  }

  initFamilySync();
  var localPreview=['127.0.0.1','localhost'].includes(location.hostname);
  if(!localPreview)KeepsakeSync.connect(function(body){return FamilyAuth.request(body);});
  else KeepsakeSync.refresh();
  document.getElementById('appVersion').textContent='v'+APP_VERSION;
  document.getElementById('refreshKeepsakes').onclick=syncAllNow;
  window.addEventListener('keepsake-status',updateGlobalSyncBar);
  updateGlobalSyncBar();
  window.addEventListener('online',function(){KeepsakeSync.refresh();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)KeepsakeSync.refresh();});
  setInterval(function(){if(!document.hidden)KeepsakeSync.refresh();},45000);
  window.addEventListener('keepsakes-updated',function(){if(!['parent','sora','sola','kumi'].includes(state.view))render();});
  render();
  initDb();
  pullFromGas();
  // 日付をまたいで開いたままでも、前日のチェックを翌日に持ち越さない。
  var renderedDay = todayStr();
  function refreshDay(){
    if (renderedDay !== todayStr() && state.view !== 'parent') { renderedDay = todayStr(); state.focusedTaskId = null; render(); }
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) {refreshDay(); if (state.view !== 'parent') pullFromGas();} });
  setInterval(refreshDay, 60000);
  setInterval(function(){ if (!document.hidden && state.view !== 'parent') pullFromGas(); }, 45000);
  window.addEventListener('online', pullFromGas);
  }
  FamilyAuth.boot(startApp);
})();
</script>
</body>
</html>
